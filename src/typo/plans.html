<!doctype html><html lang="fr"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Typologies Saxon</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<!-- Les feuilles du site : la page parle la langue du Massing — son rail en
     chaîne, sa barre de vues, sa carte posée sur le plan —, avec ses tokens. -->
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/controls.css">
<link rel="stylesheet" href="../../styles/massing.css">
<script>
/* Le thème et le mode du site, avant le premier rendu : ses attributs, et la
   feuille du thème s'il en a chargé une. */
try {
  var H0 = parent.document.documentElement, H1 = document.documentElement;
  ["data-theme", "data-mode"].forEach(function(a){ var v = H0.getAttribute(a); if(v) H1.setAttribute(a, v); });
  parent.document.querySelectorAll('link[href*="styles/themes/"]').forEach(function(l){
    var n = document.createElement("link"); n.rel = "stylesheet"; n.href = l.href; document.head.appendChild(n);
  });
} catch(e){}
</script>
<style>
/* Le chrome est celui du Massing (`styles/massing.css`). Ici, le seul DESSIN :
   un rendu de concours — poché noir, cloisons à l'échelle, mobilier au trait
   fin, familles en lavis. Sa palette est à lui, et suit le mode du site. */
:root{
  --paper:#FBFAF7; --paper-2:#F1EFEA; --panel:#FFFFFF; --ink:#1D1F1E; --ink-soft:#5E6662;
  --line:#DAD7D0; --hatch:#B9B5AC; --plan-accent:#2F5D50; --wash:20%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-mode="light"]){
    --paper:#171918; --paper-2:#202322; --panel:#1C1F1E; --ink:#ECEAE4; --ink-soft:#A3A9A5;
    --line:#343836; --hatch:#4A4F4C; --plan-accent:#8CC5B2; --wash:30%;
  }
}
:root[data-mode="dark"]{
  --paper:#171918; --paper-2:#202322; --panel:#1C1F1E; --ink:#ECEAE4; --ink-soft:#A3A9A5;
  --line:#343836; --hatch:#4A4F4C; --plan-accent:#8CC5B2; --wash:30%;
}
body{ padding-inline:var(--s-4); }
.mass-rail{ max-height:calc(100vh - 2 * var(--s-4)); }
/* la planche : le cadre du plan du Massing, la hauteur d'un dessin d'étage */
.stage{ position:relative; height:min(72vh, 780px); min-height:420px; background:var(--paper);
  border:1px solid var(--border); border-radius:var(--radius-md);
  overflow:hidden; touch-action:none; cursor:grab; }
.stage.drag{ cursor:grabbing; }
.stage svg{ width:100%; height:100%; display:block; }
.ptip{ position:absolute; pointer-events:none; background:var(--primary); color:var(--primary-foreground);
  padding:var(--s-2) var(--s-3); border-radius:var(--radius-md); max-width:260px;
  font-size:var(--t-xs); box-shadow:var(--shadow-md); }
.ptip b{ display:block; font-weight:600; }
.ptip span{ font-family:var(--font-mono); font-size:var(--t-2xs); opacity:.85; }
.cartouche{ position:absolute; right:var(--s-3); bottom:var(--s-3); background:var(--panel);
  border:1px solid var(--ink); font-size:var(--t-3xs); display:grid; grid-template-columns:auto auto; pointer-events:none; }
.cartouche div{ padding:3px var(--s-2); border-bottom:1px solid var(--line); }
.cartouche div:nth-child(odd){ color:var(--ink-soft); border-right:1px solid var(--line); }
.cartouche div:nth-last-child(-n+2){ border-bottom:0; }
@media (max-width:560px){ .cartouche{ display:none; } }
/* la carte de la pièce choisie descend du coin bas-gauche : la cartouche tient le bas-droit */
.mass-carte input{ inline-size:6em; min-block-size:var(--ctl-h); padding:0 var(--s-2); font:inherit; font-size:var(--t-xs);
  color:var(--foreground); background:var(--card); border:1px solid var(--input); border-radius:var(--radius-md); text-align:right; }
/* le bilan du niveau, le contrôle, la légende */
.typo-bil{ display:grid; grid-template-columns:1fr auto; gap:2px var(--s-3); font-size:var(--t-2xs); color:var(--soft-foreground); }
.typo-bil .v{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; text-align:right; color:var(--foreground); }
.typo-bil .sep{ grid-column:1/-1; border-top:1px solid var(--border-soft); margin:2px 0; }
.typo-non{ margin:0; padding:0; list-style:none; font-size:var(--t-2xs); display:flex; flex-direction:column; gap:2px; }
.typo-non li{ display:flex; justify-content:space-between; gap:var(--s-2); color:var(--soft-foreground); }
.typo-non li span:last-child{ font-family:var(--font-mono); color:var(--warn); }
.typo-ctl{ margin:0; padding:0; list-style:none; font-size:var(--t-2xs); display:flex; flex-direction:column; gap:var(--s-2); }
.typo-ctl li{ display:grid; grid-template-columns:auto 1fr; gap:var(--s-2); align-items:start; color:var(--soft-foreground); }
.typo-ctl li .chip{ margin-top:2px; }
.typo-ctl li small{ grid-column:2; color:var(--muted-foreground); font-size:var(--t-3xs); line-height:var(--lh-base); }
.typo-legend{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s-1) var(--s-3); font-size:var(--t-2xs); color:var(--soft-foreground); }
.typo-legend i{ display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:var(--s-2); vertical-align:-1px; border:1px solid var(--muted-foreground); }
/* les postes du niveau, sous la planche */
.typo-tab{ overflow-x:auto; }
.typo-tab table{ border-collapse:collapse; width:100%; min-width:540px; font-size:var(--t-xs); }
.typo-tab th, .typo-tab td{ text-align:left; padding:var(--s-1) var(--s-2); border-bottom:1px solid var(--border-soft); }
.typo-tab th{ font-size:var(--t-3xs); text-transform:uppercase; letter-spacing:var(--track-caps); color:var(--muted-foreground); font-weight:600; border-bottom-color:var(--border); }
.typo-tab td.n{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; text-align:right; }
.typo-tab th.n{ text-align:right; }
.typo-tab td .dot{ display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:var(--s-2); }
.st-ok{ color:var(--ok); } .st-warn{ color:var(--warn); } .st-hors{ color:var(--muted-foreground); }
/* ---- le dessin ---- */
.mur{fill:var(--ink)}
.circ{fill:var(--paper-2)}
.room{stroke:var(--ink);stroke-width:.10}
.cell{stroke:var(--ink);stroke-width:.10}
.fam-cla{fill:color-mix(in oklab,var(--f-cla) var(--wash),var(--paper))}
.fam-adm{fill:color-mix(in oklab,var(--f-adm) var(--wash),var(--paper))}
.fam-eau{fill:color-mix(in oklab,var(--f-eau) var(--wash),var(--paper))}
.fam-tec{fill:color-mix(in oklab,var(--f-tec) var(--wash),var(--paper))}
.fam-spo{fill:color-mix(in oklab,var(--f-spo) var(--wash),var(--paper))}
.fam-uap{fill:color-mix(in oklab,var(--f-uap) var(--wash),var(--paper))}
.fam-pis{fill:color-mix(in oklab,var(--f-pis) var(--wash),var(--paper))}
.fam-ext{fill:color-mix(in oklab,var(--f-ext) var(--wash),var(--paper))}
.mono .room,.mono .cell{fill:var(--paper)}
.room:hover,.cell:hover{fill:color-mix(in oklab,var(--plan-accent) 22%,var(--paper))}
.cagef{fill:var(--paper);stroke:var(--ink);stroke-width:.10}
.part{stroke:var(--ink);stroke-width:.10;fill:none}
/* on coupe dans les murs : ils sont pochés, plein noir — 50 cm dehors, 10 cm dedans */
.gap{fill:var(--paper-2)}
.gapw{fill:var(--paper)}
.porte{stroke:var(--ink);fill:none;stroke-width:.7;vector-effect:non-scaling-stroke}
.arc{stroke:var(--ink-soft);fill:none;stroke-width:.5;vector-effect:non-scaling-stroke;stroke-dasharray:2 2}
.vitre{stroke:var(--ink);stroke-width:.5;vector-effect:non-scaling-stroke;fill:none}
.mb{fill:none;stroke:var(--ink);stroke-width:.55;vector-effect:non-scaling-stroke}
.mb.ch{stroke:var(--ink-soft)}
.mb.eq{fill:color-mix(in oklab,var(--ink) 7%,transparent)}
.mb.tab{fill:var(--ink)}
.mb.cab{stroke-width:.45}
.mb.pmr{stroke-dasharray:3 2;stroke:var(--ink-soft)}
.mb.pat{stroke-dasharray:1.5 1.5}
.mb.rid{stroke-dasharray:6 3;stroke:var(--ink-soft)}
.mb.tapis{fill:color-mix(in oklab,var(--f-uap) 18%,transparent);stroke:var(--ink-soft)}
.mb.terrain{stroke:var(--f-spo);stroke-width:.8}
.mb.bassin{fill:color-mix(in oklab,var(--f-pis) 30%,transparent);stroke:var(--ink)}
.mb.ligne{stroke:var(--f-pis);stroke-dasharray:4 3}
.mb.lit{stroke-width:.45}
.mb.marche{stroke-width:.45}
.mb.asc{fill:color-mix(in oklab,var(--ink) 10%,transparent)}
.mb.fleche{stroke-width:.6;marker-end:url(#fl)}
.site{fill:none;stroke:var(--ink-soft);stroke-width:.9;vector-effect:non-scaling-stroke;stroke-dasharray:8 4 2 4}
.exist{fill:var(--hatch);stroke:var(--ink-soft);stroke-width:.5;vector-effect:non-scaling-stroke}
.ombre{fill:none;stroke:var(--ink-soft);stroke-width:.6;vector-effect:non-scaling-stroke;stroke-dasharray:3 3}
.lab{font-family:var(--font-sans);fill:var(--ink);font-weight:600;pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-width:.14;stroke-linejoin:round}
.lab .m2{font-family:var(--font-mono);font-weight:400;fill:var(--ink-soft)}
.dim{stroke:var(--ink-soft);stroke-width:.6;vector-effect:non-scaling-stroke}
.dimt{font-family:var(--font-mono);fill:var(--ink-soft);pointer-events:none}
.entree{fill:var(--plan-accent)}
.nord{fill:var(--ink)}
.hideF .mbg{display:none}
.hideD .dimg{display:none}
.hideS .siteg{display:none}
@media (prefers-reduced-motion:no-preference){.stage svg g.vue{transition:opacity .2s}}
</style></head><body>

<section class="mass">
<div class="mass-grid">
  <!-- Le rail, en chaîne comme celui du Massing : ce qui PROPOSE en tête,
       toujours visible ; puis les étapes, chacune repliable et portant son état ;
       Emporter au pied. -->
  <aside class="mass-rail" aria-label="Commandes des typologies">
    <section class="mass-prop">
      <h2 class="mass-prop__h">Proposer</h2>
      <button class="btn btn--primary mass-tir" type="button" id="shuffle"
              title="Réordonne les pièces : l'ordre des familles, celui des postes, le bout du noyau. Les volumes, leurs cotes et la répartition ne bougent pas.">
        <span id="ic-shuffle"></span>
        <span class="mass-tir__t"><b>Shuffle typologie</b><span>autre plan, mêmes volumes</span></span>
      </button>
      <div class="mass-nav">
        <span class="mass-nav__r" id="cadre-l"></span>
        <div class="mass-seed">
          <span class="segcap">Seed</span>
          <input type="text" id="seed" class="mono" size="7" spellcheck="false" autocomplete="off"
                 aria-label="Seed du tirage typologie — retape-la pour rejouer le même plan"
                 title="Retape une seed et rejoue le plan à l'identique, dans les mêmes volumes">
        </div>
      </div>
    </section>
    <ol class="mass-etapes" id="etapes"></ol>
    <section class="mass-emporter" aria-label="Emporter">
      <button class="btn" type="button" id="copy">Copier le SVG</button>
    </section>
  </aside>

  <div class="mass-main">
    <!-- Ce qu'on REGARDE : le niveau, les couleurs, ce qui se dessine, le cadrage. -->
    <div class="mass-barre" role="toolbar" aria-label="Affichage du plan">
      <div class="mass-barre__et"><span class="mass-barre__l">Niveau</span><div class="btn-group" id="niv" role="group" aria-label="Niveau montré"></div></div>
      <div class="btn-group" id="couleurs" role="group" aria-label="Couleurs"></div>
      <div class="btn-group" id="montre" role="group" aria-label="Ce qui se dessine"></div>
      <span class="spacer"></span>
      <div class="btn-group" role="group" aria-label="Cadrage">
        <button class="btn btn--icon" type="button" id="z-out" aria-label="Dézoomer" title="Dézoomer">−</button>
        <button class="btn btn--icon" type="button" id="z-in" aria-label="Zoomer" title="Zoomer">+</button>
        <button class="btn" type="button" id="z-fit">Cadrer</button>
      </div>
    </div>
    <div class="mass-vue">
      <div class="mass-vue__h"><h3 class="label" id="titre">Plan</h3><span class="spacer"></span><span class="mass-cam mono" id="sous"></span></div>
      <div class="mass-vue__cadre">
        <div class="stage" id="stage">
          <svg id="svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Plan d'étage">
            <defs>
              <pattern id="hach" width="0.8" height="0.8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                <rect width="0.8" height="0.8" fill="var(--paper)"/>
                <line x1="0" y1="0" x2="0" y2="0.8" stroke="var(--hatch)" stroke-width="0.12"/>
              </pattern>
              <marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <g id="vue" class="vue"></g>
          </svg>
          <div class="ptip" id="ptip" hidden></div>
          <div class="cartouche" id="cartouche"></div>
        </div>
        <div class="mass-carte" id="carte" hidden></div>
      </div>
    </div>
    <div class="mass-vue">
      <div class="mass-vue__h"><h3 class="label">Postes du niveau</h3></div>
      <div class="typo-tab">
        <table id="tab">
          <thead><tr><th>Poste</th><th class="n">Nb</th><th class="n">Demandé m²</th><th class="n">Dessiné m²</th><th>État</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</section>

<script>
/* Les données vivent dans le projet : l'onglet Typologies les donne à
   l'ouverture (`src/typo/donnees.js`). Ouverte seule, la page n'a rien à dessiner. */
var DATA = null;
try { DATA = parent !== window && parent.typoDonnees ? parent.typoDonnees() : null; } catch(e){}
</script>
<script>
/* ===== Générateur de plans : lit la pile du mixer et les volumes du massing =====
   Règles tenues :
   - une surface de programme ne change pas : largeur = surface ÷ profondeur de bande ;
   - chaque corps garde les cotes que le Massing lui a données : le plan se
     dessine DEDANS, et ce qui n'y tient pas est dit non posé — jamais le
     volume ne s'allonge ;
   - la seed (`DATA.graine`) ne change que l'ordonnance : l'ordre des
     familles, celui des postes dans une famille, le bout du noyau ;
   - le couloir se place là où les deux bandes finissent ensemble ;
   - un noyau escalier + ascenseur par bâtiment et par niveau, aux mêmes cotes
     et au même endroit à tous les niveaux ;
   - un couloir finit toujours sur quelque chose : un noyau, un hall, un passage
     vers le corps voisin, ou la porte de la pièce qui le ferme ;
   - les pièces d'une famille se suivent ; une largeur de pièce se règle au
     module de 0,50 m, sa profondeur suit. */
var PG = (function(){
  /* les règles du projet, données par l'onglet (`typo/donnees.js`) */
  var R0 = (typeof DATA !== "undefined" && DATA && DATA.regles) || {};
  var COULOIR = R0.couloir || 2.40, MUR = R0.mur || 0.50, CLOISON = R0.cloison || 0.10,
      CAGE_A = R0.cage || 24, NOY = R0.noyau || { prof:5, volee:1.2, asc:[2.1, 2.4] },
      FEU = R0.feu || { cageSeuil:900, fuiteSimple:35, fuiteDouble:50 },
      LIEN = R0.lien || 15, MODULE = R0.module || 0.5,
      FRONT_MAX = 12.5, PETIT = 30, BMIN = 5.6, PALIER = 1.2;
  /* l'ordre des familles : les pièces d'une famille se posent ensemble */
  var FAMS_O = ["cla", "eau", "uap", "adm", "spo", "tec", "pis", "ext"];
  var WC = 2 * NOY.volee + 0.10 + NOY.asc[0] + CLOISON;     /* largeur du noyau */
  var FL = [];                                               /* les niveaux */
  /* LA SEED : un tirage PUR de la seed et d'un nom — le même à chaque appel, si
     bien que le contrôle, l'écran et le Rendu voient le même plan. */
  var GR = 1;
  function alea(nom){
    var h = (GR ^ 0x9E3779B9) >>> 0;
    for(var i = 0; i < nom.length; i++) h = Math.imul(h ^ nom.charCodeAt(i), 16777619) >>> 0;
    h = Math.imul(h ^ (h >>> 15), 0x2C1B3C6D) >>> 0;
    return ((h ^ (h >>> 12)) >>> 0) / 4294967296;
  }
  var FAMS0 = FAMS_O.slice();

  function chapOf(key){ return key.split("|")[0]; }
  function local(cx, cy, a, x, y){
    var c = Math.cos(a), s = Math.sin(a);
    return [cx + x * c - y * s, cy + x * s + y * c];
  }
  function unites(rooms){
    var out = [];
    rooms.forEach(function(r){
      if(r.hors) return;
      var base = { key:r.key, n:r.n, f:r.f, chap:chapOf(r.key) };
      /* chaque pièce pour elle-même, même un WC de 2 m² : un lien « auprès de
         chaque classe » ne se tient qu'avec des WC répartis */
      for(var k = 0; k < r.q; k++)
        out.push(Object.assign({}, base, { a:r.u, lab:r.n + (r.q > 1 ? " " + (k + 1) : "") }));
    });
    return out;
  }
  function famO(u){ var k = FAMS_O.indexOf(u.f); return k < 0 ? 99 : k; }
  /* la bande A (y local < 0) regarde (sin a, −cos a) ; le sud est (0, −1) */
  function bandeSud(a){ return Math.cos(a) > 0 ? "A" : "B"; }
  function lvlDe(i){ return FL[i] ? FL[i].lvl : 0; }

  /* LES NOYAUX D'UN BÂTIMENT. Les corps d'un même bâtiment (`bat`) s'accolent
     et leurs couloirs se prolongent : un noyau dessert tout le bâtiment au
     niveau où il est. On en pose dans le corps le plus haut, puis dans tout
     corps qui porte un niveau que les noyaux posés ne desservent pas, puis là
     où l'évacuation ou le seuil de 900 m² le demandent. */
  var HOTES = null;
  function hotes(vols){
    if(HOTES) return HOTES;
    HOTES = {};
    var G = {};
    vols.forEach(function(v){ if(!v.lv.some(function(e){ return e.keys; })) (G[v.bat || v.id] = G[v.bat || v.id] || []).push(v); });
    Object.keys(G).forEach(function(k){
      var g = G[k], M = g.filter(function(v){ return v.lv.length > 1; });
      if(!M.length) return;
      M.sort(function(p, q){ return (q.lv.length - p.lv.length) || (q.lv[0].w * q.lv[0].d - p.lv[0].w * p.lv[0].d); });
      var cx = 0, cy = 0; g.forEach(function(v){ cx += v.x / g.length; cy += v.y / g.length; });
      var pris = [M[0]], niv = {};
      M[0].lv.forEach(function(e){ niv[e.i] = 1; });
      M.forEach(function(v){
        if(pris.indexOf(v) < 0 && v.lv.some(function(e){ return !niv[e.i]; })){ pris.push(v); v.lv.forEach(function(e){ niv[e.i] = 1; }); }
      });
      /* hors du rez — d'où l'on sort par la façade —, chaque point d'un niveau
         doit tenir la voie d'évacuation jusqu'à un noyau ; chaque niveau de plus
         de 900 m² en veut deux. On ajoute le corps le plus mal desservi tant
         que ce n'est pas tenu. */
      var LV = (typeof DATA !== "undefined" && DATA) ? DATA.floors : [];
      function horsRez(i){ return !LV[i] || LV[i].lvl !== 0; }
      function coins4(v, e){ var w = e.w / 2, d = e.d / 2, dx = e.dx || 0, dy = e.dy || 0;
        return [[-w, -d], [w, -d], [w, d], [-w, d]].map(function(q){ return local(v.x, v.y, v.a, q[0] + dx, q[1] + dy); }); }
      /* le corps à ajouter : celui qui, parmi les corps à étages pas encore
         équipés, est le plus près du point le plus mal desservi */
      function manque(){
        var aire = {}, pire = null, pd = 0;
        g.forEach(function(v){ v.lv.forEach(function(e){ aire[e.i] = (aire[e.i] || 0) + e.w * e.d; }); });
        g.forEach(function(v){
          v.lv.forEach(function(e){
            if(!horsRez(e.i)) return;
            var H = pris.filter(function(h){ return h.lv.some(function(x){ return x.i === e.i; }); });
            var lim = H.length > 1 ? FEU.fuiteDouble : FEU.fuiteSimple;
            coins4(v, e).forEach(function(c){
              var d = Infinity;
              H.forEach(function(h){ d = Math.min(d, Math.abs(c[0] - h.x) + Math.abs(c[1] - h.y)); });
              var ex = Math.max(d - lim, aire[e.i] > FEU.cageSeuil && H.length < 2 ? 1 : 0);
              if(ex <= pd) return;
              var cand = M.filter(function(u){ return pris.indexOf(u) < 0 && u.lv.some(function(x){ return x.i === e.i; }); })
                .sort(function(p, q){ return Math.hypot(p.x - c[0], p.y - c[1]) - Math.hypot(q.x - c[0], q.y - c[1]); })[0];
              if(cand){ pd = ex; pire = cand; }
            });
          });
        });
        return pire;
      }
      for(var t = 0, add; t < M.length && (add = manque()); t++) pris.push(add);
      var aire1 = 0; M[0].lv.forEach(function(e){ aire1 = Math.max(aire1, e.w * e.d); });
      var deux = pris.length < 2 && (aire1 > FEU.cageSeuil || M[0].lv[0].w > FEU.fuiteSimple) && g.length === 1;

  /* ---------- un niveau ---------- */

        o.push(R(u, v, 0.8, 1.9, "lit")); o.push(R(u + 0.8, v, 0.8, 1.9, "lit"));
      }
    return o;
  }
  function chauffage(W, H){
    var o = [];
    for(var k = 0; k < 3; k++) o.push(C(3 + k * 4.2, H / 2, 1.2, "eq"));
    o.push(R(W - 4, 1, 3, H - 2, "eq"));
    return o;
  }
  function technique(W, H){
    var o = [];
    for(var u = 1.2; u + 1.6 <= W - 0.6; u += 2.8) o.push(R(u, H * 0.25, 1.6, Math.min(3, H * 0.5), "eq"));
    return o;
  }
  function concierge(W, H){
    var o = bureau(Math.min(W, 3), H);
    if(W > 4){ o.push(R(W - 0.7, 0.9, 0.6, H - 1.6)); }
    o.push(R(W / 2, 0.06, 0.6, 0.5, "eq"));
    return o;
  }
  /* le NOYAU : l'escalier à deux volées et, à côté, la gaine d'ascenseur côté
     façade, le palier commun côté couloir. Ses cotes sont celles du projet
     (`RULES.circ.noyau`) : elles ne changent pas d'un étage à l'autre. */
  function cage(W, H){
    var o = [], A = PG.NOY.asc, c = PG.CLOISON;
    var wa = Math.min(A[0], W * 0.45), ws = W - wa - c;
    var fw = Math.min(PG.NOY.volee, (ws - 0.1) / 2), pal = Math.min(1.5, H * 0.3);
    var v0 = pal, v1 = H - 0.15;
    o.push(L(fw + 0.05, v0, fw + 0.05, v1, "pat"));
    for(var v = v0; v <= v1 + 1e-6; v += 0.28){ o.push(L(0, v, fw, v, "marche")); o.push(L(ws - fw, v, ws, v, "marche")); }
    o.push(L(fw / 2, v0 + 0.2, fw / 2, v1 - 0.2, "fleche"));
    o.push(R(ws, Math.max(0, H - Math.min(A[1], H - 1.4) - c), c, Math.min(A[1], H - 1.4) + c, "tab"));
    var ha = Math.min(A[1], H - 1.4);
    o.push(R(ws + c, H - ha, wa, ha, "asc"));
    o.push(L(ws + c, H - ha, W, H, "ch")); o.push(L(W, H - ha, ws + c, H, "ch"));
    o.push(R(ws + c, H - ha - c, wa, c, "tab"));
    return o;
  }

  function pour(r, W, H){
    var n = r.n || "";
    if(r.kind === "cage") return cage(W, H);
    if(/sport double/i.test(n)) return sport(W, H);
    if(/^Piscine/i.test(n)) return piscine(W, H);
    if(/chauffage/i.test(n)) return chauffage(W, H);
    if(/Abri/i.test(n)) return abri(W, H);
    if(/classe|dédoublement/i.test(n)) return classe(W, H);
    if(/ACM/.test(n) && !/Dépôt/.test(n)) return acm(W, H);
    if(/appui|pédago/i.test(n)) return appui(W, H);
    if(/activité/i.test(n)) return activite(W, H);
    if(/maîtres/i.test(n)) return maitres(W, H);
    if(/réunion/i.test(n)) return tableReunion(W, H, []);
    if(/détente|pause/i.test(n)) return detente(W, H);
    if(/Bureau/i.test(n)) return bureau(W, H);
    if(/reproduction/i.test(n)) return repro(W, H);
    if(/PMR|individuelle/i.test(n)) return wc(W, H, 1, true);
    if(/WC|Toilette/i.test(n)) return wc(W, H, r.cab || 2);
    if(/Vestiaires (élèves|professeurs)/i.test(n)) return vestiaire(W, H, true);
    if(/Vestiaires de classe/i.test(n)) return vestiaireClasse(W, H);
    if(/Cuisine/i.test(n)) return cuisine(W, H);
    if(/Réfectoire/i.test(n)) return refectoire(W, H);
    if(/Hall|foyer/i.test(n)) return hall(W, H, /foyer/i.test(n));
    if(/Scène/i.test(n)) return scene(W, H);
    if(/Conciergerie/i.test(n)) return concierge(W, H);
    if(/technique|CVSE/i.test(n)) return technique(W, H);
    if(/rangement|Dépôt|Économat|nettoyage/i.test(n)) return etageres(W, H, [], W > H ? "f" : "gd", 0.5);
    return [];
  }
  return { pour:pour };
})();
if(typeof module !== "undefined") module.exports = MEUBLES;

<script>
(function(){
  var FAMS = [["cla","Classes"],["adm","Personnel"],["eau","Eau, sanitaires"],["tec","Technique"],
              ["spo","Sport"],["uap","UAPE"],["pis","Piscine"]];
  function rien(t){ document.body.innerHTML = '<section class="mass"><p class="mass-note" style="max-width:60ch">' + t + '</p></section>'; }
  if(!DATA){ rien("Ouvre cette page depuis l\u2019onglet Typologies du projet."); return; }
  if(!DATA.partis.courant.vols.length){ rien("Aucune volumétrie à dessiner : répartis d\u2019abord le programme dans le Programme mixer, puis pose les volumes dans le Massing. Les plans se dessinent ensuite ici, dans ces volumes."); return; }
  /* ce qu'on REGARDE seulement — niveau, couleurs, calques : une préférence de
     cet appareil. La seed, elle, est au projet (`typo/etat.js`). */
  var st = { niv:1, meubles:true, couleurs:true, cotes:true, site:true };
  try { var s0 = JSON.parse(localStorage.getItem("typo-saxon") || "null"); if(s0) Object.assign(st, s0); } catch(e){}
  st.parti = "courant";
  if(!(st.niv < DATA.floors.length)) st.niv = Math.max(0, DATA.floors.findIndex(function(f){ return f.lvl === 0; }));
  function save(){ try { localStorage.setItem("typo-saxon", JSON.stringify({ niv:st.niv, meubles:st.meubles, couleurs:st.couleurs, cotes:st.cotes, site:st.site })); } catch(e){} }

  var $ = function(id){ return document.getElementById(id); };
  var svg = $("svg"), vue = $("vue"), stage = $("stage"), tip = $("ptip");
  var INFO = [];
  var fmt = function(x, d){ return x.toLocaleString("fr-CH", { minimumFractionDigits:d == null ? 1 : d, maximumFractionDigits:d == null ? 1 : d }); };
  function ic(n, t){ try { return parent.typoIcone ? parent.typoIcone(n, t) : ""; } catch(e){ return ""; } }

  /* ---------- proposer : Shuffle typologie et sa seed ----------
     Le geste de l'onglet. Il ne touche ni au programme ni aux volumes : seule
     l'ordonnance des pièces change. Le bouton et le champ passent par un seul
     chemin, `rejouer()` : une seed retapée rend ce que le tirage avait montré. */
  $("ic-shuffle").outerHTML = ic("shuffle", 18);
  var seedIn = $("seed");
  function seedTxt(){ return (DATA.graine >>> 0).toString(36); }
  function suivante(g){ return (g * 1103515245 + 12345) >>> 8 || 1; }
  function rejouer(g){
    if(parent.typoGraine) parent.typoGraine(g);
    DATA = parent.typoDonnees();
    PG.oublier(); CTL = null; choisir(null); dessiner(false);
  }
  $("shuffle").addEventListener("click", function(){ rejouer(suivante(DATA.graine)); });
  seedIn.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); seedIn.blur(); } });
  seedIn.addEventListener("change", function(){
    var g = parseInt(String(seedIn.value).trim().replace(/^\s*seed[\s:]+/i, ""), 36);
    if(!(g > 0)){ seedIn.value = seedTxt(); return; }
    rejouer(g >>> 0);
  });
  var vols0 = DATA.partis.courant.vols, corps = vols0.filter(function(v){ return !v.ph; }).length;
  $("cadre-l").innerHTML = '<b class="mono">' + corps + '</b> volume' + (corps > 1 ? "s" : "") + " du Massing";
  $("cadre-l").title = DATA.partis.courant.n + " — les volumes, leurs cotes et la répartition viennent des onglets précédents ; le Shuffle ne les touche pas.";

  /* ---------- la barre : ce qu'on regarde ---------- */
  function bouton(txt, titre, presse, fn){
    var b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = txt;
    if(titre) b.title = titre;
    b.setAttribute("aria-pressed", presse ? "true" : "false");
    b.addEventListener("click", fn);
    return b;
  }
  var seg = $("niv");
  DATA.floors.forEach(function(fl, i){
    seg.appendChild(bouton(fl.short.replace("ᵉʳ","er").replace("ᵉ","e"), fl.name, false, function(){ st.niv = i; save(); choisir(null); dessiner(false); }));
  });
  function barre(){
    var c = $("couleurs"), m = $("montre");
    c.innerHTML = ""; m.innerHTML = "";
    [["Programme", true, "Couleurs du programme, famille par famille"], ["Monochrome", false, "Le plan seul, au trait et au poché"]].forEach(function(o){
      c.appendChild(bouton(o[0], o[2], st.couleurs === o[1], function(){ st.couleurs = o[1]; save(); classes(); barre(); }));
    });
    [["meubles", "Mobilier"], ["cotes", "Cotes"], ["site", "Site"]].forEach(function(o){
      m.appendChild(bouton(o[1], o[1] === "Site" ? "Périmètre, existant et volumes absents du niveau" : null, st[o[0]], function(){ st[o[0]] = !st[o[0]]; save(); classes(); barre(); }));
    });
  }
  barre();
  function classes(){
    svg.classList.toggle("hideF", !st.meubles); svg.classList.toggle("hideD", !st.cotes);
    svg.classList.toggle("hideS", !st.site); svg.classList.toggle("mono", !st.couleurs);
  }

  /* ---------- le rail : les étapes ----------
     Chacune son numéro, son nom, une ligne qui dit ce qu'elle porte, et son
     ÉTAT à droite — la seule chose qu'on lise sans l'ouvrir. */
  var OUVERT = {};
  function etape(id, num, titre, sous, etat, corps, ouvrir){
    var li = document.createElement("li"); li.className = "mass-etape";
    var d = document.createElement("details");
    d.open = OUVERT[id] != null ? OUVERT[id] : !!ouvrir;
    d.innerHTML = '<summary class="mass-etape__s"><span class="mass-etape__num mono">' + num + '</span>' +
      '<span class="mass-etape__t"><b>' + titre + '</b>' + (sous ? '<span>' + sous + '</span>' : "") + '</span>' +
      '<span class="mass-etape__e">' + (etat || "") + '</span>' + ic("chevron", 14) + '</summary>' +
      '<div class="mass-etape__b">' + corps + '</div>';
    d.addEventListener("toggle", function(){ OUVERT[id] = d.open; });
    li.appendChild(d);
    return li;
  }
  function puce(txt, cls, titre){ return '<i class="chip chip--' + cls + '"' + (titre ? ' title="' + esc(titre) + '"' : "") + '>' + txt + '</i>'; }
  var LEGENDE = '<div class="typo-legend">' + FAMS.map(function(f){
    return '<span><i style="background:color-mix(in oklab,var(--f-' + f[0] + ') var(--wash),var(--paper))"></i>' + f[1] + '</span>';
  }).join("") + '</div>';

  /* ---------- géométrie ---------- */
  function P(f, x, y){ var w = PG.versMonde(f, x, y); return [w[0], -w[1]]; }
  function pts(f, list){ return list.map(function(p){ var q = P(f, p[0], p[1]); return q[0].toFixed(3) + "," + q[1].toFixed(3); }).join(" "); }
  function rectL(f, x0, y0, x1, y1){ return [[x0, y0], [x1, y0], [x1, y1], [x0, y1]]; }
  function fr(f, frame, x0, u, v){ return PG.versEtage(f, frame, x0, u, v); }
  function rectF(f, frame, x0, u0, v0, w, h){
    return [fr(f, frame, x0, u0, v0), fr(f, frame, x0, u0 + w, v0), fr(f, frame, x0, u0 + w, v0 + h), fr(f, frame, x0, u0, v0 + h)];
  }
  function esc(s){ return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
  function angDeg(f){ var d = -f.a * 180 / Math.PI; while(d > 90) d -= 180; while(d < -90) d += 180; return d; }

  var bounds;
  function grow(x, y){ bounds[0] = Math.min(bounds[0], x); bounds[1] = Math.min(bounds[1], y); bounds[2] = Math.max(bounds[2], x); bounds[3] = Math.max(bounds[3], y); }

  /* ---------- dessin d'un niveau ---------- */
  function dessiner(recadrer){
    var res = PG.genNiveau(DATA, st.parti, st.niv), fl = res.fl;
    INFO = []; bounds = [Infinity, Infinity, -Infinity, -Infinity];
    var out = { site:[], ombre:[], fond:[], rooms:[], part:[], ouv:[], mb:[], lab:[], dim:[] };
    var rects = res.F.map(function(f){ return { f:f }; });
    function dansAutre(f, x, y){
      var w = PG.versMonde(f, x, y);
      return res.F.some(function(g){
        if(g === f) return false;
        var c = Math.cos(-g.a), s = Math.sin(-g.a), dx = w[0] - g.cx, dy = w[1] - g.cy;
        var lx = dx * c - dy * s, ly = dx * s + dy * c;
        return Math.abs(lx) <= g.L / 2 + 0.6 && Math.abs(ly) <= g.D / 2 + 0.6;
      });
    }

    /* site, existant, et l'emprise des volumes absents de ce niveau */
    var per = DATA.site.per.map(function(p){ return p[0] + "," + (-p[1]); }).join(" ");
    out.site.push('<polygon class="site" points="' + per + '"/>');
    DATA.site.bat.forEach(function(b){
      var ferme = b.length > 3 && b[0][0] === b[b.length - 1][0] && b[0][1] === b[b.length - 1][1];
      out.site.push('<' + (ferme ? "polygon" : "polyline") + ' class="exist" points="' + b.map(function(p){ return p[0] + "," + (-p[1]); }).join(" ") + '"' + (ferme ? "" : ' style="fill:none"') + '/>');
    });
    DATA.partis[st.parti].vols.forEach(function(v){
      if(v.lv.some(function(e){ return e.i === st.niv; })) return;
      var e = v.lv[0], f = { cx:0, cy:0, a:v.a };
      var p = PG.local(v.x, v.y, v.a, e.dx || 0, e.dy || 0); f.cx = p[0]; f.cy = p[1];
      out.ombre.push('<polygon class="ombre" points="' + pts(f, rectL(f, -e.w / 2 - 0.5, -e.d / 2 - 0.5, e.w / 2 + 0.5, e.d / 2 + 0.5)) + '"/>');
    });

    var circDessinee = 0, cagesA = 0, libreA = 0, pose = {};
    res.F.forEach(function(f){
      var L = f.L, D = f.D, m = PG.MUR;
      rectL(f, -L / 2 - m, -D / 2 - m, L / 2 + m, D / 2 + m).forEach(function(p){ var q = P(f, p[0], p[1]); grow(q[0], q[1]); });
      out.fond.push('<polygon class="mur" points="' + pts(f, rectL(f, -L / 2 - m, -D / 2 - m, L / 2 + m, D / 2 + m)) + '"/>');
      out.fond.push('<polygon class="circ" points="' + pts(f, rectL(f, -L / 2, -D / 2, L / 2, D / 2)) + '"/>');
      /* la circulation : ce que le corps a de plus que ses pièces et ses noyaux */
      if(!f.fixe){
        var occ = 0; f.rooms.forEach(function(r){ occ += r.a; }); f.cages.forEach(function(c){ occ += c.W * c.H; });
        circDessinee += f.L * f.D - occ;
      }

      f.rooms.forEach(function(r){
        if(r.kind === "bloc"){
          r.cel.forEach(function(c){
            local1(f, r.frame, r.x0, c, c.u0, (r.v0 || 0) + c.v0, c.W, c.H, "cell", true);
            pose[c.key] = (pose[c.key] || 0) + c.a;
          });
          return;
        }
        local1(f, r.frame, r.x0, r, 0, r.v0 || 0, r.W, r.H, "room", false);
        pose[r.key] = (pose[r.key] || 0) + r.a;
      });
      f.cages.forEach(function(c){
        cagesA += c.W * c.H;
        out.rooms.push('<polygon class="cagef" data-k="' + INFO.length + '" points="' + pts(f, rectF(f, c.bande, c.x0, 0, c.v0 || 0, c.W, c.H)) + '"/>');
        INFO.push({ lab:"Noyau · escalier et ascenseur", n:"Noyau de circulation", a:c.W * c.H, W:c.W, H:c.H, f:"" });
        meubles(f, c.bande, c.x0, { kind:"cage" }, 0, c.v0 || 0, c.W, c.H);
        porte(f, c.bande, c.x0, c.W - 0.15, c.v0 || 0, 1.2);
        etiquette(f, c.bande, c.x0, 0, c.v0 || 0, c.W, c.H, "Noyau", c.W * c.H, true);
      });

      /* cotes hors tout, murs compris */
      if(!f.fixe || true){
        var o = 2.2, yA = -D / 2 - m - o, xB = L / 2 + m + o;
        var a1 = P(f, -L / 2 - m, yA), a2 = P(f, L / 2 + m, yA);
        out.dim.push('<line class="dim" x1="' + a1[0] + '" y1="' + a1[1] + '" x2="' + a2[0] + '" y2="' + a2[1] + '"/>');
        [-L / 2 - m, L / 2 + m].forEach(function(x){ var t1 = P(f, x - 0.4, yA - 0.4), t2 = P(f, x + 0.4, yA + 0.4); out.dim.push('<line class="dim" x1="' + t1[0] + '" y1="' + t1[1] + '" x2="' + t2[0] + '" y2="' + t2[1] + '"/>'); });
        var tm = P(f, 0, yA - 0.5);
        out.dim.push('<text class="dimt" font-size="0.95" text-anchor="middle" transform="translate(' + tm[0] + ',' + tm[1] + ') rotate(' + angDeg(f) + ')">' + fmt(L + 2 * m, 2) + '</text>');
        var b1 = P(f, xB, -D / 2 - m), b2 = P(f, xB, D / 2 + m);
        out.dim.push('<line class="dim" x1="' + b1[0] + '" y1="' + b1[1] + '" x2="' + b2[0] + '" y2="' + b2[1] + '"/>');
        [-D / 2 - m, D / 2 + m].forEach(function(y){ var t1 = P(f, xB - 0.4, y - 0.4), t2 = P(f, xB + 0.4, y + 0.4); out.dim.push('<line class="dim" x1="' + t1[0] + '" y1="' + t1[1] + '" x2="' + t2[0] + '" y2="' + t2[1] + '"/>'); });
        var tb = P(f, xB + 0.6, 0);
        out.dim.push('<text class="dimt" font-size="0.95" text-anchor="middle" transform="translate(' + tb[0] + ',' + tb[1] + ') rotate(' + (angDeg(f) - 90) + ')">' + fmt(D + 2 * m, 2) + '</text>');
        if(f.deux && !f.fixe){
          /* profondeurs des deux bandes et du couloir */
          var xs = -L / 2 - m - o, ys = [-D / 2, f.yc0, f.yc1, D / 2];
          var c1 = P(f, xs, -D / 2), c2 = P(f, xs, D / 2);
          out.dim.push('<line class="dim" x1="' + c1[0] + '" y1="' + c1[1] + '" x2="' + c2[0] + '" y2="' + c2[1] + '"/>');
          ys.forEach(function(y){ var t1 = P(f, xs - 0.35, y - 0.35), t2 = P(f, xs + 0.35, y + 0.35); out.dim.push('<line class="dim" x1="' + t1[0] + '" y1="' + t1[1] + '" x2="' + t2[0] + '" y2="' + t2[1] + '"/>'); });
          for(var k = 0; k < 3; k++){
            var tt = P(f, xs - 0.6, (ys[k] + ys[k + 1]) / 2);
            out.dim.push('<text class="dimt" font-size="0.7" text-anchor="middle" transform="translate(' + tt[0] + ',' + tt[1] + ') rotate(' + (angDeg(f) - 90) + ')">' + fmt(ys[k + 1] - ys[k], 2) + '</text>');
          }
        }
      }

      /* ---- un local : fond, cloisons, ouvertures, mobilier, étiquette ---- */
      function local1(f, frame, x0, r, u0, v0, W, H, cls, cellule){
        var trav = r.kind === "trav";
        out.rooms.push('<polygon class="' + cls + ' fam-' + (r.f || "tec") + '" data-chap="' + (r.chap || String(r.key || "").split("|")[0]) + '" data-k="' + INFO.length + '"' + (trav ? ' style="stroke:none"' : "") + ' points="' + pts(f, rectF(f, frame, x0, u0, v0, W, H)) + '"/>');
        INFO.push({ lab:r.lab || r.n, n:r.n, a:r.a, W:W, H:H, f:r.f,
                    regle:r.kind === "band" ? { id:f.v.id, i:f.e.i, lab:r.lab, a:r.a, ext:!!r.ext, key:r.key } : null });
        if(trav){
          [r.x0, r.x0 + r.W].forEach(function(x){
            if(Math.abs(Math.abs(x) - f.L / 2) < 0.01) return;
            [[-f.D / 2, f.yc0], [f.yc1, f.D / 2]].forEach(function(s){
              if(!f.deux && s[0] === -f.D / 2) return;
              var p1 = P(f, x, s[0]), p2 = P(f, x, s[1]);
              out.part.push('<line class="part" x1="' + p1[0] + '" y1="' + p1[1] + '" x2="' + p2[0] + '" y2="' + p2[1] + '"/>');
            });
          });
          /* entrées sur les deux façades */
          [-1, 1].forEach(function(sg){
            var xc = r.x0 + r.W / 2, yw = sg * f.D / 2;
            if(dansAutre(f, xc, sg * (f.D / 2 + 1.2))) return;
            ouvertureMur(f, xc, sg, 2.2, true);
            if((sg < 0) === (Math.cos(f.a) > 0)){
              var t = [P(f, xc, yw + sg * 1.4), P(f, xc - 0.9, yw + sg * 2.6), P(f, xc + 0.9, yw + sg * 2.6)];
              out.ouv.push('<polygon class="entree" points="' + t.map(function(q){ return q.join(","); }).join(" ") + '"/>');
            }
          });
        }
        /* portes */
        if(r.ext && !cellule){
          /* la pièce qui ferme le couloir : sa porte dans le pignon du couloir */
          porteX(f, r.ext < 0 ? x0 + W : x0, (f.yc0 + f.yc1) / 2, Math.min(1.2, PG.COULOIR - 0.6), r.ext < 0 ? -1 : 1);
        } else if(r.kind === "band" || (cellule)){
          /* la porte là où le couloir passe */
          var dw = Math.min(r.f === "cla" ? 1.0 : 0.9, W - 0.4);
          var uh = Math.max(f.zl - x0 + dw + 0.15, Math.min(u0 + W - 0.25, f.zr - x0 - 0.15));
          if(W >= 1.1 && uh - dw >= u0 - 0.01 && uh <= u0 + W + 0.01) porte(f, frame, x0, uh, r.porteV != null ? r.porteV : Math.max(0, v0), dw);
        } else if(r.kind === "full" && r.x0 > -f.L / 2 + 0.01){
          var ym = f.deux ? (f.yc0 + f.yc1) / 2 : (f.yc0 + f.yc1) / 2;
          porteX(f, r.x0, ym, Math.min(1.6, PG.COULOIR - 0.5), 1);
        } else if(r.kind === "full" && r.x0 + r.W < f.L / 2 - 0.01){
          porteX(f, r.x0 + r.W, (f.yc0 + f.yc1) / 2, Math.min(1.6, PG.COULOIR - 0.5), -1);
        } else if(r.kind === "fixe"){
          [-1, 1].forEach(function(sg){ if(!dansAutre(f, 0, sg * (f.D / 2 + 1.2))) ouvertureMur(f, sg < 0 ? -f.L / 4 : f.L / 4, sg, 2.0, true); });
        }
        /* un petit hall de bande a sa porte d'entrée sur la façade */
        if(r.kind === "band" && /^Hall/i.test(r.n || "") && (frame === "A" || frame === "B")){
          var sgH = frame === "A" ? -1 : 1, xH = fr(f, frame, x0, u0 + W / 2, 0)[0];
          if(!dansAutre(f, xH, sgH * (f.D / 2 + 1.2))) ouvertureMur(f, xH, sgH, Math.min(2.0, W - 0.6), true);
        }
        /* fenêtres sur les façades libres */
        var facs = [];
        if(frame === "A" || frame === "B"){ if(Math.abs(v0 + H - f.bb[frame]) < 0.02) facs.push(frame === "A" ? -1 : 1); }
        else if(r.fac){ facs.push(r.fac); }
        else if(!trav){ facs.push(-1, 1); }
        facs.forEach(function(sg){
          var n = Math.max(1, Math.floor((W - 0.6) / 2.6)), lw = Math.min(1.8, W - 0.8);
          if(lw < 0.6 || (r.n && /Abri|chauffage|Local technique|Dépôt|rangement|Économat|nettoyage/i.test(r.n))) return;
          for(var k = 0; k < n; k++){
            var uc = u0 + W * (k + 0.5) / n, xc = fr(f, frame === "A" || frame === "B" ? frame : "full", x0, uc, 0)[0];
            if(dansAutre(f, xc, sg * (f.D / 2 + 1.0))) continue;
            ouvertureMur(f, xc, sg, lw, false);
          }
        });
        meubles(f, frame, x0, r, u0, v0, W, H);
        etiquette(f, frame, x0, u0, v0, W, H, r.lab || r.n, r.a, false);
      }
    });

    /* passages entre corps accolés : le couloir traverse les deux murs de pignon */
    res.F.forEach(function(f){
      if(f.fixe) return;
      var ym = (f.yc0 + f.yc1) / 2;
      [-1, 1].forEach(function(sg){
        if(sg < 0 ? f.zl > -f.L / 2 + 0.01 : f.zr < f.L / 2 - 0.01) return;
        var wpt = PG.versMonde(f, sg * (f.L / 2 + 1.0), ym);
        var ok = res.F.some(function(g){
          if(g === f || g.fixe) return false;
          var c = Math.cos(-g.a), s2 = Math.sin(-g.a), dx = wpt[0] - g.cx, dy = wpt[1] - g.cy;
          var lx = dx * c - dy * s2, ly = dx * s2 + dy * c;
          return Math.abs(lx) <= g.L / 2 + 0.05 && ly > g.yc0 + 0.3 && ly < g.yc1 - 0.3;
        });
        if(!ok) return;
        var x0 = sg < 0 ? -f.L / 2 - 1.05 : f.L / 2 - 0.02, x1 = sg < 0 ? -f.L / 2 + 0.02 : f.L / 2 + 1.05;
        out.ouv.push('<polygon class="circ" points="' + pts(f, rectL(f, x0, ym - 0.9, x1, ym + 0.9)) + '"/>');
      });
    });
    function porte(f, frame, x0, uh, v, dw){
      if(dw < 0.5) return;
      var g = rectF(f, frame, x0, uh - dw, v - 0.09, dw, 0.18);
      out.ouv.push('<polygon class="gap" points="' + pts(f, g) + '"/>');
      var h = P.apply(null, [f].concat(fr(f, frame, x0, uh, v))), e = P.apply(null, [f].concat(fr(f, frame, x0, uh, v + dw)));
      out.ouv.push('<line class="porte" x1="' + h[0] + '" y1="' + h[1] + '" x2="' + e[0] + '" y2="' + e[1] + '"/>');
      var arc = [];
      for(var k = 0; k <= 10; k++){ var t = k / 10 * Math.PI / 2; arc.push(fr(f, frame, x0, uh - dw * Math.cos(t), v + dw * Math.sin(t))); }
      out.ouv.push('<polyline class="arc" points="' + pts(f, arc) + '"/>');
    }
    function porteX(f, x, ym, dw, sens){
      out.ouv.push('<polygon class="gap" points="' + pts(f, rectL(f, x - 0.09, ym - dw / 2, x + 0.09, ym + dw / 2)) + '"/>');
      var h = P(f, x, ym + dw / 2), e = P(f, x + sens * dw, ym + dw / 2);
      out.ouv.push('<line class="porte" x1="' + h[0] + '" y1="' + h[1] + '" x2="' + e[0] + '" y2="' + e[1] + '"/>');
      var arc = [];
      for(var k = 0; k <= 10; k++){ var t = k / 10 * Math.PI / 2; arc.push([x + sens * dw * Math.sin(t), ym + dw / 2 - dw * Math.cos(t)]); }
      out.ouv.push('<polyline class="arc" points="' + pts(f, arc) + '"/>');
    }
    function ouvertureMur(f, xc, sg, lw, porteM){
      var y0 = sg * f.D / 2, y1 = sg * (f.D / 2 + PG.MUR);
      out.ouv.push('<polygon class="gapw" points="' + pts(f, rectL(f, xc - lw / 2, Math.min(y0, y1), xc + lw / 2, Math.max(y0, y1))) + '"/>');
      if(porteM){
        [-1, 1].forEach(function(s){
          var h = P(f, xc + s * lw / 2, y0), e = P(f, xc + s * lw / 2, y0 - sg * lw / 2);
          out.ouv.push('<line class="porte" x1="' + h[0] + '" y1="' + h[1] + '" x2="' + e[0] + '" y2="' + e[1] + '"/>');
        });
        return;
      }
      [0.17, 0.33].forEach(function(t){
        var y = sg * (f.D / 2 + PG.MUR * t), a = P(f, xc - lw / 2, y), b = P(f, xc + lw / 2, y);
        out.ouv.push('<line class="vitre" x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '"/>');
      });
      [xc - lw / 2, xc + lw / 2].forEach(function(x){
        var a = P(f, x, y0), b = P(f, x, y1);
        out.ouv.push('<line class="vitre" x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '"/>');
      });
    }
    function meubles(f, frame, x0, r, u0, v0, W, H){
      var lst = MEUBLES.pour(r, W, H);
      lst.forEach(function(p){
        var k = "mb " + (p.k || "");
        if(p.t === "r"){
          if(p.w <= 0 || p.h <= 0) return;
          out.mb.push('<polygon class="' + k + '" points="' + pts(f, rectF(f, frame, x0, u0 + p.u, v0 + p.v, p.w, p.h)) + '"/>');
        } else if(p.t === "c" || p.t === "e"){
          var c = P.apply(null, [f].concat(fr(f, frame, x0, u0 + p.u, v0 + p.v)));
          if(p.t === "c") out.mb.push('<circle class="' + k + '" cx="' + c[0].toFixed(3) + '" cy="' + c[1].toFixed(3) + '" r="' + p.r + '"/>');
          else out.mb.push('<ellipse class="' + k + '" cx="0" cy="0" rx="' + p.rx + '" ry="' + p.ry + '" transform="translate(' + c[0].toFixed(3) + ',' + c[1].toFixed(3) + ') rotate(' + angDeg(f) + ')"/>');
        } else if(p.t === "l"){
          var a = P.apply(null, [f].concat(fr(f, frame, x0, u0 + p.u1, v0 + p.v1))), b = P.apply(null, [f].concat(fr(f, frame, x0, u0 + p.u2, v0 + p.v2)));
          out.mb.push('<line class="' + k + '" x1="' + a[0].toFixed(3) + '" y1="' + a[1].toFixed(3) + '" x2="' + b[0].toFixed(3) + '" y2="' + b[1].toFixed(3) + '"/>');
        }
      });
    }
    function etiquette(f, frame, x0, u0, v0, W, H, txt, a, petit){
      var nom = String(txt || "").replace(/ \/ .*$/, "");
      var vert = W < 2.2 && H > W * 1.4;
      var len = vert ? H : W;
      var fs = Math.min(petit ? 0.45 : Math.max(0.62, Math.min(1.5, Math.sqrt(a) * 0.055)), (len * 0.88) / Math.max(4, nom.length * 0.56));
      var c = P.apply(null, [f].concat(fr(f, frame, x0, u0 + W / 2, v0 + H / 2)));
      var ang = angDeg(f) + (vert ? -90 : 0);
      var aire = fmt(a) + " m²";
      if(fs < 0.24){
        var fa = Math.min(0.42, (len * 0.85) / (aire.length * 0.6));
        if(fa < 0.18) return;
        out.lab.push('<text class="lab" text-anchor="middle" transform="translate(' + c[0].toFixed(2) + ',' + c[1].toFixed(2) + ') rotate(' + ang + ')"><tspan class="m2" font-size="' + fa.toFixed(2) + '" y="' + (fa * 0.35).toFixed(2) + '">' + aire + '</tspan></text>');
        return;
      }
      out.lab.push('<text class="lab" text-anchor="middle" transform="translate(' + c[0].toFixed(2) + ',' + c[1].toFixed(2) + ') rotate(' + ang + ')">' +
        '<tspan x="0" y="' + (-fs * 0.15).toFixed(2) + '" font-size="' + fs.toFixed(2) + '">' + esc(nom) + '</tspan>' +
        '<tspan class="m2" x="0" y="' + (fs * 1.05).toFixed(2) + '" font-size="' + (fs * 0.82).toFixed(2) + '">' + aire + '</tspan></text>');
    }

    /* nord et échelle graphique */
    if(isFinite(bounds[0])){
      var bx = bounds[0], by = bounds[3] + 8;
      var sc = '<g class="dimg echelle">';
      [0, 5, 10, 20].forEach(function(d, k, arr){
        if(k < arr.length - 1) sc += '<rect x="' + (bx + d) + '" y="' + by + '" width="' + (arr[k + 1] - d) + '" height="0.6" fill="' + (k % 2 ? "var(--paper)" : "var(--ink)") + '" stroke="var(--ink)" stroke-width="0.08"/>';
        sc += '<text class="dimt" font-size="1.1" x="' + (bx + d) + '" y="' + (by + 2.1) + '" text-anchor="middle">' + d + '</text>';
      });
      sc += '<text class="dimt" font-size="1.1" x="' + (bx + 21.5) + '" y="' + (by + 0.7) + '">m</text></g>';
      var nx = bounds[2] + 4, ny = bounds[1] + 2;
      sc += '<g class="nordg"><polygon class="nord" points="' + nx + ',' + ny + ' ' + (nx - 1.3) + ',' + (ny + 4) + ' ' + nx + ',' + (ny + 3) + ' ' + (nx + 1.3) + ',' + (ny + 4) + '"/>' +
            '<text class="lab" font-size="1.4" x="' + nx + '" y="' + (ny - 0.6) + '" text-anchor="middle">N</text></g>';
      out.dim.push(sc);
    }

    vue.innerHTML =
      '<g class="siteg">' + out.site.join("") + '</g>' + out.ombre.join("") +
      out.fond.join("") + out.rooms.join("") + out.part.join("") + out.ouv.join("") +
      '<g class="mbg">' + out.mb.join("") + '</g>' + out.lab.join("") + '<g class="dimg">' + out.dim.join("") + '</g>';
    classes();

    /* la barre, le titre, le tableau, puis le rail */
    Array.prototype.forEach.call(seg.children, function(b, i){ b.setAttribute("aria-pressed", i === st.niv ? "true" : "false"); });
    var P0 = DATA.partis[st.parti];
    $("titre").textContent = "Plan · " + fl.name;
    $("sous").textContent = res.F.length + " corps · h " + fmt(fl.h, 2) + " m";
    seedIn.value = seedTxt();
    $("cartouche").innerHTML = '<div>Projet</div><div>Centre scolaire de Saxon</div><div>Étape</div><div>05 Typologies</div>' +
      '<div>Parti</div><div>' + esc(P0.n) + '</div><div>Niveau</div><div>' + esc(fl.name) + ' · h ' + fmt(fl.h, 2) + ' m</div>' +
      '<div>Seed</div><div>' + seedTxt() + '</div>';

    var demande = 0, posé = 0, rows = [];
    fl.rooms.forEach(function(r){
      var d = r.q * r.u, p = pose[r.key] || 0, horsVol = r.hors && !p;
      if(!horsVol){ demande += d; posé += Math.min(p, d); }
      var etat = horsVol ? '<span class="st-hors">hors volume</span>' :
        Math.abs(d - p) < 0.5 ? '<span class="st-ok">posé</span>' : '<span class="st-warn">manque ' + fmt(d - p) + ' m²</span>';
      rows.push('<tr><td><span class="dot" style="background:var(--f-' + r.f + ')"></span>' + esc(r.n) + '</td><td class="n">' + r.q + '</td><td class="n">' + fmt(d) + '</td><td class="n">' + (horsVol ? "—" : fmt(p)) + '</td><td>' + etat + '</td></tr>');
    });
    $("tab").querySelector("tbody").innerHTML = rows.join("");
    var mix = fl.circ ? fl.circ.couloir + fl.circ.cages : 0;
    var taux = demande ? posé / demande : 1, plein = taux > 0.995;
    var bil = '<div class="typo-bil">' +
      '<span>Programme demandé</span><span class="v">' + fmt(demande, 0) + ' m²</span>' +
      '<span>Posé dans le plan</span><span class="v">' + fmt(posé, 0) + ' m²</span>' +
      '<span class="sep"></span>' +
      '<span>Circulation : couloirs et paliers</span><span class="v">' + fmt(circDessinee, 0) + ' m²</span>' +
      '<span>Noyaux (escalier + ascenseur)</span><span class="v">' + fmt(cagesA, 0) + ' m²</span>' +
      '<span>Circulation estimée au mixer</span><span class="v">' + fmt(mix, 0) + ' m²</span></div>';
    if(res.non.length) bil += '<p class="mass-sous">Ne tient pas dans le volume</p><ul class="typo-non">' +
      res.non.map(function(u){ return '<li><span>' + esc(u.lab) + '</span><span>' + fmt(u.a) + ' m²</span></li>'; }).join("") + '</ul>' +
      '<p class="mass-note">Les volumes gardent les cotes du Massing : l\u2019agrandir là-bas, ou alléger le niveau au Programme mixer.</p>';
    var C = controle(), ol = $("etapes");
    ol.innerHTML = "";
    ol.appendChild(etape("bilan", 1, "Bilan du niveau", fl.name, puce(fmt(100 * taux, 0) + " %", plein ? "ok" : "warn", "Part du programme du niveau posée dans le plan"), bil, !plein));
    ol.appendChild(etape("ctl", 2, "Contrôle", "toute la pile",
      (C.bad ? puce(C.bad + " à revoir", "warn") : "") + puce(C.ok + " ok", "ok"), '<ul class="typo-ctl">' + C.html + '</ul>', C.bad > 0));
    ol.appendChild(etape("fam", 3, "Familles", "les lavis du plan", "", LEGENDE, false));
    if(recadrer || !vb) cadrer();
  }

  /* ---------- le contrôle : toute la pile, pas seulement le niveau montré ---------- */
  var CTL = null;
  function controle(){
    if(CTL) return CTL;
    var tous = DATA.floors.map(function(_, i){ return PG.genNiveau(DATA, st.parti, i); }), L = [];
    var vols = DATA.partis[st.parti].vols, F0 = PG.FEU;
    function nom(v){ return v.nom || String(v.id).toUpperCase(); }
    function niv(i){ return DATA.floors[i].name; }
    var nOk = 0, nBad = 0;
    function dit(ok, t, d){ if(ok) nOk++; else nBad++; L.push('<li>' + puce(ok ? "ok" : "à revoir", ok ? "ok" : "warn") + '<span>' + t + '</span>' + (d ? '<small>' + d + '</small>' : "") + '</li>'); }
    /* le programme */
    var nm = 0, am = 0, ou = [];
    tous.forEach(function(r, i){
      var a = 0; r.non.forEach(function(u){ nm++; am += u.a; a += u.a; });
      if(a) ou.push(niv(i).toLowerCase() + " " + fmt(a, 0) + " m²");
    });
    dit(!nm, nm ? nm + " pièce" + (nm > 1 ? "s" : "") + " non posée" + (nm > 1 ? "s" : "") + " — " + fmt(am, 0) + " m²"
                : "Tout le programme est posé, à surface exacte",
        nm ? "Il manque du plateau : " + ou.join(", ") + ". Le couloir et les noyaux prennent leur place ; agrandir le volume au Massing ou alléger le niveau au Programme mixer."
           : "Une pièce change de proportions, jamais de surface.");
    /* les noyaux : présents, empilés, aux mêmes cotes */
    var sig = {}, acces = [], empile = [], feu = [], fuite = 0, fuiteMax = F0.fuiteSimple;
    function monde(f, frame, x0, u, v){ var q = PG.versEtage(f, frame, x0, u, v); return PG.versMonde(f, q[0], q[1]); }
    function grp(v){ return v.bat || v.id; }
    tous.forEach(function(r, i){
      /* les noyaux de ce niveau, par bâtiment, en coordonnées du site */
      var N = {}, aire = {};
      r.F.forEach(function(f){
        if(f.fixe) return;
        aire[grp(f.v)] = (aire[grp(f.v)] || 0) + f.L * f.D;
        f.cages.forEach(function(c){ (N[grp(f.v)] = N[grp(f.v)] || []).push(monde(f, c.bande, c.x0, c.W / 2, (c.v0 || 0) + c.H / 2)); });
        var s2 = f.cages.map(function(c){
          var p = monde(f, c.bande, c.x0, 0, c.v0 || 0);
          return p[0].toFixed(1) + "," + p[1].toFixed(1) + "," + c.W.toFixed(1) + "×" + c.H.toFixed(1);
        }).join(" ");
        /* un corps qui porte un noyau le porte à TOUS ses niveaux, au même endroit */
        if(PG.hotes(vols)[f.v.id]) (sig[f.v.id] = sig[f.v.id] || { v:f.v, s:{} }).s[s2] = 1;
      });
      Object.keys(aire).forEach(function(g){
        if(aire[g] > F0.cageSeuil && (N[g] || []).length < 2) feu.push("bâtiment " + g + " au " + niv(i).toLowerCase());
      });
      r.F.forEach(function(f){
        if(f.fixe) return;
        var C = N[grp(f.v)] || [], rez = DATA.floors[i].lvl === 0;
        if(!C.length){ if(!rez) acces.push(nom(f.v) + " au " + niv(i).toLowerCase()); return; }
        if(rez) return;     /* au rez, on sort par la façade : halls et portes */
        var lim = C.length > 1 ? F0.fuiteDouble : F0.fuiteSimple;
        f.rooms.forEach(function(rm){
          var p = monde(f, rm.frame === "full" ? "full" : rm.frame, rm.x0, rm.W / 2, (rm.H || 0) / 2), d = Infinity;
          C.forEach(function(c){ d = Math.min(d, Math.abs(p[0] - c[0]) + Math.abs(p[1] - c[1])); });
          if(d - lim > fuite - fuiteMax){ fuite = d; fuiteMax = lim; }
        });
      });
    });
    Object.keys(sig).forEach(function(k){ if(Object.keys(sig[k].s).length > 1) empile.push(nom(sig[k].v)); });
    dit(!acces.length, acces.length ? "Niveaux sans noyau : " + acces.join(", ")
        : "Chaque niveau est desservi par un noyau escalier + ascenseur",
        acces.length ? "Ces niveaux ne sont ni accessibles ni évacuables." : "Un noyau par bâtiment et par niveau : les corps accolés se desservent par leurs couloirs ; accessible à tous (SIA 500).");
    dit(!empile.length, empile.length ? "Noyaux décalés d'un niveau à l'autre : " + empile.join(", ")
        : "Les noyaux s'empilent : mêmes cotes et même place à chaque niveau",
        "Escalier " + fmt(PG.NOY.volee, 2) + " m par volée, gaine d'ascenseur " + fmt(PG.NOY.asc[0], 2) + " × " + fmt(PG.NOY.asc[1], 2) + " m.");
    dit(!feu.length, feu.length ? "Étage de plus de " + fmt(F0.cageSeuil, 0) + " m² à un seul noyau : " + feu.join(", ")
        : "Deux noyaux là où l'étage dépasse " + fmt(F0.cageSeuil, 0) + " m²", "AEAI 16-15.");
    dit(fuite <= fuiteMax + 0.01, "Évacuation : " + fmt(fuite, 1) + " m au plus jusqu'à un escalier",
        "Mesurée en équerre, du centre de la pièce au noyau. Au plus " + fmt(F0.fuiteSimple, 0) + " m vers un seul escalier, " + fmt(F0.fuiteDouble, 0) + " m vers deux (AEAI 16-15).");
    /* les liens du schéma : deux postes en lien, au même niveau, dans le même
       bâtiment, à moins de la distance d'un lien */
    var pos = {};
    tous.forEach(function(r, i){
      r.F.forEach(function(f){
        f.rooms.forEach(function(rm){
          /* la pièce et sa boîte englobante dans le repère du site */
          function met(key, p, W, H){
            if(!key) return;
            var c = Math.abs(Math.cos(f.a)), s2 = Math.abs(Math.sin(f.a));
            (pos[key] = pos[key] || []).push({ i:i, p:p, ex:(W * c + H * s2) / 2, ey:(W * s2 + H * c) / 2 });
          }
          if(rm.kind === "bloc") rm.cel.forEach(function(c){ met(c.key, monde(f, rm.frame, rm.x0, c.u0 + c.W / 2, (rm.v0 || 0) + c.v0 + c.H / 2), c.W, c.H); });
          else met(rm.key, monde(f, rm.frame, rm.x0, rm.W / 2, (rm.v0 || 0) + (rm.H || 0) / 2), rm.W, rm.H || 0);
        });
      });
    });
    function nomPoste(k){ return String(k).split("|")[1] || k; }
    var rompus = [];
    (DATA.liens || []).forEach(function(l){
      var A = pos[l.a], B = pos[l.b];
      if(!A || !B) return;
      var pire = 0, separes = false;
      A.forEach(function(x){
        var d = Infinity;
        /* l'écart entre les deux pièces, de bord à bord, en équerre */
        B.forEach(function(y){
          if(y.i !== x.i) return;
          d = Math.min(d, Math.max(0, Math.abs(x.p[0] - y.p[0]) - x.ex - y.ex) + Math.max(0, Math.abs(x.p[1] - y.p[1]) - x.ey - y.ey));
        });
        if(d === Infinity) separes = true; else pire = Math.max(pire, d);
      });
      if(separes || pire > PG.LIEN) rompus.push(nomPoste(l.a) + " – " + nomPoste(l.b) + (separes ? " (pas au même niveau)" : " (" + fmt(pire, 0) + " m)"));
    });
    dit(!rompus.length, rompus.length ? rompus.length + " lien" + (rompus.length > 1 ? "s" : "") + " du schéma non tenu" + (rompus.length > 1 ? "s" : "") + " : " + rompus.slice(0, 6).join(" ; ") + (rompus.length > 6 ? "…" : "")
        : "Toutes les adjacences du schéma sont tenues", "Chaque pièce à moins de " + fmt(PG.LIEN, 0) + " m de bord à bord de celle qui lui est liée, au même niveau. Les liens éteints au mixer ne comptent pas."
          + (rompus.some(function(t){ return /pas au même niveau/.test(t); }) ? " Deux postes à deux niveaux : c\u2019est au Programme mixer qu\u2019ils se rapprochent." : "")
          + (rompus.some(function(t){ return /Salle de sport double/.test(t); }) ? " Les liens à la salle de sport ne se tiennent que si elle touche l\u2019école : levier « Salle de sport accolée » au Massing." : ""));
    dit(true, "Les plans tiennent dans les volumes du Massing", "Chaque corps garde ses cotes, niveau par niveau ; le Shuffle ne change que l\u2019ordonnance des pièces.");
    dit(true, "Couloir de " + fmt(PG.COULOIR, 2) + " m, réglé au cahier des charges", "Il finit toujours sur un noyau, un hall, un passage ou la porte de la pièce qui le ferme.");
    dit(true, "Murs extérieurs et porteurs " + fmt(PG.MUR * 100, 0) + " cm, cloisons " + fmt(PG.CLOISON * 100, 0) + " cm", "Pochés en plein : on coupe dans les murs.");
    return (CTL = { html:L.join(""), ok:nOk, bad:nBad });
  }

  /* ---------- vue : cadrage, zoom, déplacement ---------- */
  var vb = null;
  function applique(){ svg.setAttribute("viewBox", vb.x + " " + vb.y + " " + vb.w + " " + vb.h); }
  function cadrer(){
    var m = 10, w = bounds[2] - bounds[0] + 2 * m, h = bounds[3] - bounds[1] + 2 * m + 8;
    var r = stage.clientWidth / Math.max(1, stage.clientHeight);
    if(w / h < r) w = h * r; else h = w / r;
    vb = { x:(bounds[0] + bounds[2]) / 2 - w / 2, y:(bounds[1] + bounds[3] + 8) / 2 - h / 2, w:w, h:h };
    applique();
  }
  function zoom(k, cx, cy){
    if(cx == null){ cx = vb.x + vb.w / 2; cy = vb.y + vb.h / 2; }
    var w = Math.max(6, Math.min(800, vb.w * k)), kk = w / vb.w;
    vb = { x:cx - (cx - vb.x) * kk, y:cy - (cy - vb.y) * kk, w:w, h:vb.h * kk };
    applique();
  }
  function versSvg(e){
    var r = svg.getBoundingClientRect(), s = Math.max(vb.w / r.width, vb.h / r.height);
    var ox = (r.width * s - vb.w) / 2, oy = (r.height * s - vb.h) / 2;
    return [vb.x - ox + (e.clientX - r.left) * s, vb.y - oy + (e.clientY - r.top) * s, s];
  }
  stage.addEventListener("wheel", function(e){ e.preventDefault(); var p = versSvg(e); zoom(Math.exp(e.deltaY * 0.0015), p[0], p[1]); }, { passive:false });
  var ptrs = {}, last = null, pinch = null;
  stage.addEventListener("pointerdown", function(e){
    ptrs[e.pointerId] = { x:e.clientX, y:e.clientY }; stage.setPointerCapture(e.pointerId);
    stage.classList.add("drag"); last = { x:e.clientX, y:e.clientY };
    var ids = Object.keys(ptrs);
    if(ids.length === 2){ var a = ptrs[ids[0]], b = ptrs[ids[1]]; pinch = Math.hypot(a.x - b.x, a.y - b.y); }
  });
  stage.addEventListener("pointermove", function(e){
    if(ptrs[e.pointerId]){
      ptrs[e.pointerId] = { x:e.clientX, y:e.clientY };
      var ids = Object.keys(ptrs);
      if(ids.length === 2 && pinch){
        var a = ptrs[ids[0]], b = ptrs[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y);
        zoom(pinch / d); pinch = d; return;
      }
      var r = svg.getBoundingClientRect(), s = Math.max(vb.w / r.width, vb.h / r.height);
      vb.x -= (e.clientX - last.x) * s; vb.y -= (e.clientY - last.y) * s; last = { x:e.clientX, y:e.clientY };
      applique(); tip.hidden = true; return;
    }
    var k = e.target.getAttribute && e.target.getAttribute("data-k");
    if(k == null){ tip.hidden = true; return; }
    var I = INFO[+k], sr = stage.getBoundingClientRect();
    tip.innerHTML = '<b>' + esc(I.lab) + '</b><span>' + fmt(I.a) + ' m² · ' + fmt(I.W, 2) + ' × ' + fmt(I.H, 2) + ' m</span>';
    tip.hidden = false;
    var x = e.clientX - sr.left + 14, y = e.clientY - sr.top + 14;
    if(x + 240 > sr.width) x = e.clientX - sr.left - 250;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  });
  function fin(e){ delete ptrs[e.pointerId]; if(!Object.keys(ptrs).length){ stage.classList.remove("drag"); pinch = null; } else { var id = Object.keys(ptrs)[0]; last = { x:ptrs[id].x, y:ptrs[id].y }; pinch = null; } }
  stage.addEventListener("pointerup", fin); stage.addEventListener("pointercancel", fin);
  /* un clic sans glisser sur une pièce : on règle sa largeur */
  var p0 = null;
  stage.addEventListener("pointerdown", function(e){ p0 = { x:e.clientX, y:e.clientY, t:e.target }; });
  stage.addEventListener("click", function(e){
    if(!p0 || Math.hypot(e.clientX - p0.x, e.clientY - p0.y) > 4) return;
    /* la pièce sous le pointeur, sous le mobilier et les étiquettes */
    var el = document.elementsFromPoint(e.clientX, e.clientY).filter(function(x){ return x.hasAttribute && x.hasAttribute("data-k"); })[0];
    choisir(el ? INFO[+el.getAttribute("data-k")] : null, e);
  });
  /* LA PIÈCE CHOISIE : une carte posée sur le plan, comme le volume choisi au
     Massing — dans le coin opposé au clic, pour ne pas cacher ce qu'elle décrit
     (en haut quand elle passe à droite : la cartouche tient le bas). */
  function choisir(I, e){
    var c = $("carte");
    if(!I || !I.regle){ c.hidden = true; c.innerHTML = ""; return; }
    var R = I.regle, m = PG.MODULE;
    c.hidden = false;
    if(e){
      var r = stage.getBoundingClientRect(), droite = e.clientX - r.left < r.width / 2;
      c.classList.toggle("is-droite", droite);
      c.classList.toggle("is-haut", droite || e.clientY - r.top > r.height / 2);
    }
    c.innerHTML = '<section class="mass-carte__c" aria-label="Pièce choisie">' +
      '<div class="mass-carte__h"><b class="mass-carte__id">' + esc(I.lab) + '</b>' +
      '<button class="btn btn--quiet btn--icon" type="button" id="ed-x" aria-label="Ne plus choisir cette pièce" title="Ne plus choisir cette pièce">' + (ic("croix", 15) || "×") + '</button></div>' +
      '<p class="mass-note" title="La surface ne change pas : la largeur se règle au module de ' + fmt(m, 2) + ' m, la profondeur suit, et avec elle le couloir et les pièces de la bande. La cote vaut pour toutes les pièces du poste, aux Typologies seulement : le Massing ne bouge pas.">' +
        fmt(I.a) + ' m² · aujourd\u2019hui ' + fmt(I.W, 2) + ' × ' + fmt(I.H, 2) + ' m</p>' +
      '<label class="mass-par"><span class="mass-par__n">Largeur, au module de ' + fmt(m, 2) + ' m</span>' +
        '<input id="ed-w" type="number" step="' + m + '" min="' + (2 * m) + '" value="' + (Math.round(I.W / m) * m) + '"><span class="mass-par__u">m</span></label>' +
      '<button class="btn btn--quiet mass-renvoi" id="ed-0" type="button">Rendre au calcul</button></section>';
    function appliquer(w){
      parent.typoRegle(R.key, w);
      DATA = parent.typoDonnees(); PG.oublier(); CTL = null; dessiner(false);
      choisir(null);
    }
    $("ed-w").addEventListener("change", function(){
      var w = Math.round(parseFloat($("ed-w").value) / m) * m;
      if(isFinite(w) && w > 0) appliquer(w);
    });
    $("ed-0").addEventListener("click", function(){ appliquer(null); });
    $("ed-x").addEventListener("click", function(){ choisir(null); });
  }
  stage.addEventListener("pointerleave", function(){ tip.hidden = true; });
  $("z-in").addEventListener("click", function(){ zoom(0.7); });
  $("z-out").addEventListener("click", function(){ zoom(1 / 0.7); });
  $("z-fit").addEventListener("click", cadrer);
  window.addEventListener("resize", function(){ cadrer(); });

  /* ---------- copier le SVG, couleurs résolues ---------- */
  $("copy").addEventListener("click", function(){
    var btn = this, clone = svg.cloneNode(true), src = svg.querySelectorAll("*"), dst = clone.querySelectorAll("*");
    ["fill","stroke","stroke-width","stroke-dasharray","font-family","font-size","font-weight","display","opacity"].forEach(function(){});
    for(var i = 0; i < src.length; i++){
      var cs = getComputedStyle(src[i]), s = "";
      ["fill","stroke","stroke-width","stroke-dasharray","font-family","font-weight","display"].forEach(function(p){ s += p + ":" + cs.getPropertyValue(p) + ";"; });
      if(src[i].classList && (src[i].classList.contains("porte") || src[i].classList.contains("mb") || src[i].classList.contains("arc") || src[i].classList.contains("vitre") || src[i].classList.contains("dim") || src[i].classList.contains("site") || src[i].classList.contains("exist") || src[i].classList.contains("ombre"))) s += "vector-effect:non-scaling-stroke;";
      dst[i].setAttribute("style", s);
      dst[i].removeAttribute("class");
    }
    clone.setAttribute("viewBox", vb.x + " " + vb.y + " " + vb.w + " " + vb.h);
    var txt = new XMLSerializer().serializeToString(clone);
    var ok = function(){ btn.textContent = "SVG copié"; setTimeout(function(){ btn.textContent = "Copier le SVG"; }, 1600); };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, function(){ btn.textContent = "Copie refusée"; });
  });

  /* ---------- les planches du Rendu : chaque niveau, en primitives ----------
     `typoPlanches()` dessine tour à tour chaque niveau, tout affiché, en thème
     clair, et en rend la géométrie en MÈTRES du site (y vers le nord) avec les
     couleurs résolues — le même dessin que l'écran, rien de redessiné. Ce qui
     est contexte (parcelle, existant, volumes absents du niveau) porte `ctx`, sa sorte.
     Un trait « non-scaling » garde son épaisseur d'écran : `lwPt`. */
  var CV = document.createElement("canvas").getContext("2d", { willReadFrequently:true });
  function couleur(c, a){
    if(!c || c === "none" || /^url/.test(c)) return /^url/.test(c || "") ? [0.86, 0.85, 0.82] : null;
    CV.globalAlpha = 1; CV.fillStyle = "#fff"; CV.fillRect(0, 0, 1, 1);
    CV.globalAlpha = a == null ? 1 : a; CV.fillStyle = "#fff"; CV.fillStyle = c; CV.fillRect(0, 0, 1, 1);
    var d = CV.getImageData(0, 0, 1, 1).data;
    if(/rgba?\(0, 0, 0, 0\)|transparent/.test(c)) return null;
    return [d[0] / 255, d[1] / 255, d[2] / 255];
  }
  function recolter(){
    var R = [], inv = svg.getScreenCTM().inverse();
    function M(el){ return inv.multiply(el.getScreenCTM()); }
    function W(m, x, y){ return [m.a * x + m.c * y + m.e, -(m.b * x + m.d * y + m.f)]; }
    function vu(el){ return el.checkVisibility ? el.checkVisibility() : getComputedStyle(el).display !== "none"; }
    vue.querySelectorAll("polygon,polyline,line,rect,circle,ellipse,text").forEach(function(el){
      if(!vu(el)) return;
      var cs = getComputedStyle(el), m = M(el), k = Math.sqrt(Math.abs(m.a * m.d - m.b * m.c)) || 1;
      /* le contexte, par sa sorte : "site" (la parcelle), "exist", "ombre" */
      var ctx = el.closest(".siteg") || el.classList.contains("ombre") ? el.getAttribute("class") || "exist" : null;
      var op = +cs.opacity;
      /* les cotes et le mobilier, que l'axonométrie éclatée laisse de côté */
      var g = el.closest(".nordg") ? "nord" : el.closest(".echelle") ? "echelle" : el.closest(".dimg") ? "dim" : el.closest(".mbg") ? "mb" : null;
      if(el.tagName === "text"){
        var parts = el.querySelectorAll("tspan").length ? el.querySelectorAll("tspan") : [el];
        parts.forEach(function(t){
          var n = t.getNumberOfChars();
          if(!n) return;
          var ct = getComputedStyle(t), a = t.getStartPositionOfChar(0), b = t.getEndPositionOfChar(n - 1);
          var mid = W(m, (a.x + b.x) / 2, (a.y + b.y) / 2);
          R.push({ k:"t", x:mid[0], y:mid[1], s:t.textContent, size:parseFloat(ct.fontSize) * k,
                   rot:-Math.atan2(m.b, m.a), gras:+ct.fontWeight >= 600, fill:couleur(ct.fill, op), ctx:ctx, g:g });
        });
        return;
      }
      var P = [];
      if(el.tagName === "line") P = [[+el.getAttribute("x1"), +el.getAttribute("y1")], [+el.getAttribute("x2"), +el.getAttribute("y2")]];
      else if(el.tagName === "rect"){
        var x = el.x.baseVal.value, y = el.y.baseVal.value, w = el.width.baseVal.value, h = el.height.baseVal.value;
        P = [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
      } else if(el.tagName === "circle" || el.tagName === "ellipse"){
        var cx = el.cx.baseVal.value, cy = el.cy.baseVal.value;
        var rx = el.tagName === "circle" ? el.r.baseVal.value : el.rx.baseVal.value, ry = el.tagName === "circle" ? rx : el.ry.baseVal.value;
        for(var i = 0; i < 24; i++) P.push([cx + rx * Math.cos(i * Math.PI / 12), cy + ry * Math.sin(i * Math.PI / 12)]);
      } else for(var j = 0; j < el.points.numberOfItems; j++){ var q = el.points.getItem(j); P.push([q.x, q.y]); }
      if(P.length < 2) return;
      var fixe = cs.vectorEffect === "non-scaling-stroke", lw = parseFloat(cs.strokeWidth) || 0;
      var da = cs.strokeDasharray && cs.strokeDasharray !== "none" ? cs.strokeDasharray.split(/[ ,]+/).map(parseFloat) : null;
      var o = { k:"p", pts:P.map(function(p){ return W(m, p[0], p[1]); }), ferme:/polygon|rect|circle|ellipse/.test(el.tagName),
                fill:el.tagName === "line" ? null : couleur(cs.fill, op * +cs.fillOpacity),
                stroke:lw ? couleur(cs.stroke, op * +cs.strokeOpacity) : null, ctx:ctx, g:g,
                cl:el.getAttribute("class") || "", chap:el.getAttribute("data-chap") || null };
      if(fixe){ o.lwPt = lw; o.dashPt = da; } else { o.lw = lw * k; o.dash = da && da.map(function(d){ return d * k; }); }
      if(o.fill || o.stroke) R.push(o);
    });
    return R;
  }
  window.typoPlanches = function(){
    var st0 = Object.assign({}, st), th = document.documentElement.getAttribute("data-mode");
    document.documentElement.setAttribute("data-mode", "light");
    Object.assign(st, { meubles:true, cotes:true, site:true, couleurs:true }); classes();
    var out = DATA.floors.map(function(fl, i){
      st.niv = i; dessiner(false);
      return { i:i, name:fl.name, lvl:fl.lvl, h:fl.h, prims:recolter() };
    });
    Object.assign(st, st0);
    if(th) document.documentElement.setAttribute("data-mode", th); else document.documentElement.removeAttribute("data-mode");
    classes(); dessiner(false);
    return out;
  };

  dessiner(true);
})();
