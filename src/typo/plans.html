<!doctype html><html lang="fr"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Typologies Saxon</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<!-- Les feuilles du site : la page parle la langue du Massing — son rail en
     chaîne, sa barre de vues, sa carte posée sur le plan —, avec ses tokens. -->
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/controls.css">
<link rel="stylesheet" href="../../styles/massing.css">
<script>
/* Le thème et le mode du site, avant le premier rendu : ses attributs, et la
   feuille du thème s'il en a chargé une. */
try {
  var H0 = parent.document.documentElement, H1 = document.documentElement;
  ["data-theme", "data-mode"].forEach(function(a){ var v = H0.getAttribute(a); if(v) H1.setAttribute(a, v); });
  parent.document.querySelectorAll('link[href*="styles/themes/"]').forEach(function(l){
    var n = document.createElement("link"); n.rel = "stylesheet"; n.href = l.href; document.head.appendChild(n);
  });
} catch(e){}
</script>
<style>
/* Le chrome est celui du Massing (`styles/massing.css`). Ici, le seul DESSIN :
   un rendu de concours — poché noir, cloisons à l'échelle, mobilier au trait
   fin, familles en lavis. Sa palette est à lui, et suit le mode du site. */
:root{
  --paper:#FBFAF7; --paper-2:#F1EFEA; --panel:#FFFFFF; --ink:#1D1F1E; --ink-soft:#5E6662;
  --line:#DAD7D0; --hatch:#B9B5AC; --plan-accent:#2F5D50; --wash:20%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-mode="light"]){
    --paper:#171918; --paper-2:#202322; --panel:#1C1F1E; --ink:#ECEAE4; --ink-soft:#A3A9A5;
    --line:#343836; --hatch:#4A4F4C; --plan-accent:#8CC5B2; --wash:30%;
  }
}
:root[data-mode="dark"]{
  --paper:#171918; --paper-2:#202322; --panel:#1C1F1E; --ink:#ECEAE4; --ink-soft:#A3A9A5;
  --line:#343836; --hatch:#4A4F4C; --plan-accent:#8CC5B2; --wash:30%;
}
body{ padding-inline:var(--s-4); }
.mass-rail{ max-height:calc(100vh - 2 * var(--s-4)); }
/* la planche : le cadre du plan du Massing, la hauteur d'un dessin d'étage */
.stage{ position:relative; height:min(72vh, 780px); min-height:420px; background:var(--paper);
  border:1px solid var(--border); border-radius:var(--radius-md);
  overflow:hidden; touch-action:none; cursor:grab; }
.stage.drag{ cursor:grabbing; }
.stage svg{ width:100%; height:100%; display:block; }
.ptip{ position:absolute; pointer-events:none; background:var(--primary); color:var(--primary-foreground);
  padding:var(--s-2) var(--s-3); border-radius:var(--radius-md); max-width:260px;
  font-size:var(--t-xs); box-shadow:var(--shadow-md); }
.ptip b{ display:block; font-weight:600; }
.ptip span{ font-family:var(--font-mono); font-size:var(--t-2xs); opacity:.85; }
.cartouche{ position:absolute; right:var(--s-3); bottom:var(--s-3); background:var(--panel);
  border:1px solid var(--ink); font-size:var(--t-3xs); display:grid; grid-template-columns:auto auto; pointer-events:none; }
.cartouche div{ padding:3px var(--s-2); border-bottom:1px solid var(--line); }
.cartouche div:nth-child(odd){ color:var(--ink-soft); border-right:1px solid var(--line); }
.cartouche div:nth-last-child(-n+2){ border-bottom:0; }
@media (max-width:560px){ .cartouche{ display:none; } }
/* la carte de la pièce choisie descend du coin bas-gauche : la cartouche tient le bas-droit */
.mass-carte input{ inline-size:6em; min-block-size:var(--ctl-h); padding:0 var(--s-2); font:inherit; font-size:var(--t-xs);
  color:var(--foreground); background:var(--card); border:1px solid var(--input); border-radius:var(--radius-md); text-align:right; }
/* le bilan du niveau, le contrôle, la légende */
.typo-bil{ display:grid; grid-template-columns:1fr auto; gap:2px var(--s-3); font-size:var(--t-2xs); color:var(--soft-foreground); }
.typo-bil .v{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; text-align:right; color:var(--foreground); }
.typo-bil .sep{ grid-column:1/-1; border-top:1px solid var(--border-soft); margin:2px 0; }
.typo-non{ margin:0; padding:0; list-style:none; font-size:var(--t-2xs); display:flex; flex-direction:column; gap:2px; }
.typo-non li{ display:flex; justify-content:space-between; gap:var(--s-2); color:var(--soft-foreground); }
.typo-non li span:last-child{ font-family:var(--font-mono); color:var(--warn); }
.typo-ctl{ margin:0; padding:0; list-style:none; font-size:var(--t-2xs); display:flex; flex-direction:column; gap:var(--s-2); }
.typo-ctl li{ display:grid; grid-template-columns:auto 1fr; gap:var(--s-2); align-items:start; color:var(--soft-foreground); }
.typo-ctl li .chip{ margin-top:2px; }
/* la mesure d'un critère, sous son nom : le nom se tronque, la mesure reste lisible */
.typo-mes{ display:block; font-size:var(--t-2xs); color:var(--muted-foreground); }
.typo-ctl li small{ grid-column:2; color:var(--muted-foreground); font-size:var(--t-3xs); line-height:var(--lh-base); }
.typo-legend{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s-1) var(--s-3); font-size:var(--t-2xs); color:var(--soft-foreground); }
.typo-legend i{ display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:var(--s-2); vertical-align:-1px; border:1px solid var(--muted-foreground); }
/* les postes du niveau, sous la planche */
.typo-tab{ overflow-x:auto; }
.typo-tab table{ border-collapse:collapse; width:100%; min-width:540px; font-size:var(--t-xs); }
.typo-tab th, .typo-tab td{ text-align:left; padding:var(--s-1) var(--s-2); border-bottom:1px solid var(--border-soft); }
.typo-tab th{ font-size:var(--t-3xs); text-transform:uppercase; letter-spacing:var(--track-caps); color:var(--muted-foreground); font-weight:600; border-bottom-color:var(--border); }
.typo-tab td.n{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; text-align:right; }
.typo-tab th.n{ text-align:right; }
.typo-tab td .dot{ display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:var(--s-2); }
.st-ok{ color:var(--ok); } .st-warn{ color:var(--warn); } .st-hors{ color:var(--muted-foreground); }
/* ---- le dessin ----
   Les ÉPAISSEURS ne sont pas ici : elles suivent la hiérarchie des traits
   (`TRAITS`, `data/planches.js`), posée en classes `w-*` au chargement — la
   même table que les planches du Rendu. Ici, les couleurs et les remplissages. */
.mur,.poche{fill:var(--ink);stroke:none}
.circ{fill:var(--paper-2)}
/* une cloison est le trait de sa pièce, à son épaisseur réelle (`--cloison`, en m) */
.room,.cell,.cagef,.part{stroke:var(--ink);stroke-width:var(--cloison)}
.fam-cla{fill:color-mix(in oklab,var(--f-cla) var(--wash),var(--paper))}
.fam-adm{fill:color-mix(in oklab,var(--f-adm) var(--wash),var(--paper))}
.fam-eau{fill:color-mix(in oklab,var(--f-eau) var(--wash),var(--paper))}
.fam-tec{fill:color-mix(in oklab,var(--f-tec) var(--wash),var(--paper))}
.fam-spo{fill:color-mix(in oklab,var(--f-spo) var(--wash),var(--paper))}
.fam-uap{fill:color-mix(in oklab,var(--f-uap) var(--wash),var(--paper))}
.fam-pis{fill:color-mix(in oklab,var(--f-pis) var(--wash),var(--paper))}
.fam-ext{fill:color-mix(in oklab,var(--f-ext) var(--wash),var(--paper))}
.mono .room,.mono .cell{fill:var(--paper)}
.room:hover,.cell:hover{fill:color-mix(in oklab,var(--plan-accent) 22%,var(--paper))}
.cagef{fill:var(--paper)}
.part{fill:none}
/* on coupe dans les murs : ils sont pochés, plein — 40 cm dehors, 10 cm dedans ;
   un percement est un vide dans le poché */
.gap,.vide{fill:var(--paper-2);stroke:none}
.gapw{fill:var(--paper);stroke:none}
.porte,.arc,.vitre,.allege,.dessus,.axe,.mb,.esc,.nivl{fill:none;stroke:var(--ink)}
.axe{stroke:var(--ink-soft)}
.mb.eq{fill:color-mix(in oklab,var(--ink) 7%,transparent)}
.mb.tab{fill:var(--ink)}
.mb.pmr{stroke-dasharray:3 2;stroke:var(--ink-soft)}
.mb.pat{stroke-dasharray:1.5 1.5}
.mb.rid{stroke-dasharray:6 3;stroke:var(--ink-soft)}
.mb.tapis{fill:color-mix(in oklab,var(--f-uap) 18%,transparent);stroke:var(--ink-soft)}
.mb.terrain{stroke:var(--f-spo)}
.mb.bassin{fill:color-mix(in oklab,var(--f-pis) 30%,transparent)}
.mb.ligne{stroke:var(--f-pis);stroke-dasharray:4 3}
.mb.asc{fill:color-mix(in oklab,var(--ink) 10%,transparent)}
.esc.point,.niv{fill:var(--ink)}
.esc.fleche{marker-end:url(#fl)}
.esct,.nivt{font-family:var(--font-mono);fill:var(--ink);pointer-events:none}
.esct{font-weight:600}
.site{fill:none;stroke:var(--ink-soft)}
.exist{fill:var(--hatch);stroke:var(--ink-soft)}
.ombre{fill:none;stroke:var(--ink-soft)}
.lab{font-family:var(--font-sans);fill:var(--ink);font-weight:600;pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-width:.14;stroke-linejoin:round}
.lab .m2{font-family:var(--font-mono);font-weight:400;fill:var(--ink-soft)}
.dim{stroke:var(--ink-soft);fill:none}
.dimt{font-family:var(--font-mono);fill:var(--ink-soft);pointer-events:none}
.bulle{fill:var(--paper);stroke:var(--ink-soft)}
.entree{fill:var(--plan-accent)}
.nord{fill:var(--ink)}
.hideF .mbg{display:none}
.hideD .dimg{display:none}
.hideS .siteg{display:none}
@media (prefers-reduced-motion:no-preference){.stage svg g.vue{transition:opacity .2s}}
</style></head><body>

<section class="mass">
<div class="mass-grid">
  <!-- Le rail, en chaîne comme celui du Massing : ce qui PROPOSE en tête,
       toujours visible ; puis les étapes, chacune repliable et portant son état ;
       Emporter au pied. -->
  <aside class="mass-rail" aria-label="Commandes des typologies">
    <section class="mass-prop">
      <h2 class="mass-prop__h">Proposer</h2>
      <button class="btn btn--primary mass-tir" type="button" id="shuffle"
              title="Réordonne les pièces : l'ordre des familles, celui des postes, le bout du noyau. Les volumes, leurs cotes et la répartition ne bougent pas.">
        <span id="ic-shuffle"></span>
        <span class="mass-tir__t"><b>Shuffle typologie</b><span>autre plan, mêmes volumes</span></span>
      </button>
      <div class="mass-nav">
        <span class="mass-nav__r" id="cadre-l"></span>
        <div class="mass-seed">
          <span class="segcap">Seed</span>
          <input type="text" id="seed" class="mono" size="7" spellcheck="false" autocomplete="off"
                 aria-label="Seed du tirage typologie — retape-la pour rejouer le même plan"
                 title="Retape une seed et rejoue le plan à l'identique, dans les mêmes volumes">
        </div>
      </div>
    </section>
    <ol class="mass-etapes" id="etapes"></ol>
    <section class="mass-emporter" aria-label="Emporter">
      <button class="btn" type="button" id="copy">Copier le SVG</button>
    </section>
  </aside>

  <div class="mass-main">
    <!-- Ce qu'on REGARDE : le niveau, les couleurs, ce qui se dessine, le cadrage. -->
    <div class="mass-barre" role="toolbar" aria-label="Affichage du plan">
      <div class="mass-barre__et"><span class="mass-barre__l">Niveau</span><div class="btn-group" id="niv" role="group" aria-label="Niveau montré"></div></div>
      <div class="btn-group" id="couleurs" role="group" aria-label="Couleurs"></div>
      <div class="btn-group" id="montre" role="group" aria-label="Ce qui se dessine"></div>
      <span class="spacer"></span>
      <div class="btn-group" role="group" aria-label="Cadrage">
        <button class="btn btn--icon" type="button" id="z-out" aria-label="Dézoomer" title="Dézoomer">−</button>
        <button class="btn btn--icon" type="button" id="z-in" aria-label="Zoomer" title="Zoomer">+</button>
        <button class="btn" type="button" id="z-fit">Cadrer</button>
      </div>
    </div>
    <div class="mass-vue">
      <div class="mass-vue__h"><h3 class="label" id="titre">Plan</h3><span class="spacer"></span><span class="mass-cam mono" id="sous"></span></div>
      <div class="mass-vue__cadre">
        <div class="stage" id="stage">
          <svg id="svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Plan d'étage">
            <defs>
              <pattern id="hach" width="0.8" height="0.8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                <rect width="0.8" height="0.8" fill="var(--paper)"/>
                <line x1="0" y1="0" x2="0" y2="0.8" stroke="var(--hatch)" stroke-width="0.12"/>
              </pattern>
              <marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <g id="vue" class="vue"></g>
          </svg>
          <div class="ptip" id="ptip" hidden></div>
          <div class="cartouche" id="cartouche"></div>
        </div>
        <div class="mass-carte" id="carte" hidden></div>
      </div>
    </div>
    <div class="mass-vue">
      <div class="mass-vue__h"><h3 class="label">Postes du niveau</h3></div>
      <div class="typo-tab">
        <table id="tab">
          <thead><tr><th>Poste</th><th class="n">Nb</th><th class="n">Demandé m²</th><th class="n">Dessiné m²</th><th>État</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</section>

<script>
/* Les données vivent dans le projet : l'onglet Typologies les donne à
   l'ouverture (`src/typo/donnees.js`). Ouverte seule, la page n'a rien à dessiner. */
var DATA = null;
try { DATA = parent !== window && parent.typoDonnees ? parent.typoDonnees() : null; } catch(e){}
/* LA HIÉRARCHIE DES TRAITS : `TRAITS` (mm, `data/planches.js`) en px d'écran, à
   96 px par pouce — le plan se lit à l'écran comme imprimé à 100 %, quel que
   soit le zoom (« non-scaling »). Une classe `w-*` par rang. */
(function(){
  var R = DATA && DATA.regles;
  if(!R || !R.traits) return;
  var T = R.traits, px = 96 / 25.4, css = ":root{--cloison:" + R.cloison + "}";
  function m(a){ return a.map(function(v){ return (v * px).toFixed(2); }).join(" "); }
  ["coupe", "menuiserie", "vu", "dessus", "axe", "cote"].forEach(function(k){
    css += ".w-" + k + "{stroke-width:" + (T[k] * px).toFixed(2) + "px;vector-effect:non-scaling-stroke}";
  });
  css += ".w-dessus{stroke-dasharray:" + m(T.tirets) + "}.w-axe{stroke-dasharray:" + m(T.mixte) + "}";
  var el = document.createElement("style"); el.textContent = css; document.head.appendChild(el);
})();
</script>
<script>
/* Le générateur de plans est au projet (`src/typo/gen.js`) : l'hôte le donne,
   comme les données. La recherche et le jugement tirent le même plan. */
var PG = null;
try { PG = DATA && parent.typoPG ? parent.typoPG(DATA) : null; } catch(e){}
</script>
<script>
/* ===== Mobilier et équipements, dans le repère du local =====
   u le long du couloir (0 → W), v du couloir vers la façade (0 → H).
   Chaque fonction rend une liste de primitives : r (rectangle), c (cercle),
   l (ligne), a (arc de porte). Les cotes sont celles d'un mobilier scolaire. */
var MEUBLES = (function(){
  function R(u, v, w, h, k){ return { t:"r", u:u, v:v, w:w, h:h, k:k || "" }; }
  function C(u, v, r, k){ return { t:"c", u:u, v:v, r:r, k:k || "" }; }
  function L(u1, v1, u2, v2, k){ return { t:"l", u1:u1, v1:v1, u2:u2, v2:v2, k:k || "" }; }
  function X(u, v, s, h, k){ return { t:"x", u:u, v:v, s:s, h:h, k:k || "" }; }
  function PL(pts, k){ return { t:"p", pts:pts, k:k || "" }; }
  /* les appareils aux cotes de `RULES.plan.sanitaire`. Un lavabo l × p adossé
     à un mur, (u, v) son coin ; `surU` : sa largeur le long de u. */
  function lavabo(o, u, v, surU){
    var S = PG.PLAN.sanitaire.lavabo, w = surU ? S[0] : S[1], h = surU ? S[1] : S[0];
    o.push(R(u, v, w, h, "eq")); o.push({ t:"e", u:u + w / 2, v:v + h / 2, rx:w * 0.32, ry:h * 0.32, k:"" });
    return o;
  }
  /* une cuvette de WC, l × p tout compris : le réservoir contre le mur, la
     cuvette devant ; (cu, cv) le point du mur sur son axe, `cote` le mur
     ("u+" : celui des u croissants…) */
  function cuvette(o, cu, cv, cote){
    var S = PG.PLAN.sanitaire.wc, l = S[0], p = S[1], r = 0.18, sg = cote[1] === "+" ? -1 : 1, c = r + (p - r) / 2;
    if(cote[0] === "v"){ o.push(R(cu - l / 2, sg > 0 ? cv : cv - r, l, r)); o.push({ t:"e", u:cu, v:cv + sg * c, rx:l * 0.45, ry:(p - r) / 2, k:"eq" }); }
    else { o.push(R(sg > 0 ? cu : cu - r, cv - l / 2, r, l)); o.push({ t:"e", u:cu + sg * c, v:cv, rx:(p - r) / 2, ry:l * 0.45, k:"eq" }); }
    return o;
  }

  function etageres(W, H, out, cotes, p){
    p = p || 0.5;
    if(cotes.indexOf("f") >= 0) out.push(R(0.15, H - p - 0.05, W - 0.3, p));
    if(cotes.indexOf("g") >= 0 && H > 2) out.push(R(0.05, 0.9, p, H - 1.0 - (cotes.indexOf("f") >= 0 ? p : 0)));
    if(cotes.indexOf("d") >= 0 && H > 2) out.push(R(W - p - 0.05, 0.9, p, H - 1.0 - (cotes.indexOf("f") >= 0 ? p : 0)));
    return out;
  }

  /* salle de classe : tableau sur le mur gauche, élèves face à lui, jour de la façade à gauche des élèves */
  function classe(W, H){
    var o = [];
    o.push(R(0.06, H * 0.5 - 2, 0.1, 4, "tab"));                 /* tableau */
    o.push(R(1.0, H * 0.5 - 0.8, 0.7, 1.6));                    /* bureau du maître */
    o.push(R(1.85, H * 0.5 - 0.22, 0.42, 0.44, "ch"));
    lavabo(o, 0.4, 0.06, true);
    if(W > 5) o.push(R(1.3, 0.06, Math.max(0, W - 2.9), 0.45));  /* armoires côté couloir */
    var u = 2.9, n = 0;
    while(u + 0.55 + 0.45 <= W - 0.4){
      for(var v = 1.0; v + 1.3 <= H - 0.5; v += 1.75){
        o.push(R(u, v, 0.55, 1.3));
        o.push(R(u + 0.62, v + 0.1, 0.38, 0.38, "ch"));
        o.push(R(u + 0.62, v + 0.82, 0.38, 0.38, "ch"));
        n += 2;
      }
      u += 1.35;
    }
    return o;
  }
  function tableReunion(W, H, o){
    var tw = Math.min(W - 2.0, 8), th = Math.min(1.2, H - 2.2);
    if(tw < 1.2 || th < 0.7) return o;
    var u0 = (W - tw) / 2, v0 = (H - th) / 2;
    o.push(R(u0, v0, tw, th));
    for(var u = u0 + 0.35; u + 0.4 <= u0 + tw - 0.1; u += 0.7){
      o.push(R(u, v0 - 0.5, 0.4, 0.4, "ch")); o.push(R(u, v0 + th + 0.1, 0.4, 0.4, "ch"));
    }
    return o;
  }
  function appui(W, H){
    var o = []; etageres(W, H, o, "g", 0.45);
    var tw = Math.min(1.6, W - 1.8), th = Math.min(3.2, H - 2.4), u0 = (W - tw) / 2 + 0.2, v0 = (H - th) / 2;
    if(tw > 0.8){
      o.push(R(u0, v0, tw, th));
      for(var v = v0 + 0.3; v + 0.4 <= v0 + th; v += 0.8){
        o.push(R(u0 - 0.5, v, 0.4, 0.4, "ch")); o.push(R(u0 + tw + 0.1, v, 0.4, 0.4, "ch"));
      }
    }
    return o;
  }
  function acm(W, H){
    var o = []; etageres(W, H, o, "g", 0.6);
    o.push(R(0.8, 0.06, W - 1.8, PG.PLAN.travail, "eq"));         /* plans de travail, éviers */
    for(var u = 1.6; u + 1.2 <= W - 0.6; u += 2.6)
      for(var v = 1.6; v + 2.4 <= H - 0.6; v += 3.3){
        o.push(R(u, v, 1.2, 2.4));
        [[-0.35, 0.5], [-0.35, 1.9], [1.55, 0.5], [1.55, 1.9]].forEach(function(p){ o.push(C(u + p[0], v + p[1], 0.18, "ch")); });
      }
    return o;
  }
  function activite(W, H){
    var o = []; etageres(W, H, o, "f", 0.45);
    o.push(R(0.4, 0.8, Math.min(3.2, W * 0.4), Math.min(3.2, H * 0.45), "tapis"));

  /* sanitaires : cabines de 0,95 × 1,50 le long du plus grand côté, lavabos en
     face, un passage libre devant elles. Le WC PMR : la cuvette à un demi-
     passage du mur (le transfert latéral), le lavabo, et l'aire de rotation
     d'un fauteuil (`RULES.plan.rotation`) dessinée, libre. */
  function wc(W, H, n, pmr){

    if(pmr || n === 1){

      lavabo(o, 0, H / 2 - P.sanitaire.lavabo[0] / 2, false);

      return o;
    }

    var cabDepth = Math.min(1.5, prof - P.passage);
    var m = Math.max(1, Math.min(n, Math.floor((Lg - 0.9) / 0.95)));

      else { o.push(R(s, H - cabDepth, 0.95, cabDepth, "cab")); cuvette(o, s + 0.475, H, "v+"); }
    }

    for(var j = 0; j < nl; j++){

  }

    var dz = douches ? Math.max(PG.PLAN.sanitaire.douche, Math.min(2.4, W * 0.3)) : 0, pd = Math.max(1.0, PG.PLAN.sanitaire.douche);

    o.push(L(0.05, 0.9, 0.05, H - 0.1, "pat"));
    if(W - dz > 2.2){ o.push(R(W - dz - 0.5, 0.9, 0.4, H - 1.0)); o.push(L(W - dz - 0.05, 0.9, W - dz - 0.05, H - 0.1, "pat")); }
    if(W - dz > 3.6) o.push(R(W / 2 - dz / 2 - 0.2, 1.6, 0.4, H - 2.4));
    if(douches){

    o.push(R(0.05, H - T - 0.05, W - 0.1, T, "eq"));
    o.push(R(0.05, 0.9, T, H - 1.0 - T, "eq"));
    if(W > 4) o.push(R(W - T - 0.05, 0.9, T, H - 1.0 - T, "eq"));
    [0.35, 0.95].forEach(function(du){ [0.17, 0.43].forEach(function(dv){ o.push(C(1.6 + du, H - T - 0.05 + dv, 0.13)); }); });
    if(W > 4.5 && H > 4.5) o.push(R(W / 2 - 1.2, H / 2 - 0.6, 2.4, 1.2, "eq"));

     volées au giron `marche.g` (2h + g ≈ 63 cm, Blondel). La coupe

  function cage(W, H, r){

    var n1 = Math.ceil(n / 2), g = P.marche.g, L1 = (n1 - 1) * g;

    /* la coupe passe dans la marche dont le dessus la dépasse */
    var kc = Math.max(1, Math.floor(P.coupe / hm)), vc = Math.min(v1 - 0.3, v0 + (kc - 0.5) * g), dz = 0.3;
    function fleche(u, sens, plein){
      var um = u + fw / 2, cl = plein ? "esc w-vu" : "esc w-dessus";
      o.push(C(um, v0 + 0.12, 0.05, "esc point w-vu"));
      if(plein){ o.push(L(um, v0 + 0.12, um, v1 - 0.12, "esc fleche w-vu")); }
      else { o.push(L(um, v0 + 0.12, um, vc, "esc w-vu")); o.push(L(um, vc, um, v1 - 0.12, "esc fleche w-dessus")); }
      o.push(X(um, v0 - 0.3, sens, 0.4, "esct"));

      var v = v0 + k * g;

    var dl = Math.min(P.porte, wa - 0.3), ug = ws + c + (wa - dl) / 2;

    o.push(R(ug - dl / 2, vl - c - 0.08, dl, 0.05, "w-menuiserie"));
    o.push(L(ug + dl * 0.05, vl - c - 0.25, ug + dl * 0.55, vl - c - 0.25, "esc fleche w-vu"));

  function pour(r, W, H){
    var n = r.n || "";

    if(/Vestiaires (élèves|professeurs)/i.test(n)) return vestiaire(W, H, true);

<script>
(function(){

  /* ce qu'on REGARDE seulement — niveau, couleurs, calques : une préférence de

  /* ---------- proposer : Shuffle typologie et sa seed ----------

      m.appendChild(bouton(o[1], o[1] === "Site" ? "Périmètre, existant et volumes absents du niveau" : null, st[o[0]], function(){ st[o[0]] = !st[o[0]]; save(); classes(); barre(); }));
    });
  }
  barre();
  function classes(){
    svg.classList.toggle("hideF", !st.meubles); svg.classList.toggle("hideD", !st.cotes);
    svg.classList.toggle("hideS", !st.site); svg.classList.toggle("mono", !st.couleurs);
  }

  /* ---------- le rail : les étapes ----------
     Chacune son numéro, son nom, une ligne qui dit ce qu'elle porte, et son
     ÉTAT à droite — la seule chose qu'on lise sans l'ouvrir. */
  var OUVERT = {};
  function etape(id, num, titre, sous, etat, corps, ouvrir){
    var li = document.createElement("li"); li.className = "mass-etape";
    var d = document.createElement("details");
    d.open = OUVERT[id] != null ? OUVERT[id] : !!ouvrir;
    d.innerHTML = '<summary class="mass-etape__s"><span class="mass-etape__num mono">' + num + '</span>' +
      '<span class="mass-etape__t"><b>' + titre + '</b>' + (sous ? '<span>' + sous + '</span>' : "") + '</span>' +
      '<span class="mass-etape__e">' + (etat || "") + '</span>' + ic("chevron", 14) + '</summary>' +
      '<div class="mass-etape__b">' + corps + '</div>';
    d.addEventListener("toggle", function(){ OUVERT[id] = d.open; });
    li.appendChild(d);
    return li;
  }
  function puce(txt, cls, titre){ return '<i class="chip chip--' + cls + '"' + (titre ? ' title="' + esc(titre) + '"' : "") + '>' + txt + '</i>'; }
  var LEGENDE = '<div class="typo-legend">' + FAMS.map(function(f){
    return '<span><i style="background:color-mix(in oklab,var(--f-' + f[0] + ') var(--wash),var(--paper))"></i>' + f[1] + '</span>';
  }).join("") + '</div>';

  /* ---------- géométrie ---------- */
  function P(f, x, y){ var w = PG.versMonde(f, x, y); return [w[0], -w[1]]; }
  function pts(f, list){ return list.map(function(p){ var q = P(f, p[0], p[1]); return q[0].toFixed(3) + "," + q[1].toFixed(3); }).join(" "); }
  function rectL(f, x0, y0, x1, y1){ return [[x0, y0], [x1, y0], [x1, y1], [x0, y1]]; }
  function fr(f, frame, x0, u, v){ return PG.versEtage(f, frame, x0, u, v); }
  function rectF(f, frame, x0, u0, v0, w, h){
    return [fr(f, frame, x0, u0, v0), fr(f, frame, x0, u0 + w, v0), fr(f, frame, x0, u0 + w, v0 + h), fr(f, frame, x0, u0, v0 + h)];
  }
  function esc(s){ return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
  function angDeg(f){ var d = -f.a * 180 / Math.PI; while(d > 90) d -= 180; while(d < -90) d += 180; return d; }

  var bounds;
  function grow(x, y){ bounds[0] = Math.min(bounds[0], x); bounds[1] = Math.min(bounds[1], y); bounds[2] = Math.max(bounds[2], x); bounds[3] = Math.max(bounds[3], y); }

  /* ---------- dessin d'un niveau ---------- */
  function dessiner(recadrer){
    var res = PG.genNiveau(DATA, st.parti, st.niv), fl = res.fl;
    INFO = []; bounds = [Infinity, Infinity, -Infinity, -Infinity];
    /* LES CALQUES, dans l'ordre où l'on dessine un plan — le plus lourd vient
       se poser sur le plus léger : le contexte ; les axes, légers ; les murs
       extérieurs, pochés, à leur épaisseur ; les sols ; les pièces et leurs
       cloisons ; les portes et fenêtres, qui les percent ; l'escalier ; ce qui
       est au-dessus de la coupe ; le mobilier ; puis les noms, les niveaux et
       les cotes. */
    var out = { site:[], ombre:[], axe:[], fond:[], sol:[], rooms:[], part:[], ouv:[], esc:[], dessus:[], mb:[], lab:[], niv:[], dim:[] };
    var cur = fl.lvl;
    function altDe(f){ return ((DATA.regles || {}).alt || {})[(f.v.aile || f.v.id) + "|" + f.e.i]; }
    /* le noyau sait la hauteur de son étage et s'il monte, s'il descend */
    function cageDe(f){
      var lv = f.v.lv.map(function(e){ return DATA.floors[e.i] ? DATA.floors[e.i].lvl : 0; }), al = altDe(f);
      return { kind:"cage", h:al ? al.h : fl.h, haut:lv.some(function(l){ return l > cur; }), bas:lv.some(function(l){ return l < cur; }) };
    }
    var rects = res.F.map(function(f){ return { f:f }; });
    function dansAutre(f, x, y){
      var w = PG.versMonde(f, x, y);
      return res.F.some(function(g){
        if(g === f) return false;
        var c = Math.cos(-g.a), s = Math.sin(-g.a), dx = w[0] - g.cx, dy = w[1] - g.cy;
        var lx = dx * c - dy * s, ly = dx * s + dy * c;
        return Math.abs(lx) <= g.L / 2 + 0.6 && Math.abs(ly) <= g.D / 2 + 0.6;
      });
    }

    /* site, existant, et l'emprise des volumes absents de ce niveau */
    var per = DATA.site.per.map(function(p){ return p[0] + "," + (-p[1]); }).join(" ");
    out.site.push('<polygon class="site w-axe" points="' + per + '"/>');
    DATA.site.bat.forEach(function(b){
      var ferme = b.length > 3 && b[0][0] === b[b.length - 1][0] && b[0][1] === b[b.length - 1][1];
      out.site.push('<' + (ferme ? "polygon" : "polyline") + ' class="exist w-vu" points="' + b.map(function(p){ return p[0] + "," + (-p[1]); }).join(" ") + '"' + (ferme ? "" : ' style="fill:none"') + '/>');
    });
    DATA.partis[st.parti].vols.forEach(function(v){
      if(v.lv.some(function(e){ return e.i === st.niv; })) return;
      var e = v.lv[0], f = { cx:0, cy:0, a:v.a };
      var p = PG.local(v.x, v.y, v.a, e.dx || 0, e.dy || 0); f.cx = p[0]; f.cy = p[1];
      out.ombre.push('<polygon class="ombre w-dessus" points="' + pts(f, rectL(f, -e.w / 2 - 0.5, -e.d / 2 - 0.5, e.w / 2 + 0.5, e.d / 2 + 0.5)) + '"/>');
    });

    var circDessinee = 0, cagesA = 0, libreA = 0, pose = {};
    res.F.forEach(function(f){
      var L = f.L, D = f.D, m = PG.MUR;
      f.ouvs = { "-1":[], "1":[] };
      rectL(f, -L / 2 - m, -D / 2 - m, L / 2 + m, D / 2 + m).forEach(function(p){ var q = P(f, p[0], p[1]); grow(q[0], q[1]); });
      out.fond.push('<polygon class="mur" points="' + pts(f, rectL(f, -L / 2 - m, -D / 2 - m, L / 2 + m, D / 2 + m)) + '"/>');
      /* les sols APRÈS tous les murs : là où deux ailes d'un même volume se
         touchent, le sol de l'une recouvre le mur de l'autre — pas de mur
         entre elles */
      out.sol.push('<polygon class="circ" points="' + pts(f, rectL(f, -L / 2, -D / 2, L / 2, D / 2)) + '"/>');
      /* la circulation : ce que le corps a de plus que ses pièces et ses noyaux */
      if(!f.fixe){
        var occ = 0; f.rooms.forEach(function(r){ occ += r.a; }); f.cages.forEach(function(c){ occ += c.W * c.H; });
        circDessinee += f.L * f.D - occ;
      }

      f.rooms.forEach(function(r){
        if(r.kind === "bloc"){
          r.cel.forEach(function(c){
            local1(f, r.frame, r.x0, c, c.u0, (r.v0 || 0) + c.v0, c.W, c.H, "cell", true);
            pose[c.key] = (pose[c.key] || 0) + c.a;
          });
          return;
        }
        local1(f, r.frame, r.x0, r, 0, r.v0 || 0, r.W, r.H, "room", false);
        pose[r.key] = (pose[r.key] || 0) + r.a;
      });
      /* le sol libre d'un rang n'est pas un reste muet : un dégagement, nommé */
      (f.paliers || []).forEach(function(k){
        if(k.W * k.H >= PG.PETIT) etiquette(f, k.frame, k.x0, 0, 0, k.W, k.H, "Dégagement", k.W * k.H, false);
      });
      f.cages.forEach(function(c){
        cagesA += c.W * c.H;
        out.rooms.push('<polygon class="cagef" data-k="' + INFO.length + '" points="' + pts(f, rectF(f, c.bande, c.x0, 0, c.v0 || 0, c.W, c.H)) + '"/>');
        INFO.push({ lab:"Noyau · escalier et ascenseur", n:"Noyau de circulation", a:c.W * c.H, W:c.W, H:c.H, f:"" });
        meubles(f, c.bande, c.x0, cageDe(f), 0, c.v0 || 0, c.W, c.H, out.esc);
        porte(f, c.bande, c.x0, c.W - 0.15, c.v0 || 0, PG.NOY.volee);
        /* son nom sur le palier, devant la gaine : l'escalier garde sa place */
        var wl = Math.min(PG.NOY.asc[0], c.W * 0.45) + PG.CLOISON;
        etiquette(f, c.bande, c.x0, c.W - wl, c.v0 || 0, wl, Math.min(0.9, c.H), "Noyau", c.W * c.H, true);
      });

      /* ---- un local : fond, cloisons, ouvertures, mobilier, étiquette ---- */
      function local1(f, frame, x0, r, u0, v0, W, H, cls, cellule){
        var trav = r.kind === "trav";
        out.rooms.push('<polygon class="' + cls + ' fam-' + (r.f || "tec") + '" data-chap="' + (r.chap || String(r.key || "").split("|")[0]) + '" data-k="' + INFO.length + '"' + (trav ? ' style="stroke:none"' : "") + ' points="' + pts(f, rectF(f, frame, x0, u0, v0, W, H)) + '"/>');
        INFO.push({ lab:r.lab || r.n, n:r.n, a:r.a, W:W, H:H, f:r.f,
                    regle:r.kind === "band" ? { id:f.v.id, i:f.e.i, lab:r.lab, a:r.a, ext:!!r.ext, key:r.key } : null });
        if(trav){
          [r.x0, r.x0 + r.W].forEach(function(x){
            if(Math.abs(Math.abs(x) - f.L / 2) < 0.01) return;
            [[-f.D / 2, f.yc0], [f.yc1, f.D / 2]].forEach(function(s){
              if(!f.deux && s[0] === -f.D / 2) return;
              var p1 = P(f, x, s[0]), p2 = P(f, x, s[1]);
              out.part.push('<line class="part" x1="' + p1[0] + '" y1="' + p1[1] + '" x2="' + p2[0] + '" y2="' + p2[1] + '"/>');
            });
          });
          /* entrées sur les deux façades */
          [-1, 1].forEach(function(sg){
            var xc = r.x0 + r.W / 2, yw = sg * f.D / 2;
            if(dansAutre(f, xc, sg * (f.D / 2 + 1.2))) return;
            ouvertureMur(f, xc, sg, PG.PLAN.porteDouble, true);
            if((sg < 0) === (Math.cos(f.a) > 0)){
              var t = [P(f, xc, yw + sg * 1.4), P(f, xc - 0.9, yw + sg * 2.6), P(f, xc + 0.9, yw + sg * 2.6)];
              out.ouv.push('<polygon class="entree" points="' + t.map(function(q){ return q.join(","); }).join(" ") + '"/>');
            }
          });
        }
        /* portes */
        if(r.ext && !cellule){
          /* la pièce qui ferme le couloir : sa porte dans le pignon du couloir */
          porteX(f, r.ext < 0 ? x0 + W : x0, (f.yc0 + f.yc1) / 2, Math.min(PG.PLAN.porte, PG.COULOIR - 0.6), r.ext < 0 ? -1 : 1);
        } else if(cellule && r.sas){
          /* une pièce d'un bloc empilé : sa porte sur le sas */
          var dS = Math.min(PG.PLAN.porte, H - 0.3), qS = fr(f, frame, x0, u0 + (r.sas > 0 ? W : 0), v0 + H / 2);
          porteX(f, qS[0], qS[1], dS, r.sas);
        } else if(cellule && r.porteU != null){
          /* la pièce du fond d'un bloc : sa porte au bout du sas */
          var dU = Math.min(PG.PLAN.porte, W - 0.4);
          porte(f, frame, x0, r.porteU + dU / 2, v0, dU);
        } else if(r.kind === "band" || (cellule)){
          /* la porte là où le couloir passe */
          /* une cabine de WC (1 m) a sa porte de 80 cm */
          var jeu = cellule && W < 1.3 ? 0.1 : 0.2, dw = Math.min(PG.PLAN.porte, W - 2 * jeu);
          var uh = Math.max(f.zl - x0 + dw + 0.15, Math.min(u0 + W - jeu - (cellule ? 0 : 0.05), f.zr - x0 - 0.15));
          if(W >= (cellule ? 0.9 : 1.1) && uh - dw >= u0 - 0.01 && uh <= u0 + W + 0.01) porte(f, frame, x0, uh, r.porteV != null ? r.porteV : Math.max(0, v0), dw);
        } else if(r.kind === "full" && r.x0 > -f.L / 2 + 0.01){
          var ym = f.deux ? (f.yc0 + f.yc1) / 2 : (f.yc0 + f.yc1) / 2;
          porteX(f, r.x0, ym, Math.min(PG.PLAN.porteDouble, PG.COULOIR - 0.5), 1);
        } else if(r.kind === "full" && r.x0 + r.W < f.L / 2 - 0.01){
          porteX(f, r.x0 + r.W, (f.yc0 + f.yc1) / 2, Math.min(PG.PLAN.porteDouble, PG.COULOIR - 0.5), -1);
        } else if(r.kind === "fixe"){
          [-1, 1].forEach(function(sg){ if(!dansAutre(f, 0, sg * (f.D / 2 + 1.2))) ouvertureMur(f, sg < 0 ? -f.L / 4 : f.L / 4, sg, PG.PLAN.porteDouble, true); });
        }
        /* un petit hall de bande a sa porte d'entrée sur la façade */
        if(r.kind === "band" && /^Hall/i.test(r.n || "") && (frame === "A" || frame === "B")){
          var sgH = frame === "A" ? -1 : 1, xH = fr(f, frame, x0, u0 + W / 2, 0)[0];
          if(!dansAutre(f, xH, sgH * (f.D / 2 + 1.2))) ouvertureMur(f, xH, sgH, Math.min(PG.PLAN.porteDouble, W - 0.6), true);
        }
        /* fenêtres sur les façades libres */
        var facs = [];
        if(frame === "A" || frame === "B"){ if(Math.abs(v0 + H - f.bb[frame]) < 0.02) facs.push(frame === "A" ? -1 : 1); }
        else if(r.fac){ facs.push(r.fac); }
        else if(!trav){ facs.push(-1, 1); }
        facs.forEach(function(sg){
          var FE = PG.PLAN.fenetre, n = Math.max(1, Math.floor((W - 0.6) / FE.pas)), lw = Math.min(FE.larg, W - 0.8);
          if(lw < 0.6 || (r.n && /Abri|chauffage|Local technique|Dépôt|rangement|Économat|nettoyage/i.test(r.n))) return;
          for(var k = 0; k < n; k++){
            var uc = u0 + W * (k + 0.5) / n, xc = fr(f, frame === "A" || frame === "B" ? frame : "full", x0, uc, 0)[0];
            if(dansAutre(f, xc, sg * (f.D / 2 + 1.0))) continue;
            ouvertureMur(f, xc, sg, lw, false);
          }
        });
        meubles(f, frame, x0, r, u0, v0, W, H);
        etiquette(f, frame, x0, u0, v0, W, H, r.lab || r.n, r.a, false);
      }
    });

    /* passages entre corps accolés : le couloir traverse les deux murs de pignon */
    res.F.forEach(function(f){
      var ym = (f.yc0 + f.yc1) / 2;
      [-1, 1].forEach(function(sg){
        if(!PG.passage(res.F, f, sg)) return;
        var x0 = sg < 0 ? -f.L / 2 - 1.05 : f.L / 2 - 0.02, x1 = sg < 0 ? -f.L / 2 + 0.02 : f.L / 2 + 1.05;
        out.ouv.push('<polygon class="circ" points="' + pts(f, rectL(f, x0, ym - 0.9, x1, ym + 0.9)) + '"/>');
      });
    });
    /* DEUX VOLUMES QUI SE TOUCHENT, un seul mur entre eux. Les ailes d'un
       volume fusionné n'en ont aucun (leurs sols recouvrent leurs murs) ; deux
       volumes accolés — la salle de sport et l'école, deux corps que le
       Massing n'a pas pu assembler — gardent le mur de l'un : celui de l'autre,
       et ce qui les sépare encore (moins de `fusion` m), deviennent un
       dégagement, et une porte les relie. Côtés parallèles ou en équerre. */
    var FUS = (DATA.regles && DATA.regles.fusion != null) ? DATA.regles.fusion : 1, MU = PG.MUR;
    function boiteDans(f, g){
      var c = Math.cos(f.a), s2 = Math.sin(f.a), dx = g.cx - f.cx, dy = g.cy - f.cy;
      var u = dx * c + dy * s2, w = -dx * s2 + dy * c, tr = Math.abs(Math.sin(g.a - f.a)) > .5;
      var hw = (tr ? g.D : g.L) / 2, hd = (tr ? g.L : g.D) / 2;
      return { x0:u - hw, x1:u + hw, y0:w - hd, y1:w + hd };
    }
    res.F.forEach(function(f, i){
      res.F.forEach(function(g, j){
        if(j <= i || Math.abs(Math.sin(2 * (f.a - g.a))) > .05) return;
        /* le dégagement va du côté de celui qui n'a pas de cotes imposées ;
           tout se lit dans son repère */
        var dg = f.fixe && !g.fixe ? g : f, autre = dg === f ? g : f;
        var B = boiteDans(dg, autre), A = { x0:-dg.L / 2, x1:dg.L / 2, y0:-dg.D / 2, y1:dg.D / 2 };
        /* [écart entre intérieurs, axe du recouvrement, côté où est l'autre] */
        [[B.x0 - A.x1, "y", 1], [A.x0 - B.x1, "y", -1], [B.y0 - A.y1, "x", 1], [A.y0 - B.y1, "x", -1]].forEach(function(k){
          var t = k[0], ax = k[1], sg = k[2];
          if(t < .05 || t > 2 * MU + FUS + .05) return;
          var l0 = Math.max(A[ax + "0"], B[ax + "0"]), l1 = Math.min(A[ax + "1"], B[ax + "1"]);
          if(l1 - l0 < 1) return;
          var mi = (l0 + l1) / 2, lp = Math.min(2.4, l1 - l0 - .6), r;
          if(ax === "y"){
            var x0 = sg > 0 ? A.x1 : B.x1 + MU, x1 = sg > 0 ? B.x0 - MU : A.x0;
            r = [rectL(dg, x0, l0, x1, l1),
                 sg > 0 ? rectL(dg, x0 - .02, mi - lp / 2, x1 + MU + .02, mi + lp / 2)
                        : rectL(dg, x0 - MU - .02, mi - lp / 2, x1 + .02, mi + lp / 2)];
          } else {
            var y0 = sg > 0 ? A.y1 : B.y1 + MU, y1 = sg > 0 ? B.y0 - MU : A.y0;
            r = [rectL(dg, l0, y0, l1, y1),
                 sg > 0 ? rectL(dg, mi - lp / 2, y0 - .02, mi + lp / 2, y1 + MU + .02)
                        : rectL(dg, mi - lp / 2, y0 - MU - .02, mi + lp / 2, y1 + .02)];
          }
          out.sol.push('<polygon class="circ" points="' + pts(dg, r[0]) + '"/>');
          if(lp >= .9) out.ouv.push('<polygon class="circ" points="' + pts(dg, r[1]) + '"/>');
        });
      });
    });
    /* UN VANTAIL, ouvert à 90° : h la paumelle, a le bout du vantail fermé
       (dans le mur), b ouvert — en coordonnées de l'étage. Le vantail est une
       menuiserie coupée (trait moyen), le débattement un arc fin. */
    function vantail(f, h, a, b){
      var p = P(f, h[0], h[1]), q = P(f, b[0], b[1]), arc = [];
      out.ouv.push('<line class="porte w-menuiserie" x1="' + p[0] + '" y1="' + p[1] + '" x2="' + q[0] + '" y2="' + q[1] + '"/>');
      for(var k = 0; k <= 12; k++){
        var t = k / 12 * Math.PI / 2, c = Math.cos(t), sn = Math.sin(t);
        arc.push([h[0] + (a[0] - h[0]) * c + (b[0] - h[0]) * sn, h[1] + (a[1] - h[1]) * c + (b[1] - h[1]) * sn]);
      }
      out.ouv.push('<polyline class="arc w-vu" points="' + pts(f, arc) + '"/>');
    }
    /* la porte d'une pièce dans la cloison du couloir : le vide, un vantail */
    function porte(f, frame, x0, uh, v, dw){
      if(dw < 0.5) return;
      var g = rectF(f, frame, x0, uh - dw, v - 0.09, dw, 0.18);
      out.ouv.push('<polygon class="gap" points="' + pts(f, g) + '"/>');
      vantail(f, fr(f, frame, x0, uh, v), fr(f, frame, x0, uh - dw, v), fr(f, frame, x0, uh, v + dw));
    }
    /* une porte dans une cloison en travers du couloir ; à deux battants dès
       qu'elle atteint la largeur d'une porte double */
    function porteX(f, x, ym, dw, sens){
      out.ouv.push('<polygon class="gap" points="' + pts(f, rectL(f, x - 0.09, ym - dw / 2, x + 0.09, ym + dw / 2)) + '"/>');
      if(dw >= PG.PLAN.porteDouble - 0.01){
        [-1, 1].forEach(function(k){ var y = ym + k * dw / 2; vantail(f, [x, y], [x, ym], [x + sens * dw / 2, y]); });
      } else vantail(f, [x, ym + dw / 2], [x, ym - dw / 2], [x + sens * dw, ym + dw / 2]);
    }
    /* UN PERCEMENT DANS LE MUR EXTÉRIEUR. Le mur s'interrompt. Une porte :
       deux vantails ouverts vers l'intérieur, leurs arcs. Une fenêtre : son
       cadre et son verre coupés, deux traits moyens au milieu du mur, et
       l'allège, sous la coupe, vue en trait fin aux deux nus du mur. */
    function ouvertureMur(f, xc, sg, lw, porteM){
      var y0 = sg * f.D / 2, y1 = sg * (f.D / 2 + PG.MUR);
      out.ouv.push('<polygon class="gapw" points="' + pts(f, rectL(f, xc - lw / 2, Math.min(y0, y1), xc + lw / 2, Math.max(y0, y1))) + '"/>');
      f.ouvs[sg].push([xc - lw / 2, xc + lw / 2]);
      if(porteM){
        [-1, 1].forEach(function(s){ var x = xc + s * lw / 2; vantail(f, [x, y0], [xc, y0], [x, y0 - sg * lw / 2]); });
        return;
      }
      function trait(t, cls){
        var y = sg * (f.D / 2 + PG.MUR * t), a = P(f, xc - lw / 2, y), b = P(f, xc + lw / 2, y);
        out.ouv.push('<line class="' + cls + '" x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '"/>');
      }
      trait(0, "allege w-vu"); trait(1, "allege w-vu");
      trait(0.42, "vitre w-menuiserie"); trait(0.58, "vitre w-menuiserie");
    }
    /* le mobilier (`out.mb`, au trait fin, qu'on peut masquer) ou le noyau
       (`out.esc` : son escalier et sa gaine sont de l'architecture) */
    function meubles(f, frame, x0, r, u0, v0, W, H, dest){
      dest = dest || out.mb;
      MEUBLES.pour(r, W, H).forEach(function(p){
        /* un poché ou un vide se remplit ; le reste est un trait, fin par défaut */
        var k = p.k || "", plein = /\b(poche|vide)\b/.test(k);
        k = plein || /^esc/.test(k) ? k : "mb " + k + (/\bw-/.test(k) ? "" : " w-vu");
        if(p.t === "r"){
          if(p.w <= 0 || p.h <= 0) return;
          dest.push('<polygon class="' + k + '" points="' + pts(f, rectF(f, frame, x0, u0 + p.u, v0 + p.v, p.w, p.h)) + '"/>');
        } else if(p.t === "c" || p.t === "e"){
          var c = P.apply(null, [f].concat(fr(f, frame, x0, u0 + p.u, v0 + p.v)));
          if(p.t === "c") dest.push('<circle class="' + k + '" cx="' + c[0].toFixed(3) + '" cy="' + c[1].toFixed(3) + '" r="' + p.r + '"/>');
          else dest.push('<ellipse class="' + k + '" cx="0" cy="0" rx="' + p.rx + '" ry="' + p.ry + '" transform="translate(' + c[0].toFixed(3) + ',' + c[1].toFixed(3) + ') rotate(' + angDeg(f) + ')"/>');
        } else if(p.t === "l"){
          var a = P.apply(null, [f].concat(fr(f, frame, x0, u0 + p.u1, v0 + p.v1))), b = P.apply(null, [f].concat(fr(f, frame, x0, u0 + p.u2, v0 + p.v2)));
          dest.push('<line class="' + k + '" x1="' + a[0].toFixed(3) + '" y1="' + a[1].toFixed(3) + '" x2="' + b[0].toFixed(3) + '" y2="' + b[1].toFixed(3) + '"/>');
        } else if(p.t === "p"){
          dest.push('<polyline class="' + k + '" points="' + pts(f, p.pts.map(function(q){ return fr(f, frame, x0, u0 + q[0], v0 + q[1]); })) + '"/>');
        } else if(p.t === "x"){
          var q = P.apply(null, [f].concat(fr(f, frame, x0, u0 + p.u, v0 + p.v)));
          dest.push('<text class="' + p.k + '" font-size="' + p.h + '" text-anchor="middle" transform="translate(' + q[0].toFixed(3) + ',' + q[1].toFixed(3) + ') rotate(' + angDeg(f) + ')" y="' + (p.h * 0.35).toFixed(2) + '">' + esc(p.s) + '</text>');
        }
      });
    }
    function etiquette(f, frame, x0, u0, v0, W, H, txt, a, petit){
      var nom = String(txt || "").replace(/ \/ .*$/, "");
      var vert = W < 2.2 && H > W * 1.4;
      var len = vert ? H : W;
      /* le nom et la surface tiennent dans la pièce, sur ses deux côtés */
      var fs = Math.min(petit ? 0.45 : Math.max(0.62, Math.min(1.5, Math.sqrt(a) * 0.055)), (len * 0.88) / Math.max(4, nom.length * 0.56), (vert ? W : H) * 0.4);
      var c = P.apply(null, [f].concat(fr(f, frame, x0, u0 + W / 2, v0 + H / 2)));
      var ang = angDeg(f) + (vert ? -90 : 0);
      var aire = fmt(a) + " m²";
      if(fs < 0.24){
        var fa = Math.min(0.42, (len * 0.85) / (aire.length * 0.6), (vert ? W : H) * 0.7);
        if(fa < 0.18) return;
        out.lab.push('<text class="lab" text-anchor="middle" transform="translate(' + c[0].toFixed(2) + ',' + c[1].toFixed(2) + ') rotate(' + ang + ')"><tspan class="m2" font-size="' + fa.toFixed(2) + '" y="' + (fa * 0.35).toFixed(2) + '">' + aire + '</tspan></text>');
        return;
      }
      out.lab.push('<text class="lab" text-anchor="middle" transform="translate(' + c[0].toFixed(2) + ',' + c[1].toFixed(2) + ') rotate(' + ang + ')">' +
        '<tspan x="0" y="' + (-fs * 0.15).toFixed(2) + '" font-size="' + fs.toFixed(2) + '">' + esc(nom) + '</tspan>' +
        '<tspan class="m2" x="0" y="' + (fs * 1.05).toFixed(2) + '" font-size="' + (fs * 0.82).toFixed(2) + '">' + aire + '</tspan></text>');
    }

    /* LA COTATION, en centimètres, toujours hors du dessin. Sur une façade
       libre, trois chaînes : les percements, puis les murs et les cloisons qui
       la touchent, puis le hors-tout ; sur un pignon libre, deux : les murs,
       les bandes et le couloir, puis le hors-tout. Une ligne d'attache ne
       touche jamais le dessin : le blanc `cotes.ecart` l'en sépare. */
    var CO = PG.PLAN.cotes;
    function ligne(dest, f, a, b, cls){
      var p = P(f, a[0], a[1]), q = P(f, b[0], b[1]);
      dest.push('<line class="' + cls + '" x1="' + p[0].toFixed(3) + '" y1="' + p[1].toFixed(3) + '" x2="' + q[0].toFixed(3) + '" y2="' + q[1].toFixed(3) + '"/>');
    }
    function lisible(d){ while(d > 90) d -= 180; while(d <= -90) d += 180; return d; }
    function chaine(f, vert, pos, c, face){
      var Q = function(s, t){ return vert ? [t, s] : [s, t]; };
      pos = pos.slice().sort(function(p, q){ return p - q; }).filter(function(x, k, A){ return !k || x - A[k - 1] > 0.02; });
      if(pos.length < 2) return;
      var dir = c > face ? 1 : -1, ang = lisible(angDeg(f) - (vert ? 90 : 0)), vis = false;
      ligne(out.dim, f, Q(pos[0] - 0.3, c), Q(pos[pos.length - 1] + 0.3, c), "dim w-cote");
      pos.forEach(function(x, k){
        ligne(out.dim, f, Q(x, face + dir * CO.ecart), Q(x, c + dir * 0.25), "dim w-cote");
        ligne(out.dim, f, Q(x - 0.18, c - 0.18), Q(x + 0.18, c + 0.18), "dim w-vu");
        if(!k) return;
        /* une cote étroite : son texte se resserre, puis passe de l'autre côté
           de la ligne une fois sur deux, pour ne pas chevaucher sa voisine */
        var txt = String(Math.round((x - pos[k - 1]) * 100)), seg = x - pos[k - 1];
        var fs = Math.max(CO.texte * 0.6, Math.min(CO.texte, seg / (txt.length * 0.62))), serre = fs * txt.length * 0.62 > seg;
        var cote = serre && (vis = !vis) ? -1 : 1;
        var t = P.apply(null, [f].concat(Q((pos[k - 1] + x) / 2, c + cote * dir * (0.12 + fs * 0.5))));
        out.dim.push('<text class="dimt" font-size="' + fs.toFixed(2) + '" text-anchor="middle" y="' + (fs * 0.35).toFixed(2) + '" transform="translate(' + t[0].toFixed(3) + ',' + t[1].toFixed(3) + ') rotate(' + ang + ')">' + txt + '</text>');
      });
    }
    res.F.forEach(function(f){
      var L = f.L, D = f.D, m = PG.MUR, c0 = D / 2 + m + CO.premier, g0 = L / 2 + m + CO.premier;
      /* le côté libre : aucune chaîne ne passe sur un corps voisin */
      var sg = [-1, 1].filter(function(s){ return [-L / 4, 0, L / 4].every(function(x){ return !dansAutre(f, x, s * c0); }); })[0];
      var sx = [1, -1].filter(function(s){ return [-D / 4, 0, D / 4].every(function(y){ return !dansAutre(f, s * g0, y); }); })[0];
      if(sg){
        var face = sg * (D / 2 + m), X0 = -L / 2 - m, X1 = L / 2 + m, ouv = [X0, X1], mur = [X0, -L / 2, L / 2, X1];
        f.ouvs[sg].forEach(function(o){ ouv.push(o[0], o[1]); });
        f.rooms.concat(f.cages.map(function(c){ return { frame:c.bande, x0:c.x0, W:c.W }; })).forEach(function(r){
          if(r.frame !== "full" && (r.frame === "A") !== (sg < 0)) return;
          [r.x0, r.x0 + r.W].forEach(function(x){ if(x > -L / 2 + 0.05 && x < L / 2 - 0.05) mur.push(x); });
        });
        chaine(f, false, ouv, sg * c0, face);
        chaine(f, false, mur, sg * (c0 + CO.pas), face);
        chaine(f, false, [X0, X1], sg * (c0 + 2 * CO.pas), face);
      }
      if(sx){
        var Y0 = -D / 2 - m, Y1 = D / 2 + m, ys = [Y0, -D / 2, D / 2, Y1];
        if(!f.fixe && f.yc1 - f.yc0 > 0.1) ys.push(f.yc0, f.yc1);
        chaine(f, true, ys, sx * g0, sx * (L / 2 + m));
        chaine(f, true, [Y0, Y1], sx * (g0 + CO.pas), sx * (L / 2 + m));
      }
      /* LES AXES, en trait mixte fin : ceux des murs porteurs le long du corps
         (les façades, le couloir), repérés d'une lettre au bout libre */
      if(!f.fixe){
        var ax = [-(D / 2 + m / 2), D / 2 + m / 2];
        if(f.deux) ax.push(f.yc0, f.yc1);
        ax.sort(function(p, q){ return p - q; });
        var xb = -(sx || 1) * (L / 2 + m + 1.2), rb = 0.55;
        ax.forEach(function(y, k){
          ligne(out.axe, f, [-L / 2 - m - 1.2, y], [L / 2 + m + 1.2, y], "axe w-axe");
          /* le repère au bout libre seulement : jamais sur un corps voisin */
          if(dansAutre(f, xb - (sx || 1) * rb, y)) return;
          var b = P(f, xb - (sx || 1) * rb, y);
          out.dim.push('<circle class="bulle w-vu" cx="' + b[0].toFixed(3) + '" cy="' + b[1].toFixed(3) + '" r="' + rb + '"/>' +
            '<text class="dimt" font-size="' + (rb * 1.1).toFixed(2) + '" text-anchor="middle" x="' + b[0].toFixed(3) + '" y="' + (b[1] + rb * 0.38).toFixed(3) + '">' + "ABCDEF"[k] + '</text>');
        });
      }
    });

    /* LES NIVEAUX : un triangle sur le sol de chaque bâtiment, sa cote depuis
       le ±0.00 du rez de l'école — la hauteur de CHAQUE volume (`DATA.regles.alt`) */
    var nivVu = {};
    res.F.forEach(function(f){
      var al = altDe(f);
      if(!al) return;
      var cle = (f.v.bat || f.v.id) + "|" + al.z;
      if(nivVu[cle]) return;
      nivVu[cle] = 1;
      var x = f.fixe ? -f.L / 2 + 2.5 : (f.zl != null ? f.zl : -f.L / 2) + 2.2, y = f.fixe ? -f.D / 2 + 1.6 : (f.yc0 + f.yc1) / 2;
      var a = P(f, x, y), s3 = 0.45, z = al.z;
      var txt = Math.abs(z) < 0.005 ? "±0.00" : (z > 0 ? "+" : "−") + Math.abs(z).toFixed(2);
      out.niv.push('<polygon class="niv" points="' + a[0] + ',' + a[1] + ' ' + (a[0] - s3 * 0.6) + ',' + (a[1] - s3) + ' ' + (a[0] + s3 * 0.6) + ',' + (a[1] - s3) + '"/>' +
        '<line class="nivl w-vu" x1="' + (a[0] - s3) + '" y1="' + a[1] + '" x2="' + (a[0] + s3 * 5) + '" y2="' + a[1] + '"/>' +
        '<text class="nivt" font-size="' + CO.texte + '" x="' + (a[0] + s3 * 0.9) + '" y="' + (a[1] - 0.15) + '">' + txt + '</text>');
    });

    /* AU-DESSUS DE LA COUPE : l'étage du dessus, là où il déborde de celui-ci
       (un porte-à-faux), en tirets fins — son nu extérieur */
    res.F.forEach(function(f){
      var e = f.e, m = PG.MUR;
      f.v.lv.forEach(function(e2){
        if(!DATA.floors[e2.i] || DATA.floors[e2.i].lvl !== cur + 1) return;
        var dx = (e2.dx || 0) - (e.dx || 0), dy = (e2.dy || 0) - (e.dy || 0);
        if(dx - e2.w / 2 >= -e.w / 2 - 0.05 && dx + e2.w / 2 <= e.w / 2 + 0.05 && dy - e2.d / 2 >= -e.d / 2 - 0.05 && dy + e2.d / 2 <= e.d / 2 + 0.05) return;
        out.dessus.push('<polygon class="dessus w-dessus" points="' + pts(f, rectL(f, dx - e2.w / 2 - m, dy - e2.d / 2 - m, dx + e2.w / 2 + m, dy + e2.d / 2 + m)) + '"/>');
      });
    });

    /* nord et échelle graphique ; l'échelle du dessin à l'écran se lit à côté,
       et dans la cartouche (`applique`) */
    if(isFinite(bounds[0])){
      var bx = bounds[0], by = bounds[3] + 8;
      var sc = '<g class="dimg echelle">';
      [0, 5, 10, 20].forEach(function(d, k, arr){
        if(k < arr.length - 1) sc += '<rect x="' + (bx + d) + '" y="' + by + '" width="' + (arr[k + 1] - d) + '" height="0.6" fill="' + (k % 2 ? "var(--paper)" : "var(--ink)") + '" stroke="var(--ink)" stroke-width="0.08"/>';
        sc += '<text class="dimt" font-size="1.1" x="' + (bx + d) + '" y="' + (by + 2.1) + '" text-anchor="middle">' + d + '</text>';
      });
      sc += '<text class="dimt" font-size="1.1" x="' + (bx + 21.5) + '" y="' + (by + 0.7) + '">m</text></g>' +
            '<text class="dimt ecran" id="ech-t" font-size="1.1" x="' + bx + '" y="' + (by - 0.8) + '"></text>';
      var nx = bounds[2] + 4, ny = bounds[1] + 2;
      sc += '<g class="nordg"><polygon class="nord" points="' + nx + ',' + ny + ' ' + (nx - 1.3) + ',' + (ny + 4) + ' ' + nx + ',' + (ny + 3) + ' ' + (nx + 1.3) + ',' + (ny + 4) + '"/>' +
            '<text class="lab" font-size="1.4" x="' + nx + '" y="' + (ny - 0.6) + '" text-anchor="middle">N</text></g>';
      out.dim.push(sc);
    }

    vue.innerHTML =
      '<g class="siteg">' + out.site.join("") + '</g>' + out.ombre.join("") +
      '<g class="dimg">' + out.axe.join("") + '</g>' +
      out.fond.join("") + out.sol.join("") + out.rooms.join("") + out.part.join("") + out.ouv.join("") + out.esc.join("") + out.dessus.join("") +
      '<g class="mbg">' + out.mb.join("") + '</g>' + out.lab.join("") + out.niv.join("") + '<g class="dimg">' + out.dim.join("") + '</g>';
    classes();

    /* la barre, le titre, le tableau, puis le rail */
    Array.prototype.forEach.call(seg.children, function(b, i){ b.setAttribute("aria-pressed", i === st.niv ? "true" : "false"); });
    var P0 = DATA.partis[st.parti];
    $("titre").textContent = "Plan · " + fl.name;
    $("sous").textContent = res.F.length + " corps · h " + fmt(fl.h, 2) + " m";
    seedIn.value = seedTxt();
    $("cartouche").innerHTML = '<div>Projet</div><div>Centre scolaire de Saxon</div><div>Étape</div><div>05 Typologies</div>' +
      '<div>Parti</div><div>' + esc(P0.n) + '</div><div>Niveau</div><div>' + esc(fl.name) + ' · h ' + fmt(fl.h, 2) + ' m</div>' +
      '<div>Échelle</div><div id="c-ech"></div><div>Coupe</div><div>à ' + fmt(PG.PLAN.coupe, 2) + ' m du sol</div>' +
      '<div>Seed</div><div>' + seedTxt() + '</div>';

    var demande = 0, posé = 0, rows = [];
    fl.rooms.forEach(function(r){
      var d = r.q * r.u, p = pose[r.key] || 0, horsVol = r.hors && !p;
      if(!horsVol){ demande += d; posé += Math.min(p, d); }
      var etat = horsVol ? '<span class="st-hors">hors volume</span>' :
        Math.abs(d - p) < 0.5 ? '<span class="st-ok">posé</span>' : '<span class="st-warn">manque ' + fmt(d - p) + ' m²</span>';
      rows.push('<tr><td><span class="dot" style="background:var(--f-' + r.f + ')"></span>' + esc(r.n) + '</td><td class="n">' + r.q + '</td><td class="n">' + fmt(d) + '</td><td class="n">' + (horsVol ? "—" : fmt(p)) + '</td><td>' + etat + '</td></tr>');
    });
    $("tab").querySelector("tbody").innerHTML = rows.join("");
    var mix = fl.circ ? fl.circ.couloir + fl.circ.cages : 0;
    var taux = demande ? posé / demande : 1, plein = taux > 0.995;
    var bil = '<div class="typo-bil">' +
      '<span>Programme demandé</span><span class="v">' + fmt(demande, 0) + ' m²</span>' +
      '<span>Posé dans le plan</span><span class="v">' + fmt(posé, 0) + ' m²</span>' +
      '<span class="sep"></span>' +
      '<span>Circulation : couloirs et paliers</span><span class="v">' + fmt(circDessinee, 0) + ' m²</span>' +
      '<span>Noyaux (escalier + ascenseur)</span><span class="v">' + fmt(cagesA, 0) + ' m²</span>' +
      '<span>Circulation estimée au mixer</span><span class="v">' + fmt(mix, 0) + ' m²</span></div>';
    if(res.non.length) bil += '<p class="mass-sous">Ne tient pas dans le volume</p><ul class="typo-non">' +
      res.non.map(function(u){ return '<li><span>' + esc(u.lab) + '</span><span>' + fmt(u.a) + ' m²</span></li>'; }).join("") + '</ul>' +
      '<p class="mass-note">Les volumes gardent les cotes du Massing : l\u2019agrandir là-bas, ou alléger le niveau au Programme mixer.</p>';
    var C = controle(), E = evaluation(), ol = $("etapes");
    ol.innerHTML = "";
    ol.appendChild(etape("bilan", 1, "Bilan du niveau", fl.name, puce(fmt(100 * taux, 0) + " %", plein ? "ok" : "warn", "Part du programme du niveau posée dans le plan"), bil, !plein));
    ol.appendChild(etape("eval", 2, "Évaluation", E ? fmt(100 * E.couv, 0) + " % du poids lu" : "aucune composition",
      E && E.total != null ? '<b class="mass-etape__note mono' + (E.invalide ? " is-bas" : "") + '" title="Moyenne géométrique des axes, pondérée — le bâtiment entier, plans compris">' + E.total + '/100</b>' : "",
      evaluationHtml(E), false));
    ol.appendChild(etape("ctl", 3, "Contrôle", "toute la pile",
      (C.bad ? puce(C.bad + " à revoir", "warn") : "") + puce(C.ok + " ok", "ok"), '<ul class="typo-ctl">' + C.html + '</ul>', C.bad > 0));
    ol.appendChild(etape("fam", 4, "Familles", "les lavis du plan", "", LEGENDE, false));
    if(recadrer || !vb) cadrer(); else echelle();
  }

  /* ---------- l'évaluation : ce que vaut le bâtiment, plans compris ----------
     La note du jury pour le bâtiment entier à cette seed, la part Typologie, et
     chaque critère que le plan mesure. Le projet la calcule
     (`views/render.js — typoEvaluation()`) : la même que le Massing et les
     variantes. Un Shuffle typologie la refait. */
  var EV = null;
  function evaluation(){
    if(EV === null) EV = parent.typoEvaluation ? parent.typoEvaluation() : undefined;
    return EV;
  }
  function jauge(s){
    return '<span class="mass-axe__b"><i style="inline-size:' + (s == null ? 0 : Math.round(100 * s)) + '%"></i></span>' +
      '<span class="mass-axe__s mono">' + (s == null ? "—" : Math.round(100 * s) + " %") + '</span>';
  }
  function evaluationHtml(E){
    if(!E) return '<p class="mass-note">Aucune composition posée.</p>';
    var h = '<div class="mass-axe" title="La moyenne, au poids de chacun, des critères que le plan mesure : pour un même volume, la bonne et la mauvaise typologie.">' +
      '<span class="mass-axe__n"><b>Typologie</b></span>' + jauge(E.typo) + '</div>';
    E.crit.forEach(function(c){
      h += '<div class="mass-axe" title="' + esc(c.n) + ' — ' + esc(c.val) + '"><span class="mass-axe__n">' + esc(c.n) +
        '<small class="mono typo-mes">' + esc(c.val) + '</small></span>' + jauge(c.s) + '</div>';
    });
    return h + '<p class="mass-note">Les critères que le plan mesure, notés par le jury ; la note générale lit aussi le programme et la volumétrie. Poids et seuils : Paramètres &amp; contraintes, rubrique Évaluation.</p>';
  }

  /* ---------- le contrôle : toute la pile, pas seulement le niveau montré ---------- */
  var CTL = null;
  function controle(){
    if(CTL) return CTL;
    /* les NOMBRES viennent du projet (`typo/mesures.js — lirePlans()`), le même
       relevé que le jugement : la page n'en écrit que les phrases */
    var R = parent.typoLecture(DATA), tous = R.tous, L = [], F0 = PG.FEU;
    function niv(i){ return DATA.floors[i].name; }
    var nOk = 0, nBad = 0;
    function dit(ok, t, d){ if(ok) nOk++; else nBad++; L.push('<li>' + puce(ok ? "ok" : "à revoir", ok ? "ok" : "warn") + '<span>' + t + '</span>' + (d ? '<small>' + d + '</small>' : "") + '</li>'); }
    /* le programme */
    var nm = R.nm, am = R.am, ou = R.non.map(function(x){ return niv(x.i).toLowerCase() + " " + fmt(x.a, 0) + " m²"; });
    dit(!nm, nm ? nm + " pièce" + (nm > 1 ? "s" : "") + " non posée" + (nm > 1 ? "s" : "") + " — " + fmt(am, 0) + " m²"
                : "Tout le programme est posé, à surface exacte",
        nm ? "Il manque du plateau : " + ou.join(", ") + ". Le couloir et les noyaux prennent leur place ; agrandir le volume au Massing ou alléger le niveau au Programme mixer."
           : "Une pièce change de proportions, jamais de surface.");
    /* les noyaux : présents, empilés, aux mêmes cotes */
    var acces = R.acces.map(function(x){ return x.nom + " au " + niv(x.i).toLowerCase(); }), empile = R.empile,
        feu = R.feu.map(function(x){ return "bâtiment " + x.g + " au " + niv(x.i).toLowerCase(); }),
        fuite = R.fuite, fuiteMax = R.fuiteMax;
    dit(!acces.length, acces.length ? "Niveaux sans noyau : " + acces.join(", ")
        : "Chaque niveau est desservi par un noyau escalier + ascenseur",
