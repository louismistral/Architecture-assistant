<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saxon — programme et répartition</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/appbar.css">
<link rel="stylesheet" href="styles/controls.css">
<link rel="stylesheet" href="styles/program.css">
<link rel="stylesheet" href="styles/schema.css">
<link rel="stylesheet" href="styles/mixer.css">
</head>
<body>
<a class="skip" href="#panels">Aller au contenu</a>

<!-- Chrome permanent : trois zones et rien d'autre. Tout le contenu éditorial
     (chapô, chiffre-clé, surfaces à préciser, légende, sources) est descendu
     dans l'onglet Programme, qui est le seul qu'il décrive. Il occupait
     auparavant ~900 px en tête de TOUS les onglets, soit la totalité d'un
     écran de portable : cliquer « Plan » ne montrait pas un pixel de plan. -->
<header class="appbar">
  <a class="appbar__brand" href="#programme">
    <b>Centre scolaire de Saxon</b>
    <span>Concours de projet · Saxon (VS)</span>
  </a>

  <p class="appbar__fig">
    <!-- Le total vivant. L'ancien chiffre-clé affichait 6'489 m², la part
         chiffrée au règlement — pas le total, qui est 7'025 m² et
         n'apparaissait qu'en fin de note, en petit. -->
    <span class="mono" id="barTot"></span>
    <button type="button" class="appbar__est" id="barEst"></button>
  </p>

  <nav class="btn-group appbar__tabs" id="tabs" role="tablist" aria-label="Vues">
    <button class="btn" type="button" id="tabProgramme" role="tab"
            aria-selected="true" aria-controls="panels">Cahier des charges</button>
    <!-- Le filet est la seule marque qui distingue les deux natures :
         à gauche on lit, à droite on compose. -->
    <button class="btn appbar__split" type="button" id="tabMixer" role="tab"
            aria-selected="false" aria-controls="panels" tabindex="-1">Programme mixer</button>
  </nav>

  <button class="btn btn--icon appbar__theme" type="button" id="themeBtn"
          title="Thème : automatique">
    <span aria-hidden="true" id="themeIcon">◐</span>
    <span class="vh" id="themeLabel">Thème : automatique</span>
  </button>
</header>

<main id="panels" role="tabpanel" aria-labelledby="tabProgramme" tabindex="-1"></main>

<div id="tip" role="status" aria-live="polite"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
