<!doctype html><html lang="fr"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Typologies Saxon</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<!-- Les feuilles du site : la page parle la langue du Massing — son rail en
     chaîne, sa barre de vues, sa carte posée sur le plan —, avec ses tokens. -->
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/controls.css">
<link rel="stylesheet" href="../../styles/massing.css">
<script>
/* Le thème et le mode du site, avant le premier rendu : ses attributs, et la
   feuille du thème s'il en a chargé une. */
try {
  var H0 = parent.document.documentElement, H1 = document.documentElement;
  ["data-theme", "data-mode"].forEach(function(a){ var v = H0.getAttribute(a); if(v) H1.setAttribute(a, v); });
  parent.document.querySelectorAll('link[href*="styles/themes/"]').forEach(function(l){
    var n = document.createElement("link"); n.rel = "stylesheet"; n.href = l.href; document.head.appendChild(n);
  });
} catch(e){}
</script>
<style>
/* Le chrome est celui du Massing (`styles/massing.css`). Ici, le seul DESSIN :
   un rendu de concours — poché noir, cloisons à l'échelle, mobilier au trait
   fin, familles en lavis. Sa palette est à lui, et suit le mode du site. */
:root{
  --paper:#FBFAF7; --paper-2:#F1EFEA; --panel:#FFFFFF; --ink:#1D1F1E; --ink-soft:#5E6662;
  --line:#DAD7D0; --hatch:#B9B5AC; --plan-accent:#2F5D50; --wash:20%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-mode="light"]){
    --paper:#171918; --paper-2:#202322; --panel:#1C1F1E; --ink:#ECEAE4; --ink-soft:#A3A9A5;
    --line:#343836; --hatch:#4A4F4C; --plan-accent:#8CC5B2; --wash:30%;
  }
}
:root[data-mode="dark"]{
  --paper:#171918; --paper-2:#202322; --panel:#1C1F1E; --ink:#ECEAE4; --ink-soft:#A3A9A5;
  --line:#343836; --hatch:#4A4F4C; --plan-accent:#8CC5B2; --wash:30%;
}
body{ padding-inline:var(--s-4); }
.mass-rail{ max-height:calc(100vh - 2 * var(--s-4)); }
/* la planche : le cadre du plan du Massing, la hauteur d'un dessin d'étage */
.stage{ position:relative; height:min(72vh, 780px); min-height:420px; background:var(--paper);
  border:1px solid var(--border); border-radius:var(--radius-md);
  overflow:hidden; touch-action:none; cursor:grab; }
.stage.drag{ cursor:grabbing; }
.stage svg{ width:100%; height:100%; display:block; }
.ptip{ position:absolute; pointer-events:none; background:var(--primary); color:var(--primary-foreground);
  padding:var(--s-2) var(--s-3); border-radius:var(--radius-md); max-width:260px;
  font-size:var(--t-xs); box-shadow:var(--shadow-md); }
.ptip b{ display:block; font-weight:600; }
.ptip span{ font-family:var(--font-mono); font-size:var(--t-2xs); opacity:.85; }
.cartouche{ position:absolute; right:var(--s-3); bottom:var(--s-3); background:var(--panel);
  border:1px solid var(--ink); font-size:var(--t-3xs); display:grid; grid-template-columns:auto auto; pointer-events:none; }
.cartouche div{ padding:3px var(--s-2); border-bottom:1px solid var(--line); }
.cartouche div:nth-child(odd){ color:var(--ink-soft); border-right:1px solid var(--line); }
.cartouche div:nth-last-child(-n+2){ border-bottom:0; }
@media (max-width:560px){ .cartouche{ display:none; } }
/* la carte de la pièce choisie descend du coin bas-gauche : la cartouche tient le bas-droit */
.mass-carte input{ inline-size:6em; min-block-size:var(--ctl-h); padding:0 var(--s-2); font:inherit; font-size:var(--t-xs);
  color:var(--foreground); background:var(--card); border:1px solid var(--input); border-radius:var(--radius-md); text-align:right; }
/* le bilan du niveau, le contrôle, la légende */
.typo-bil{ display:grid; grid-template-columns:1fr auto; gap:2px var(--s-3); font-size:var(--t-2xs); color:var(--soft-foreground); }
.typo-bil .v{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; text-align:right; color:var(--foreground); }
.typo-bil .sep{ grid-column:1/-1; border-top:1px solid var(--border-soft); margin:2px 0; }
.typo-non{ margin:0; padding:0; list-style:none; font-size:var(--t-2xs); display:flex; flex-direction:column; gap:2px; }
.typo-non li{ display:flex; justify-content:space-between; gap:var(--s-2); color:var(--soft-foreground); }
.typo-non li span:last-child{ font-family:var(--font-mono); color:var(--warn); }
.typo-ctl{ margin:0; padding:0; list-style:none; font-size:var(--t-2xs); display:flex; flex-direction:column; gap:var(--s-2); }
.typo-ctl li{ display:grid; grid-template-columns:auto 1fr; gap:var(--s-2); align-items:start; color:var(--soft-foreground); }
.typo-ctl li .chip{ margin-top:2px; }
.typo-ctl li small{ grid-column:2; color:var(--muted-foreground); font-size:var(--t-3xs); line-height:var(--lh-base); }
.typo-legend{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s-1) var(--s-3); font-size:var(--t-2xs); color:var(--soft-foreground); }
.typo-legend i{ display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:var(--s-2); vertical-align:-1px; border:1px solid var(--muted-foreground); }
/* les postes du niveau, sous la planche */
.typo-tab{ overflow-x:auto; }
.typo-tab table{ border-collapse:collapse; width:100%; min-width:540px; font-size:var(--t-xs); }
.typo-tab th, .typo-tab td{ text-align:left; padding:var(--s-1) var(--s-2); border-bottom:1px solid var(--border-soft); }
.typo-tab th{ font-size:var(--t-3xs); text-transform:uppercase; letter-spacing:var(--track-caps); color:var(--muted-foreground); font-weight:600; border-bottom-color:var(--border); }
.typo-tab td.n{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; text-align:right; }
.typo-tab th.n{ text-align:right; }
.typo-tab td .dot{ display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:var(--s-2); }
.st-ok{ color:var(--ok); } .st-warn{ color:var(--warn); } .st-hors{ color:var(--muted-foreground); }
/* ---- le dessin ----
   Les ÉPAISSEURS ne sont pas ici : elles suivent la hiérarchie des traits
   (`TRAITS`, `data/planches.js`), posée en classes `w-*` au chargement — la
   même table que les planches du Rendu. Ici, les couleurs et les remplissages. */
.mur,.poche{fill:var(--ink);stroke:none}
.circ{fill:var(--paper-2)}
/* une cloison est le trait de sa pièce, à son épaisseur réelle (`--cloison`, en m) */
.room,.cell,.cagef,.part{stroke:var(--ink);stroke-width:var(--cloison)}
.fam-cla{fill:color-mix(in oklab,var(--f-cla) var(--wash),var(--paper))}
.fam-adm{fill:color-mix(in oklab,var(--f-adm) var(--wash),var(--paper))}
.fam-eau{fill:color-mix(in oklab,var(--f-eau) var(--wash),var(--paper))}
.fam-tec{fill:color-mix(in oklab,var(--f-tec) var(--wash),var(--paper))}
.fam-spo{fill:color-mix(in oklab,var(--f-spo) var(--wash),var(--paper))}
.fam-uap{fill:color-mix(in oklab,var(--f-uap) var(--wash),var(--paper))}
.fam-pis{fill:color-mix(in oklab,var(--f-pis) var(--wash),var(--paper))}
.fam-ext{fill:color-mix(in oklab,var(--f-ext) var(--wash),var(--paper))}
.mono .room,.mono .cell{fill:var(--paper)}
.room:hover,.cell:hover{fill:color-mix(in oklab,var(--plan-accent) 22%,var(--paper))}
.cagef{fill:var(--paper)}
.part{fill:none}
/* on coupe dans les murs : ils sont pochés, plein — 40 cm dehors, 10 cm dedans ;
   un percement est un vide dans le poché */
.gap,.vide{fill:var(--paper-2);stroke:none}
.gapw{fill:var(--paper);stroke:none}
.porte,.arc,.vitre,.allege,.dessus,.axe,.mb,.esc,.nivl{fill:none;stroke:var(--ink)}
.axe{stroke:var(--ink-soft)}
.mb.eq{fill:color-mix(in oklab,var(--ink) 7%,transparent)}
.mb.tab{fill:var(--ink)}
.mb.pmr{stroke-dasharray:3 2;stroke:var(--ink-soft)}
.mb.pat{stroke-dasharray:1.5 1.5}
.mb.rid{stroke-dasharray:6 3;stroke:var(--ink-soft)}
.mb.tapis{fill:color-mix(in oklab,var(--f-uap) 18%,transparent);stroke:var(--ink-soft)}
.mb.terrain{stroke:var(--f-spo)}
.mb.bassin{fill:color-mix(in oklab,var(--f-pis) 30%,transparent)}
.mb.ligne{stroke:var(--f-pis);stroke-dasharray:4 3}
.mb.asc{fill:color-mix(in oklab,var(--ink) 10%,transparent)}
.esc.point,.niv{fill:var(--ink)}
.esc.fleche{marker-end:url(#fl)}
.esct,.nivt{font-family:var(--font-mono);fill:var(--ink);pointer-events:none}
.esct{font-weight:600}
.site{fill:none;stroke:var(--ink-soft)}
.exist{fill:var(--hatch);stroke:var(--ink-soft)}
.ombre{fill:none;stroke:var(--ink-soft)}
.lab{font-family:var(--font-sans);fill:var(--ink);font-weight:600;pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-width:.14;stroke-linejoin:round}
.lab .m2{font-family:var(--font-mono);font-weight:400;fill:var(--ink-soft)}
.dim{stroke:var(--ink-soft);fill:none}
.dimt{font-family:var(--font-mono);fill:var(--ink-soft);pointer-events:none}
.bulle{fill:var(--paper);stroke:var(--ink-soft)}
.entree{fill:var(--plan-accent)}
.nord{fill:var(--ink)}
.hideF .mbg{display:none}
.hideD .dimg{display:none}
.hideS .siteg{display:none}
@media (prefers-reduced-motion:no-preference){.stage svg g.vue{transition:opacity .2s}}
</style></head><body>

<section class="mass">
<div class="mass-grid">
  <!-- Le rail, en chaîne comme celui du Massing : ce qui PROPOSE en tête,
       toujours visible ; puis les étapes, chacune repliable et portant son état ;
       Emporter au pied. -->
  <aside class="mass-rail" aria-label="Commandes des typologies">
    <section class="mass-prop">
      <h2 class="mass-prop__h">Proposer</h2>
      <button class="btn btn--primary mass-tir" type="button" id="shuffle"
              title="Réordonne les pièces : l'ordre des familles, celui des postes, le bout du noyau. Les volumes, leurs cotes et la répartition ne bougent pas.">
        <span id="ic-shuffle"></span>
        <span class="mass-tir__t"><b>Shuffle typologie</b><span>autre plan, mêmes volumes</span></span>
      </button>
      <div class="mass-nav">
        <span class="mass-nav__r" id="cadre-l"></span>
        <div class="mass-seed">
          <span class="segcap">Seed</span>
          <input type="text" id="seed" class="mono" size="7" spellcheck="false" autocomplete="off"
                 aria-label="Seed du tirage typologie — retape-la pour rejouer le même plan"
                 title="Retape une seed et rejoue le plan à l'identique, dans les mêmes volumes">
        </div>
      </div>
    </section>
    <ol class="mass-etapes" id="etapes"></ol>
    <section class="mass-emporter" aria-label="Emporter">
      <button class="btn" type="button" id="copy">Copier le SVG</button>
    </section>
  </aside>

  <div class="mass-main">
    <!-- Ce qu'on REGARDE : le niveau, les couleurs, ce qui se dessine, le cadrage. -->
    <div class="mass-barre" role="toolbar" aria-label="Affichage du plan">
      <div class="mass-barre__et"><span class="mass-barre__l">Niveau</span><div class="btn-group" id="niv" role="group" aria-label="Niveau montré"></div></div>
      <div class="btn-group" id="couleurs" role="group" aria-label="Couleurs"></div>
      <div class="btn-group" id="montre" role="group" aria-label="Ce qui se dessine"></div>
      <span class="spacer"></span>
      <div class="btn-group" role="group" aria-label="Cadrage">
        <button class="btn btn--icon" type="button" id="z-out" aria-label="Dézoomer" title="Dézoomer">−</button>
        <button class="btn btn--icon" type="button" id="z-in" aria-label="Zoomer" title="Zoomer">+</button>
        <button class="btn" type="button" id="z-fit">Cadrer</button>
      </div>
    </div>
    <div class="mass-vue">
      <div class="mass-vue__h"><h3 class="label" id="titre">Plan</h3><span class="spacer"></span><span class="mass-cam mono" id="sous"></span></div>
      <div class="mass-vue__cadre">
        <div class="stage" id="stage">
          <svg id="svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Plan d'étage">
            <defs>
              <pattern id="hach" width="0.8" height="0.8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                <rect width="0.8" height="0.8" fill="var(--paper)"/>
                <line x1="0" y1="0" x2="0" y2="0.8" stroke="var(--hatch)" stroke-width="0.12"/>
              </pattern>
              <marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <g id="vue" class="vue"></g>
          </svg>
          <div class="ptip" id="ptip" hidden></div>
          <div class="cartouche" id="cartouche"></div>
        </div>
        <div class="mass-carte" id="carte" hidden></div>
      </div>
    </div>
    <div class="mass-vue">
      <div class="mass-vue__h"><h3 class="label">Postes du niveau</h3></div>
      <div class="typo-tab">
        <table id="tab">
          <thead><tr><th>Poste</th><th class="n">Nb</th><th class="n">Demandé m²</th><th class="n">Dessiné m²</th><th>État</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</section>

<script>
/* Les données vivent dans le projet : l'onglet Typologies les donne à
   l'ouverture (`src/typo/donnees.js`). Ouverte seule, la page n'a rien à dessiner. */
var DATA = null;
try { DATA = parent !== window && parent.typoDonnees ? parent.typoDonnees() : null; } catch(e){}
/* LA HIÉRARCHIE DES TRAITS : `TRAITS` (mm, `data/planches.js`) en px d'écran, à
   96 px par pouce — le plan se lit à l'écran comme imprimé à 100 %, quel que
   soit le zoom (« non-scaling »). Une classe `w-*` par rang. */
(function(){
  var R = DATA && DATA.regles;
  if(!R || !R.traits) return;
  var T = R.traits, px = 96 / 25.4, css = ":root{--cloison:" + R.cloison + "}";
  function m(a){ return a.map(function(v){ return (v * px).toFixed(2); }).join(" "); }
  ["coupe", "menuiserie", "vu", "dessus", "axe", "cote"].forEach(function(k){
    css += ".w-" + k + "{stroke-width:" + (T[k] * px).toFixed(2) + "px;vector-effect:non-scaling-stroke}";
  });
  css += ".w-dessus{stroke-dasharray:" + m(T.tirets) + "}.w-axe{stroke-dasharray:" + m(T.mixte) + "}";
  var el = document.createElement("style"); el.textContent = css; document.head.appendChild(el);
})();
</script>
<script>
/* ===== Générateur de plans : lit la pile du mixer et les volumes du massing =====
   Règles tenues :
   - une surface de programme ne change pas : largeur = surface ÷ profondeur de bande ;
   - chaque corps garde les cotes que le Massing lui a données : le plan se
     dessine DEDANS, et ce qui n'y tient pas est dit non posé — jamais le
     volume ne s'allonge ;
   - la seed (`DATA.graine`) ne change que l'ordonnance : l'ordre des
     familles, celui des postes dans une famille, le bout du noyau ;
   - le couloir se place là où les deux bandes finissent ensemble ;
   - un noyau escalier + ascenseur par bâtiment et par niveau, aux mêmes cotes
     et au même endroit à tous les niveaux ;
   - un couloir finit toujours sur quelque chose : un noyau, un hall, un passage
     vers le corps voisin, ou la porte de la pièce qui le ferme ;
   - les pièces d'une famille se suivent ; une largeur de pièce se règle au
     module de 0,50 m, sa profondeur suit. */
var PG = (function(){
  /* les règles du projet, données par l'onglet (`typo/donnees.js`) */
  var R0 = (typeof DATA !== "undefined" && DATA && DATA.regles) || {};
  var COULOIR = R0.couloir || 2.40, MUR = R0.mur || 0.50, CLOISON = R0.cloison || 0.10,
      CAGE_A = R0.cage || 24, NOY = R0.noyau || { prof:5, volee:1.2, asc:[2.1, 2.4] },
      FEU = R0.feu || { cageSeuil:900, fuiteSimple:35, fuiteDouble:50 },
      LIEN = R0.lien || 15, MODULE = R0.module || 0.5, VIDE = R0.vide, PLAN = R0.plan || {},
      FRONT_MAX = 12.5, PETIT = 30, BMIN = 5.6, PALIER = 1.2, CLASSE = R0.classe;
  /* l'ordre des familles : les pièces d'une famille se posent ensemble */
  var FAMS_O = ["cla", "eau", "uap", "adm", "spo", "tec", "pis", "ext"];
  var WC = 2 * NOY.volee + 0.10 + NOY.asc[0] + CLOISON;     /* largeur du noyau */
  var FL = [];                                               /* les niveaux */
  /* LA SEED : un tirage PUR de la seed et d'un nom — le même à chaque appel, si
     bien que le contrôle, l'écran et le Rendu voient le même plan. */
  var GR = 1;
  function alea(nom){
    var h = (GR ^ 0x9E3779B9) >>> 0;
    for(var i = 0; i < nom.length; i++) h = Math.imul(h ^ nom.charCodeAt(i), 16777619) >>> 0;
    h = Math.imul(h ^ (h >>> 15), 0x2C1B3C6D) >>> 0;
    return ((h ^ (h >>> 12)) >>> 0) / 4294967296;
  }
  var FAMS0 = FAMS_O.slice();

  function chapOf(key){ return key.split("|")[0]; }
  function local(cx, cy, a, x, y){
    var c = Math.cos(a), s = Math.sin(a);
    return [cx + x * c - y * s, cy + x * s + y * c];
  }
  function unites(rooms){
    var out = [];
    rooms.forEach(function(r){
      if(r.hors) return;
      var base = { key:r.key, n:r.n, f:r.f, chap:chapOf(r.key) };
      /* chaque pièce pour elle-même, même un WC de 2 m² : un lien « auprès de
         chaque classe » ne se tient qu'avec des WC répartis */
      for(var k = 0; k < r.q; k++)
        out.push(Object.assign({}, base, { a:r.u, lab:r.n + (r.q > 1 ? " " + (k + 1) : "") }));
    });
    return out;
  }
  function famO(u){ var k = FAMS_O.indexOf(u.f); return k < 0 ? 99 : k; }

  /* UNE PIÈCE, PAS UN COULOIR (`RULES.plan.piece`). Avant, chaque pièce prenait
     toute la profondeur de sa bande : un WC PMR de 3 m² devenait une lame de
     0,48 × 6,20 m. La surface reste fixe ; seule la forme se règle. */
  var PC = PLAN.piece || { ratio:2, ratioGrand:3, grand:100, larg:1.6, cabine:0.9 }, PMR = PLAN.pmr || [1.65, 1.8];
  function ratioDe(a){ return a >= PC.grand ? PC.ratioGrand : PC.ratio; }
  function cabine(u){ return /WC|Toilette/i.test(u.n || "") && !/PMR|individuelle/i.test(u.n || ""); }
  /* les largeurs admises le long de la bande, [min, max] : la profondeur est
     la surface divisée par la largeur */
  function larges(u){
    var a = u.a, R = ratioDe(a), l = cabine(u) ? PC.cabine : PC.larg;
    if(/PMR/.test(u.n || "")) return [PMR[0], Math.max(PMR[0], a / PMR[1])];
    var lo = Math.max(l, Math.sqrt(a / R));
    return [lo, Math.max(lo, Math.min(a / l, Math.sqrt(a * R)))];
  }
  /* la profondeur d'une pièce dans une bande de profondeur H : toute la bande
     si ses proportions le permettent, sinon contre la façade, et le reste
     devant elle — un dégagement sur le couloir. Une classe garde la
     profondeur de la ligne `classe-dim`. */
  function profDe(u, H){
    var p = u.a / larges(u)[0];
    if(CLASSE && /classe/i.test(u.n || "")) p = Math.min(p, CLASSE[1]);
    return Math.min(H, p);
  }
  /* UN BLOC DE PETITES PIÈCES, dans une bande de profondeur H, contre la
     façade. Trois dispositions, on garde la plus étroite :
     - chacune seule, un dégagement devant elle ;
     - en colonnes : plusieurs pièces empilées s'ouvrent sur un sas qui va du
       couloir à la façade, deux colonnes de part et d'autre ;
     - la plus grande au fond, les autres devant elle, côte à côte, et un sas
       entre elles pour aller à celle du fond.
     Le sas a la largeur de l'aire de rotation s'il dessert un WC PMR (un
     fauteuil y tourne pour entrer), `piece.sas` sinon. Chaque pièce a sa
     porte : sur le couloir, sur le dégagement devant elle, ou sur le sas. */
  function sasDe(L){ return L.some(function(c){ return /PMR/.test(c.n || ""); }) ? (PLAN.rotation || 1.5) : (PC.sas || 1.2); }
  function peigne(cel, H){
    function large(c, d){ return Math.max(larges(c)[0], c.a / d); }
    function poser(suite){
      var out = [], devant = [], u = 0;
      suite.forEach(function(k, j){
        if(k.sas){ u += k.sas; return; }
        var v = H, sas = suite[j + 1] && suite[j + 1].sas ? 1 : suite[j - 1] && suite[j - 1].sas ? -1 : 0;
        /* la plus grande contre la façade, les autres devant elle */
        k.cel.forEach(function(c){ var h = c.a / k.w; v -= h; out.push(Object.assign({}, c, { u0:u, v0:v, W:k.w, H:h, sas:sas })); });
        if(v > 0.05) devant.push({ u0:u, W:k.w, H:v });
        u += k.w;
      });

    bande(best.IS, S, deux ? bS : T, seul ? WC : 0, best.eg, best.ed, rS, seul || !best.eg ? 0 : milieu(best.IS));
    if(deux){
      if(nc) cages.push({ bande:N, x0:0, v0:bN - cH, W:WC, H:cH });
      var rN = lb - long(best.IN, bN, false, false) - n1 * WC;
      bande(best.IN.slice().reverse(), N, bN, nc ? WC : 0, false, false, rN, nc ? 0 : milieu(best.IN));
      if(nc > 1) cages.push({ bande:N, x0:L - WC, v0:bN - cH, W:WC, H:cH });
    } else if(nc){
      /* un seul rang : le noyau au bout de la bande, côté ancre */
      cages.push({ bande:S, x0:0, v0:T - cH, W:WC, H:cH });
      if(nc > 1) cages.push({ bande:S, x0:L - WC, v0:T - cH, W:WC, H:cH });
    }
    var x = lb;
    trav.forEach(function(u){ var W = u.a / D; R.push(Object.assign({}, u, { kind:"trav", frame:"full", x0:x, W:W, H:D })); x += W; });
    full.forEach(function(u){ var W = u.a / D; R.push(Object.assign({}, u, { kind:"full", frame:"full", x0:x, W:W, H:D })); x += W; });
    /* le couloir : d'un bout à l'autre, moins les pièces qui le ferment */
    var zg = 0, zd = L;
    R.forEach(function(r){ if(r.ext < 0) zg = r.x0 + r.W; if(r.ext > 0) zd = r.x0; });
    /* retourner dans le repère de l'étage */
    var s = o.s;
    function plie(x0, W){ return s > 0 ? x0 - L / 2 : L / 2 - x0 - W; }
    R.forEach(function(r){ r.x0 = plie(r.x0, r.W); if(s < 0 && r.ext) r.ext = -r.ext; });
    cages.forEach(function(k){ k.x0 = plie(k.x0, k.W); });
    /* le sol que les rangs laissent libre : le contrôle le mesure */
    f.vide = 0;
    paliers.forEach(function(k){ k.x0 = plie(k.x0, k.W); f.vide += k.W * k.H; });
    f.rooms = R; f.cages = cages; f.paliers = paliers;
    f.zl = s > 0 ? zg - L / 2 : L / 2 - zd; f.zr = s > 0 ? zd - L / 2 : L / 2 - zg;
    return f;
  }

  /* ---------- un niveau ---------- */
  function genNiveau(D0, parti, i){
    FL = D0.floors;
    /* l'ordre des familles, tiré de la seed : il décide quelle famille va à
       quel corps, et dans quel ordre elles se suivent le long du couloir */
    GR = D0.graine || 1;
    FAMS_O = FAMS0.slice().sort(function(p, q){ return alea("fam " + p) - alea("fam " + q); });
    var fl = D0.floors[i], vols = D0.partis[parti].vols;
    var F = [], fixes = [], non = [];
    vols.forEach(function(v){
      v.lv.forEach(function(e){
        if(e.i !== i) return;
        var f = cadre(v, e);
        if(e.keys){ f.fixe = true; fixes.push(f); } else F.push(f);
      });
    });
    fixes.forEach(function(f){
      var rs = fl.rooms.filter(function(r){ return f.e.keys.indexOf(r.key) >= 0; }), a = 0;
      rs.forEach(function(r){ a += r.q * r.u; });
      var r0 = rs[0] || { n:f.v.nom || "Volume", f:"tec", key:"" };
      f.rooms.push({ key:r0.key, n:r0.n, f:r0.f, lab:r0.n, a:a, kind:"fixe", x0:-f.L / 2, W:f.L, H:f.D, frame:"full" });
      f.yc0 = f.yc1 = 0;
    });
    var U = unites(fl.rooms.filter(function(r){
      return !fixes.some(function(f){ return f.e.keys.indexOf(r.key) >= 0; });
    }));
    if(!F.length){ U.forEach(function(u){ non.push(u); }); return { F:fixes, non:non, fl:fl }; }

    /* LA RÉPARTITION entre les corps du niveau : le sport près de la salle,
       l'UAPE loin d'elle, le reste famille par famille, au prorata de ce que
       le Massing a prévu pour chaque corps (son emprise à ce niveau). */
    var hall = null;
    vols.forEach(function(v){ if(v.lv.some(function(e){ return e.keys && e.keys.join().indexOf("sport|") >= 0; })) hall = v; });
    /* au centre du VOLUME, pas de l'étage : l'ordre ne bouge pas quand un corps s'allonge */
    function d(f){ return hall ? Math.hypot(f.v.x - hall.x, f.v.y - hall.y) : 0; }
    /* les corps du plus près au plus loin de la salle de sport ; les pièces :
       celles du sport d'abord, celles de l'UAPE en dernier, le reste famille
       par famille entre les deux */
    F.sort(function(p, q){ return (d(p) - d(q)) || String(p.v.id).localeCompare(String(q.v.id)); });
    var cap = F.map(function(f){ return f.e.w * f.e.d; }), capT = 0, tot = 0;
    cap.forEach(function(x){ capT += x; });
    U.forEach(function(u){ tot += u.a; });
    /* un très grand local (l'abri PC, 3 × 200 places) se compartimente en
       parts de 300 m² au plus : d'un seul bloc, il allait tout entier à un
       corps, et quand il n'y tenait pas il en sortait tout entier — laissant
       vide la place que le Massing lui avait faite */
    U = U.reduce(function(m, u){
      var K = Math.ceil(u.a / 300);
      if(K > 1 && !/^Hall|foyer/i.test(u.n)){
        for(var j = 0; j < K; j++) m.push(Object.assign({}, u, { a:u.a / K, part:1, lab:u.lab + " (" + (j + 1) + "/" + K + ")" }));
      } else m.push(u);
      return m;
    }, []);
    function rang(u){ return !hall ? 1 : u.chap === "sport" ? 0 : u.chap === "uape" ? 2 : 1; }
    /* LES LIENS : une petite pièce en lien avec une grande la suit dans son
       corps — les vestiaires et les WC avec les classes, le local de
       reproduction avec la salle des maîtres. Elles se partagent à tour de
       rôle entre les grandes pièces de leur poste lié. */
    var lie = {};
    (D0.liens || []).forEach(function(l){ (lie[l.a] = lie[l.a] || []).push(l.b); (lie[l.b] = lie[l.b] || []).push(l.a); });
    var grands = U.filter(function(u){ return u.a >= PETIT; });
    function plusGrand(u, g){ return g !== u && g.a > u.a && lie[u.key].indexOf(g.key) >= 0; }
    /* « auprès de chaque » : une petite pièce en plusieurs exemplaires (WC,
       vestiaires) se répartit le long de ses mères ; une pièce unique liée
       entre dans le groupe de ses partenaires */
    var nb = {}; U.forEach(function(u){ nb[u.key] = (nb[u.key] || 0) + 1; });
    var petitsLies = U.filter(function(u){
      return u.a < PETIT && nb[u.key] > 1 && lie[u.key] && U.filter(function(g){ return plusGrand(u, g); }).length > 1;
    });
    petitsLies.forEach(function(u){ u.sat1 = 1; u.tard = 1; });
    /* les grandes pièces liées entre elles voyagent ensemble : composantes du
       graphe des liens, la plus grande pièce en tête (au plus 600 m²) */
    var vu = {}, lies2 = U.filter(function(u){ return !u.tard && lie[u.key]; });
    lies2.slice().sort(function(p, q){ return q.a - p.a; }).forEach(function(g){
      if(vu[g.lab + g.key] || !lie[g.key]) return;
      var groupe = [g], aire = g.a; vu[g.lab + g.key] = 1;
      for(var t = 0; t < groupe.length; t++){
        lies2.forEach(function(h){
          if(vu[h.lab + h.key] || !lie[groupe[t].key] || lie[groupe[t].key].indexOf(h.key) < 0 || aire + h.a > 600) return;
          vu[h.lab + h.key] = 1; groupe.push(h); aire += h.a;
        });
      }
      groupe.slice(1).forEach(function(h){ (g.sat = g.sat || []).push(h); h.sat1 = 1; });
    });
    var reste = U.filter(function(u){ return !u.sat1; }).map(function(u){
      var a = u.a; (u.sat || []).forEach(function(x){ a += x.a; });
      return { u:u, a:a, chap:u.chap, f:u.f };
    }).sort(function(p, q){ return (rang(p) - rang(q)) || (famO(p) - famO(q)) || (q.a - p.a); });
    /* un découpage CONTIGU de la liste (les familles restent ensemble) en
       autant de tranches que de corps, au plus près de la part de chacun —
       programmation dynamique sur les points de coupe */
    var pre = F.map(function(){ return 0; });
    var cum = [0]; reste.forEach(function(u, j){ cum.push(cum[j] + u.a); });
    var n = reste.length, K = F.length, INF = 1e18, cout = [], dd = [];
    for(var q = 0; q <= K; q++){ cout.push(new Array(n + 1).fill(INF)); dd.push(new Array(n + 1).fill(0)); }
    cout[0][0] = 0;
    for(q = 1; q <= K; q++){
      var cible = cap[q - 1] / capT * tot - pre[q - 1];
      for(var j = 0; j <= n; j++){
        for(var t = 0; t <= j; t++){
          if(cout[q - 1][t] >= INF) continue;
          var ec = (cum[j] - cum[t]) - cible, c2 = cout[q - 1][t] + ec * ec;
          if(c2 < cout[q][j]){ cout[q][j] = c2; dd[q][j] = t; }
        }
      }
    }
    var fin2 = n;
    for(q = K; q >= 1; q--){
      var t0 = dd[q][fin2];
      for(var j2 = t0; j2 < fin2; j2++){
        var pu = reste[j2].u;
        F[q - 1].U.push(pu);
        (pu.sat || []).forEach(function(x){ x.prin = pu; F[q - 1].U.push(x); });
      }
      fin2 = t0;
    }

    /* LES PETITES PIÈCES LIÉES, poste par poste : réparties entre les corps au
       prorata de leurs pièces mères, une au moins par corps qui en a, puis
       espacées régulièrement le long d'elles — quatre WC pour douze classes,
       un toutes les trois classes, dans chaque corps */
    var parCle = {};
    petitsLies.forEach(function(u){ (parCle[u.key] = parCle[u.key] || []).push(u); });
    /* les plus grandes d'abord : une petite qui sert de mère à une plus petite
       est déjà dans son corps quand celle-ci cherche le sien */
    Object.keys(parCle).sort(function(p, q){ return parCle[q][0].a - parCle[p][0].a; }).forEach(function(k){
      var L = parCle[k], meres = F.map(function(f){ return f.U.filter(function(g){ return plusGrand(L[0], g); }); });
      var tot2 = 0; meres.forEach(function(m){ tot2 += m.length; });
      if(!tot2){ F[0].U = F[0].U.concat(L); return; }
      var part = meres.map(function(m){ return m.length ? 1 : 0; }), libre = L.length;
      part.forEach(function(x){ libre -= x; });
      if(libre < 0){ part = meres.map(function(){ return 0; }); libre = L.length;
        meres.map(function(m, j){ return j; }).sort(function(p, q){ return meres[q].length - meres[p].length; }).slice(0, L.length).forEach(function(j){ part[j] = 1; libre--; }); }
      /* au plus fort reste : chaque corps à proportion de ses pièces mères */
      var frac = [];
      meres.forEach(function(m, j){ var x = libre * m.length / tot2; part[j] += Math.floor(x); frac.push({ j:j, r:x - Math.floor(x) }); });
      var dist = 0; part.forEach(function(x){ dist += x; });
      frac.sort(function(p, q){ return q.r - p.r; });
      for(var j3 = 0; dist < L.length; j3 = (j3 + 1) % frac.length){ if(meres[frac[j3].j].length){ part[frac[j3].j]++; dist++; } }
      var c0 = 0;
      F.forEach(function(f, j){
        var m = meres[j], mine = L.slice(c0, c0 + part[j]); c0 += part[j];
        mine.forEach(function(u, n){
          if(m.length){ var g = m[Math.min(m.length - 1, Math.floor((n + 0.5) * m.length / mine.length))]; u.prin = g; }
          f.U.push(u);
        });
      });
    });
    /* ce qui est lié à une salle aux cotes imposées (la salle de sport) va au
       bout du corps le plus proche d'elle */
    /* ce qui est lié à une salle aux cotes imposées (la salle de sport) va au
       bout du corps le plus proche d'elle */
    var cles = {};
    fixes.forEach(function(g){ (g.e.keys || []).forEach(function(k){ cles[k] = g; }); });
    U.forEach(function(u){ (lie[u.key] || []).forEach(function(k){ if(cles[k]) u.salle = cles[k]; }); });
    /* chaque corps : son ancre, ses noyaux, ses passages, sa composition */
    F.forEach(function(f){
      var an = ancre(f.v, vols), v = f.v, e = f.e;
      /* le corps garde ses cotes : la profondeur du niveau, et sa longueur,
         mesurée depuis le bout de l'ancre À CE NIVEAU — un retrait ou un
         porte-à-faux reste celui du Massing. Le noyau s'empile là où les
         niveaux le permettent ; le contrôle dit s'il reste desservi. */
      f.dyNew = e.dy || 0;
      var fa = facadeN(v, { d:f.D, dy:f.dyNew }, an.N);
      var nc = an.h && fa.N === an.fac.N && Math.abs(fa.y - an.fac.y) < 0.01 ? an.h.n : 0;
      var deb = (e.dx || 0) - an.s * e.w / 2, fin = deb + an.s * e.w;
      function passe(x, dir){
        var p = local(v.x, v.y, v.a, x + dir * 1.0, (e.dy || 0));
        return F.some(function(g){ return g !== f && g.v.bat && g.v.bat === v.bat && dansCorps({ x:g.v.x, y:g.v.y, a:g.v.a, lv:[g.e] }, p); });
      }
      /* les cotes des pièces, réglées au mixer ou ici : une par poste */
      var reg = {}, cote = {};
      (DATA.floors[i] ? DATA.floors[i].rooms : []).forEach(function(r){ if(r.w) cote[r.key] = r.w; });
      f.U.forEach(function(u){ if(cote[u.key]) reg[u.lab] = cote[u.key]; });
      var sal = f.U.filter(function(u){ return u.salle; })[0], debut = false;
      if(sal){
        var pr = (sal.salle.cx - f.cx) * Math.cos(f.a) + (sal.salle.cy - f.cy) * Math.sin(f.a);
        debut = pr * an.s < 0;
      }
      function comp(){
        composer(f, { s:an.s, N:an.N, noyaux:nc, salleDebut:debut, passG:passe(deb, -an.s), passD:passe(fin, an.s), L0:e.w, regles:reg });
      }
      comp();
      /* CE QUI NE TIENT PAS dans le volume reste au bac du niveau : la pièce
         qui couvre le débord au plus juste, sinon la plus grande, jusqu'à ce
         que le plan tienne. C'est au Massing ou au mixer d'y répondre. */
      while(f.L > e.w + 0.05 && f.U.length){
        /* un hall reste : c'est par lui qu'on entre */
        var ex = (f.L - e.w) * f.D, par = f.U.filter(function(u){ return !/^Hall|foyer/i.test(u.n); });
        par = (par.length ? par : f.U).slice().sort(function(p, q){ return p.a - q.a; });
        var pris = par.filter(function(u){ return u.a >= ex; })[0] || par[par.length - 1];
        f.U.splice(f.U.indexOf(pris), 1);
        non.push(pris);
        comp();
      }
      f.comp = comp;
    });
    /* CE QUI EST SORTI D'UN CORPS va là où il reste de la place, le sien
       compris : sortir une pièce pour un débord de quelques mètres laisse un
       vide, que les plus petites d'entre elles comblent */
    function tient(f, u){ f.U.push(u); f.comp(); if(f.L <= f.e.w + 0.05) return true; f.U.pop(); f.comp(); return false; }
    non.slice().sort(function(p, q){ return q.a - p.a; }).forEach(function(u){
      F.some(function(f){
        if(tient(f, u)){ non.splice(non.indexOf(u), 1); return true; }
        /* un compartiment de l'abri se recoupe : la part qui tient se pose,
           le reste attend au bac — la surface totale ne change pas */
        if(!u.part) return false;
        var lo = 0, hi = u.a;
        for(var t = 0; t < 12; t++){ var x = (lo + hi) / 2; if(tient(f, Object.assign({}, u, { a:x }))){ lo = x; f.U.pop(); } else hi = x; }
        if(lo < PETIT) return false;
        tient(f, Object.assign({}, u, { a:lo })); u.a -= lo;
        return false;
      });
    });
    F.forEach(function(f){
      var an = ancre(f.v, vols), dx = (f.e.dx || 0) - an.s * f.e.w / 2 + an.s * f.L / 2;
      f.dxNew = dx;
      var p = local(f.v.x, f.v.y, f.v.a, dx, f.dyNew); f.cx = p[0]; f.cy = p[1];
    });
    return { F:F.concat(fixes), non:non, fl:fl };
  }

  function oublier(){ HOTES = null; ANC = {}; }

  /* repère d'un local → repère de l'étage : u le long de la bande, v depuis le couloir */
  function versEtage(f, frame, x0, u, v){
    if(frame === "A") return [x0 + u, f.yc0 - v];
    if(frame === "B") return [x0 + u, f.yc1 + v];
    return [x0 + u, -f.D / 2 + v];
  }
  function versMonde(f, x, y){ return local(f.cx, f.cy, f.a, x, y); }

  return { ancre:ancre, genNiveau:genNiveau, oublier:oublier, hotes:hotes,
           local:local, versEtage:versEtage, versMonde:versMonde,
           COULOIR:COULOIR, MUR:MUR, CLOISON:CLOISON, NOY:NOY, FEU:FEU, LIEN:LIEN, MODULE:MODULE,
           PETIT:PETIT, VIDE:VIDE, PLAN:PLAN, ratioDe:ratioDe, cabine:cabine };
})();
if(typeof module !== "undefined") module.exports = PG;

<script>
/* ===== Mobilier et équipements, dans le repère du local =====
   u le long du couloir (0 → W), v du couloir vers la façade (0 → H).
   Chaque fonction rend une liste de primitives : r (rectangle), c (cercle),
   l (ligne), a (arc de porte). Les cotes sont celles d'un mobilier scolaire. */
var MEUBLES = (function(){
  function R(u, v, w, h, k){ return { t:"r", u:u, v:v, w:w, h:h, k:k || "" }; }
  function C(u, v, r, k){ return { t:"c", u:u, v:v, r:r, k:k || "" }; }
  function L(u1, v1, u2, v2, k){ return { t:"l", u1:u1, v1:v1, u2:u2, v2:v2, k:k || "" }; }
  function X(u, v, s, h, k){ return { t:"x", u:u, v:v, s:s, h:h, k:k || "" }; }
  function PL(pts, k){ return { t:"p", pts:pts, k:k || "" }; }
  /* les appareils aux cotes de `RULES.plan.sanitaire`. Un lavabo l × p adossé
     à un mur, (u, v) son coin ; `surU` : sa largeur le long de u. */
  function lavabo(o, u, v, surU){
    var S = PG.PLAN.sanitaire.lavabo, w = surU ? S[0] : S[1], h = surU ? S[1] : S[0];
    o.push(R(u, v, w, h, "eq")); o.push({ t:"e", u:u + w / 2, v:v + h / 2, rx:w * 0.32, ry:h * 0.32, k:"" });
    return o;
  }
  /* une cuvette de WC, l × p tout compris : le réservoir contre le mur, la
     cuvette devant ; (cu, cv) le point du mur sur son axe, `cote` le mur
     ("u+" : celui des u croissants…) */
  function cuvette(o, cu, cv, cote){
    var S = PG.PLAN.sanitaire.wc, l = S[0], p = S[1], r = 0.18, sg = cote[1] === "+" ? -1 : 1, c = r + (p - r) / 2;
    if(cote[0] === "v"){ o.push(R(cu - l / 2, sg > 0 ? cv : cv - r, l, r)); o.push({ t:"e", u:cu, v:cv + sg * c, rx:l * 0.45, ry:(p - r) / 2, k:"eq" }); }
    else { o.push(R(sg > 0 ? cu : cu - r, cv - l / 2, r, l)); o.push({ t:"e", u:cu + sg * c, v:cv, rx:(p - r) / 2, ry:l * 0.45, k:"eq" }); }
    return o;
  }

  function etageres(W, H, out, cotes, p){
    p = p || 0.5;
    if(cotes.indexOf("f") >= 0) out.push(R(0.15, H - p - 0.05, W - 0.3, p));
    if(cotes.indexOf("g") >= 0 && H > 2) out.push(R(0.05, 0.9, p, H - 1.0 - (cotes.indexOf("f") >= 0 ? p : 0)));
    if(cotes.indexOf("d") >= 0 && H > 2) out.push(R(W - p - 0.05, 0.9, p, H - 1.0 - (cotes.indexOf("f") >= 0 ? p : 0)));
    return out;
  }

  /* salle de classe : tableau sur le mur gauche, élèves face à lui, jour de la façade à gauche des élèves */
  function classe(W, H){
    var o = [];
    o.push(R(0.06, H * 0.5 - 2, 0.1, 4, "tab"));                 /* tableau */
    o.push(R(1.0, H * 0.5 - 0.8, 0.7, 1.6));                    /* bureau du maître */
    o.push(R(1.85, H * 0.5 - 0.22, 0.42, 0.44, "ch"));
    lavabo(o, 0.4, 0.06, true);
    if(W > 5) o.push(R(1.3, 0.06, Math.max(0, W - 2.9), 0.45));  /* armoires côté couloir */
    var u = 2.9, n = 0;
    while(u + 0.55 + 0.45 <= W - 0.4){
      for(var v = 1.0; v + 1.3 <= H - 0.5; v += 1.75){
        o.push(R(u, v, 0.55, 1.3));
        o.push(R(u + 0.62, v + 0.1, 0.38, 0.38, "ch"));
        o.push(R(u + 0.62, v + 0.82, 0.38, 0.38, "ch"));
        n += 2;
      }
      u += 1.35;
    }
    return o;
  }
  function tableReunion(W, H, o){
    var tw = Math.min(W - 2.0, 8), th = Math.min(1.2, H - 2.2);
    if(tw < 1.2 || th < 0.7) return o;
    var u0 = (W - tw) / 2, v0 = (H - th) / 2;
    o.push(R(u0, v0, tw, th));
    for(var u = u0 + 0.35; u + 0.4 <= u0 + tw - 0.1; u += 0.7){
      o.push(R(u, v0 - 0.5, 0.4, 0.4, "ch")); o.push(R(u, v0 + th + 0.1, 0.4, 0.4, "ch"));
    }
    return o;
  }
  function appui(W, H){
    var o = []; etageres(W, H, o, "g", 0.45);

  /* sanitaires : cabines de 0,95 × 1,50 le long du plus grand côté, lavabos en
     face, un passage libre devant elles. Le WC PMR : la cuvette à un demi-

  function wc(W, H, n, pmr){

    }
    var long = H >= W, Lg = long ? H : W, prof = long ? W : H;
    var cabDepth = Math.min(1.5, prof - P.passage);
    var m = Math.max(1, Math.min(n, Math.floor((Lg - 0.9) / 0.95)));

      else { o.push(R(s, H - cabDepth, 0.95, cabDepth, "cab")); cuvette(o, s + 0.475, H, "v+"); }
    }

    o.push(L(0.05, 0.9, 0.05, H - 0.1, "pat"));

    if(W - dz > 3.6) o.push(R(W / 2 - dz / 2 - 0.2, 1.6, 0.4, H - 2.4));

     volées au giron `marche.g` (2h + g ≈ 63 cm, Blondel). La coupe

  function cage(W, H, r){

    var v0 = H - fw - L1;

    /* la coupe passe dans la marche dont le dessus la dépasse */
    var kc = Math.max(1, Math.floor(P.coupe / hm)), vc = Math.min(v1 - 0.3, v0 + (kc - 0.5) * g), dz = 0.3;
    function fleche(u, sens, plein){
      var um = u + fw / 2, cl = plein ? "esc w-vu" : "esc w-dessus";
      o.push(C(um, v0 + 0.12, 0.05, "esc point w-vu"));
      if(plein){ o.push(L(um, v0 + 0.12, um, v1 - 0.12, "esc fleche w-vu")); }
      else { o.push(L(um, v0 + 0.12, um, vc, "esc w-vu")); o.push(L(um, vc, um, v1 - 0.12, "esc fleche w-dessus")); }
      o.push(X(um, v0 - 0.3, sens, 0.4, "esct"));

      var v = v0 + k * g;

    var dl = Math.min(P.porte, wa - 0.3), ug = ws + c + (wa - dl) / 2;

    o.push(R(ug - dl / 2, vl - c - 0.08, dl, 0.05, "w-menuiserie"));
    o.push(L(ug + dl * 0.05, vl - c - 0.25, ug + dl * 0.55, vl - c - 0.25, "esc fleche w-vu"));

  }

  function pour(r, W, H){
    var n = r.n || "";

    if(/^Piscine/i.test(n)) return piscine(W, H);

    if(/ACM/.test(n) && !/Dépôt/.test(n)) return acm(W, H);

    if(/réunion/i.test(n)) return tableReunion(W, H, []);
    if(/détente|pause/i.test(n)) return detente(W, H);

    if(/reproduction/i.test(n)) return repro(W, H);

    if(/WC|Toilette/i.test(n)) return wc(W, H, r.cab || 2);
    if(/Vestiaires (élèves|professeurs)/i.test(n)) return vestiaire(W, H, true);
    if(/Vestiaires de classe/i.test(n)) return vestiaireClasse(W, H);

    if(/rangement|Dépôt|Économat|nettoyage/i.test(n)) return etageres(W, H, [], W > H ? "f" : "gd", 0.5);

<script>
(function(){
  var FAMS = [["cla","Classes"],["adm","Personnel"],["eau","Eau, sanitaires"],["tec","Technique"],

  if(!DATA){ rien("Ouvre cette page depuis l\u2019onglet Typologies du projet."); return; }

  /* ce qu'on REGARDE seulement — niveau, couleurs, calques : une préférence de

  var $ = function(id){ return document.getElementById(id); };

  function ic(n, t){ try { return parent.typoIcone ? parent.typoIcone(n, t) : ""; } catch(e){ return ""; } }

  /* ---------- proposer : Shuffle typologie et sa seed ----------
     Le geste de l'onglet. Il ne touche ni au programme ni aux volumes : seule
     l'ordonnance des pièces change. Le bouton et le champ passent par un seul

  $("ic-shuffle").outerHTML = ic("shuffle", 18);
