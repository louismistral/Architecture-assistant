<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saxon — programme et répartition</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/appbar.css">
<link rel="stylesheet" href="styles/controls.css">
<link rel="stylesheet" href="styles/program.css">
<link rel="stylesheet" href="styles/schema.css">
<link rel="stylesheet" href="styles/mixer.css">
<link rel="stylesheet" href="styles/massing.css">
<link rel="stylesheet" href="styles/doctrine.css">
<link rel="stylesheet" href="styles/juges.css">
<link rel="stylesheet" href="styles/variantes.css">
<link rel="stylesheet" href="styles/parametres.css">
<link rel="stylesheet" href="styles/forensics.css">
</head>
<body>
<a class="skip" href="#panels">Aller au contenu</a>

<!-- Chrome permanent : trois zones. À gauche on choisit OÙ l'on travaille —
     la barre « Atelier et outils » ; au centre le projet et son total vivant ;
     à droite ce qui traverse tous les onglets : les variantes, le compte, le
     thème. Tout le contenu éditorial appartient à l'onglet qu'il décrit. -->
<header class="appbar">
  <div class="appbar__start">
    <button class="btn appbar__nav" type="button" id="navBtn"
            aria-expanded="true" aria-controls="sidenav">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>
      </svg>
      <span>Atelier et outils</span>
    </button>
  </div>

  <a class="appbar__mid" href="#programme">
    <b>Centre scolaire de Saxon</b>
    <!-- Le total vivant. L'ancien chiffre-clé affichait 6'489 m², la part
         chiffrée au règlement — pas le total, qui est 7'025 m². -->
    <span class="mono appbar__tot" id="barTot"></span>
  </a>

  <div class="appbar__end">
    <!-- Les variantes ne sont PAS un onglet : les onglets sont la chronologie
         du concours, et une variante les traverse tous. -->
    <button class="btn appbar__var" type="button" id="varBtn"
            aria-expanded="false" aria-controls="vpanel">
      Variantes<span class="vb-cnt" hidden></span>
    </button>

    <button class="btn btn--icon appbar__prof" type="button" id="profBtn"
            aria-haspopup="dialog" aria-label="Se connecter" title="Se connecter"></button>

    <!-- Le thème et le mode : une liste, deux choix. Rendue par main.js à
         partir de src/data/themes.js. -->
    <div class="menu appbar__theme" id="themeMenu">
      <button class="btn btn--icon" type="button" id="themeBtn"
              aria-haspopup="menu" aria-expanded="false" aria-controls="themeList">
        <span aria-hidden="true" id="themeIcon"></span>
        <span class="vh" id="themeLabel">Thème</span>
      </button>
      <div class="menu__list" id="themeList" role="menu" aria-labelledby="themeBtn" hidden></div>
    </div>
  </div>
</header>

<!-- La barre « Atelier et outils » : une ligne par onglet, numérotée dans
     l'ordre du concours. Elle POUSSE le contenu : le plan et la 3D se recadrent
     au lieu d'être recouverts. Les lignes sont posées par main.js depuis TABS. -->
<nav class="sidenav" id="sidenav" aria-label="Atelier et outils">
  <div class="sidenav__list" id="tabs" role="tablist" aria-orientation="vertical"
       aria-label="Onglets"></div>
</nav>

<main id="panels" role="tabpanel" aria-labelledby="tab-programme" tabindex="-1"></main>

<div id="tip" role="status" aria-live="polite"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
